      {
      id: "log_tp2",
      nombre: "Logística · Guía de Estudio TP N.º 2",
      desc: "Guía de estudio del TP N.º 2 (ROD 19-01 y 19-02, RFD 20-01 y 21-01): Logística de Personal y de Material, Arsenales y Mantenimiento. Leé el desarrollo, repasá conceptos y cronología, y resolvé las 13 preguntas de la guía (escribís y comparás con la respuesta modelo).",
      secciones: [
        {
          titulo: "Los 13 puntos de la guía",
          parrafos: [
            "Logística — TP N.º 2: Logística de Personal · Logística de Material · Arsenales · Mantenimiento.",
            "Objetivo: comprender los conceptos y poder responderlos de manera breve, clara y doctrinaria.",
            "Consignas: 1) Servicios de Logística de Personal. 2) Sistemas de Logística de Personal. 3) Misión del servicio necrológico. 4) Funciones de Logística de Personal. 5) Funciones del Servicio de Construcciones. 6) Definición de Logística de Material. 7) Sistemas logísticos. 8) Sistema Logístico del Ejército. 9) Efectos Finales de Arsenales regulados. 10) Efectos Finales no regulados. 11) Tipos de efectos. 12) Mantenimiento preventivo. 13) Mantenimiento correctivo.",
          ]
        },
        {
          titulo: "Servicios de Logística de Personal",
          parrafos: [
            "La doctrina los define como el conjunto de estructuras y medios que, adecuadamente organizados, instruidos, adiestrados y operados, ejecutan funciones, actividades y tareas de logística de personal.",
            "Su accionar se relaciona en forma particular —aunque no exclusiva— con el mantenimiento de la moral. Son seis servicios: Religioso, Justicia Militar, Sanidad, Postal, Banda y Especiales.",
            "Referencia: ROD 19-01, Cap I, art. 1.006.",
          ]
        },
        {
          titulo: "Sistemas de Logística de Personal",
          parrafos: [
            "Un Sistema de Personal es el conjunto de organizaciones, procedimientos y medios que trabajan coordinadamente para permitir el desarrollo integral de las funciones de personal.",
            "Los sistemas son cinco: Reemplazos, Prisioneros de Guerra, Necrológico, Sanidad y Postal.",
            "Referencia: ROD 19-01, Cap I, art. 1.007.",
          ]
        },
        {
          titulo: "Función y Sistema Necrológico",
          parrafos: [
            "La función necrológica dirige las actividades relacionadas con el personal fallecido: búsqueda y recolección, identificación, registro, evacuación, sepultura o disposición temporal de los restos, y el cuidado y disposición de los efectos personales.",
            "El sistema necrológico reúne organizaciones, instalaciones y personal escalonados en profundidad para ejecutar esa función en operaciones.",
            "Finalidades principales: contribuir al mantenimiento de la moral; crear condiciones adecuadas de sanidad; y cumplir el derecho internacional de los conflictos armados y las normas aplicables.",
            "Actividades fundamentales: búsqueda, recolección y evacuación de restos; identificación y disposición temporal; recolección y disposición de efectos personales; establecimiento y funcionamiento de cementerios militares; preparación de registros e informes.",
          ]
        },
        {
          titulo: "Funciones de Logística de Personal",
          parrafos: [
            "Son agrupamientos convencionales de actividades de personal que persiguen un objetivo común y poseen características técnicas homogéneas, para hacer efectivo el apoyo a las fuerzas mediante servicios. Son once funciones.",
            "Referencia: ROD 19-01, Cap I, art. 1.003.",
          ]
        },
        {
          titulo: "Servicio de Construcciones",
          parrafos: [
            "Dentro del ROD 19-01, Construcciones aparece como una actividad concurrente al campo de Logística de Personal y como un servicio que contribuye al mantenimiento de la moral mediante sus funciones propias.",
            "En operaciones, la atención se centra en procurar el máximo confort posible en las posiciones o alojamientos, siempre compatible con la misión. Las actividades se canalizan por el personal de Construcciones y se coordinan entre el área de Material y el área de Personal.",
            "Referencia: ROD 19-01, Cap VIII, art. 8.020.",
          ]
        },
        {
          titulo: "Logística de Material",
          parrafos: [
            "Es el campo de interés de la conducción que comprende el planeamiento y la ejecución de las acciones necesarias para apoyar con bienes y servicios a la fuerza y garantizar, en forma permanente, su sostén material.",
            "Los recursos materiales son los bienes y servicios empleados para sostener las operaciones. Su obtención, administración, distribución, mantenimiento y empleo deben integrarse al planeamiento de la fuerza.",
            "Referencia: ROD 19-02, Cap I.",
          ]
        },
        {
          titulo: "Sistemas logísticos",
          parrafos: [
            "Un sistema logístico es el conjunto de estructuras orgánicas, medios, procedimientos y métodos que permiten desarrollar las funciones logísticas. Su misión es hacer interactuar ordenadamente los recursos humanos y materiales para alcanzar con efectividad los objetivos establecidos.",
            "El RFD 20-01 señala que las acciones del Sistema Logístico del Ejército se encuentran condicionadas por la existencia de un Sistema Logístico Militar y de un Sistema Logístico Nacional.",
          ]
        },
        {
          titulo: "Sistema Logístico del Ejército",
          parrafos: [
            "Es la combinación de medios y procedimientos que, a partir de un régimen funcional, permite asegurar el sostén logístico a la Fuerza mediante una estructura adaptada a una situación particular.",
            "En palabras simples: determina cómo se organizan y relacionan los medios logísticos del Ejército para que el apoyo llegue a quien lo necesita, en la cantidad, lugar y oportunidad requeridos.",
            "Referencia: RFD 20-01, Cap I, art. 1.003.",
          ]
        },
        {
          titulo: "Efectos Finales de Arsenales",
          parrafos: [
            "Regulados: son los efectos finales que influyen notoriamente en la capacidad operacional de los elementos por su costo, complejidad, dificultad de obtención, peligrosidad y/o escasez. Su administración es centralizada: el Estado Mayor General del Ejército, por el área de Material, establece su administración y la Dirección de Arsenales ejecuta las actividades que le corresponden.",
            "No regulados: son aquellos que no se encuentran incluidos en los índices de Efectos Finales de Arsenales regulados. Su obtención, distribución y baja se ejecutan según el régimen establecido y las necesidades de dotación o reposición, manteniendo el control patrimonial.",
            "Tipos administrativos principales: Efectos Finales Regulados, Efectos Finales No Regulados, Efectos Clase V y V(A), y Repuestos de Arsenales. Los repuestos pueden ser controlados (por su importancia, costo elevado y/o difícil obtención son administrados por el nivel superior) o no controlados.",
          ]
        },
        {
          titulo: "Mantenimiento preventivo",
          parrafos: [
            "Comprende las acciones y servicios planificados que se realizan para conservar el material en condiciones de funcionamiento, detectar oportunamente novedades y evitar o reducir la aparición de fallas.",
            "Características: se realiza antes de que una falla deje fuera de servicio al efecto; es periódico y programable; incluye controles, limpieza, verificación, lubricación y los servicios indicados por la documentación técnica; puede comprender servicios diarios, semanales, periódicos y en condiciones adversas; debe registrarse y programarse conforme a los formularios y publicaciones técnicas.",
          ]
        },
        {
          titulo: "Mantenimiento correctivo",
          parrafos: [
            "Comprende las acciones de reparación que se ejecutan cuando existe una falla, desperfecto o pérdida de aptitud, con la finalidad de restituir el efecto a condiciones de servicio dentro de las capacidades autorizadas al escalón correspondiente.",
            "Se origina por una falla o desperfecto detectado; busca recuperar la aptitud de servicio; cuando la reparación supera la capacidad del escalón, el efecto pasa al nivel de mantenimiento que corresponda; las reparaciones quedan registradas conforme a la documentación reglamentaria.",
          ]
        },
        {
          titulo: "Preventivo vs. Correctivo",
          parrafos: [
            "La diferencia esencial es temporal y funcional: el preventivo actúa antes de que una falla importante deje el material fuera de servicio; el correctivo interviene para recuperar la aptitud cuando existe un defecto o avería que requiere reparación o reemplazo.",
            "Regla de estudio: preventivo = conservar evitando fallas; correctivo = reparar después de la falla.",
          ]
        },

        {"tipo":"guia","p":"2. Describa y explique los Sistemas de Logística de Personal.","r":"Un Sistema de Personal es el conjunto de organizaciones, procedimientos y medios que actúan coordinadamente para desarrollar las funciones de personal. Los sistemas son: Reemplazos, Prisioneros de Guerra, Necrológico, Sanidad y Postal.","f":"ROD 19-01, Cap I, art. 1.007."},
        {"tipo":"guia","p":"3. Misión del servicio NECROLÓGICO.","r":"Doctrinariamente conviene hablar de Función Necrológica y Sistema Necrológico. Su finalidad es dirigir y ejecutar la búsqueda, recolección, identificación, registro, evacuación y disposición temporal de los restos, además del cuidado de los efectos personales. Contribuye a mantener la moral, preservar condiciones sanitarias y cumplir las normas aplicables.","f":"ROD 19-01, Cap IX, arts. 9.001 y 9.006."},
        {"tipo":"guia","p":"4. Defina y describa las Funciones de Logística de Personal.","r":"Son agrupamientos convencionales de actividades de personal que persiguen un objetivo común y permiten hacer efectivo el apoyo a la fuerza. Son once funciones.","f":"ROD 19-01, Cap I, art. 1.003."},
        {"tipo":"guia","p":"5. Defina y describa las Funciones del Servicio de Construcciones.","r":"Dentro de Logística de Personal, Construcciones contribuye al mantenimiento de la moral mediante sus funciones específicas. En operaciones procura el máximo confort posible en posiciones y alojamientos, siempre compatible con la misión.","f":"ROD 19-01, Cap VIII, art. 8.020."},
        {"tipo":"guia","p":"6. Defina Logística de Material.","r":"Es el campo de la conducción que comprende el planeamiento y la ejecución de las acciones necesarias para apoyar a la fuerza con bienes y servicios y asegurar en forma permanente su sostén material.","f":"ROD 19-02, Cap I."},
        {"tipo":"guia","p":"7. Defina Sistemas logísticos.","r":"Un sistema logístico es el conjunto de estructuras orgánicas, medios, procedimientos y métodos que permiten desarrollar las funciones logísticas y hacer interactuar ordenadamente los recursos humanos y materiales para alcanzar los objetivos establecidos.","f":"ROD 19-02, Cap I; RFD 20-01, Cap I, art. 1.002."},
        {"tipo":"guia","p":"8. Defina Sistema Logístico del Ejército.","r":"Es la combinación de medios y procedimientos que, a partir de un régimen funcional y una estructura adaptada a cada situación, permite asegurar el sostén logístico del Ejército.","f":"RFD 20-01, Cap I, art. 1.003."},
        {"tipo":"guia","p":"9. Defina Efectos Finales de Arsenales (regulados).","r":"Son efectos finales que, por su costo, complejidad, dificultad de obtención, peligrosidad y/o escasez, influyen notoriamente en la capacidad operacional. Por esa importancia poseen administración centralizada.","f":"RFD 21-01-III, Introducción y Cap II."},
        {"tipo":"guia","p":"10. Defina Efectos Finales de Arsenales (no regulados).","r":"Son los Efectos Finales de Arsenales que no se encuentran incluidos en los índices de efectos regulados. Se administran conforme al régimen establecido para esa categoría.","f":"RFD 21-01-III, Introducción y Cap II."},
        {"tipo":"guia","p":"11. Describa y explique los tipos de efectos.","r":"Los tipos administrativos principales de Arsenales son: Efectos Finales Regulados, Efectos Finales No Regulados, Efectos Clase V y V(A), y Repuestos de Arsenales. Los repuestos pueden ser controlados o no controlados.","f":"RFD 21-01-III, clasificación administrativa y control patrimonial."},
        {"tipo":"guia","p":"12. Explique el mantenimiento preventivo.","r":"Es el conjunto de acciones y servicios planificados y periódicos destinados a conservar el material en condiciones de funcionamiento, detectar novedades oportunamente y evitar o reducir fallas. Incluye, según el efecto, inspección, limpieza, verificación, lubricación y servicios técnicos.","f":"RFD 21-01-II, Cap I; RFD 21-01-III, Cap III."},
        {"tipo":"guia","p":"13. Explique el mantenimiento correctivo.","r":"Comprende las acciones de reparación realizadas después de detectarse una falla, desperfecto o pérdida de aptitud, con el fin de restituir el efecto a condición de servicio dentro de las capacidades del escalón de mantenimiento correspondiente.","f":"RFD 21-01-III, Cap III; complemento RFD 21-01-II."},
        {"p":"¿Cuáles son los seis Servicios de Logística de Personal?","o":["Religioso, Justicia Militar, Sanidad, Postal, Banda y Especiales","Reemplazos, Prisioneros y Postal","Material, Transporte y Arsenales","Inteligencia, Operaciones y Sanidad"],"c":0,"e":"Servicios = estructuras y medios que ejecutan actividades de personal; se vinculan con la moral.  Referencia: ROD 19-01, Cap I, art. 1.006."},
        {"p":"¿Cuáles son los cinco Sistemas de Personal?","o":["Religioso, Postal, Banda, Sanidad y Justicia Militar","Reemplazos, Prisioneros de Guerra, Necrológico, Sanidad y Postal","Arsenales, Intendencia, Transporte, Veterinaria y Construcciones","Abastecimiento, Mantenimiento, Construcciones, Guardia y Fuego"],"c":1,"e":"Sistemas = organizaciones, procedimientos y medios que actúan coordinadamente.  Referencia: ROD 19-01, Cap I, art. 1.007."},
        {"p":"La hoja del TP habla de 'servicio necrológico'. ¿Cuál es la denominación doctrinaria correcta?","o":["Servicio funerario","Función necrológica y Sistema necrológico","Servicio de Sanidad","Sistema de reemplazos"],"c":1,"e":"Doctrinariamente se habla de Función Necrológica y Sistema Necrológico.  Referencia: ROD 19-01, Cap IX, arts. 9.001 y 9.006."},
        {"p":"¿Qué busca el Servicio de Construcciones dentro del mantenimiento de la moral?","o":["Aumentar el número de efectivos","Procurar el máximo confort posible compatible con la misión","Administrar munición","Organizar reemplazos"],"c":1,"e":"Construcciones busca el máximo confort en posiciones y alojamientos, compatible con la misión.  Referencia: ROD 19-01, Cap VIII, art. 8.020."},
        {"p":"¿Qué característica convierte a un Efecto Final de Arsenales en regulado?","o":["Que siempre es pequeño y de bajo costo","Que su costo, complejidad, obtención, peligrosidad o escasez influye notoriamente en la capacidad operacional","Que pertenece necesariamente a Intendencia","Que no tiene control patrimonial"],"c":1,"e":"Por esa importancia poseen administración centralizada.  Referencia: RFD 21-01-III, Introducción y Cap II."},
        {"p":"¿Cuántas Funciones de Logística de Personal existen?","o":["Cinco","Seis","Once","Tres"],"c":2,"e":"Las funciones son agrupamientos convencionales de actividades de personal.  Referencia: ROD 19-01, Cap I, art. 1.003."},
        {"tipo":"vf","p":"El mantenimiento preventivo se ejecuta únicamente después de que el material falla.","v":false,"e":"Falso: el preventivo se realiza antes de que una falla deje fuera de servicio al efecto; es periódico y programable."},
        {"tipo":"completar","p":"Los Efectos Finales de Arsenales que influyen notoriamente en la capacidad operacional son los ____.","o":["regulados"],"e":"Por costo, complejidad, obtención, peligrosidad o escasez; administración centralizada.  Referencia: RFD 21-01-III."},

      {
      id: "log_parc",
      nombre: "Logística del Material · Guía Parcial",
      desc: "Guía de estudio para el Parcial de Logística del Material: 10 consignas desarrolladas con la doctrina (ROD 19-02, RFD 20-01, RFD 21-01-I/II/III, ROP 19-01 y ROB 00-01). Incluye 10 preguntas de guía para resolver y autoevaluarte, más opción múltiple, V/F y completar.",
      secciones: [
        {
          titulo: "¿Qué es la logística?",
          parrafos: [
            "La logística es el conjunto de actividades destinadas a brindar sostén a las fuerzas, proporcionando los recursos que éstas necesitan con la aptitud adecuada, en la cantidad y calidad requeridas y en el tiempo y lugar oportunos.",
            "Su finalidad esencial es contribuir a que la Fuerza disponga y mantenga la capacidad operacional necesaria para cumplir la misión.",
            "Doctrinariamente la logística no se limita al movimiento de abastecimientos: integra el apoyo logístico de personal, de material, de finanzas y de asuntos territoriales, con coordinación estrecha desde los escalones inferiores hasta los máximos niveles.",
          ]
        },
        {
          titulo: "¿Qué es un efecto?",
          parrafos: [
            "En el lenguaje logístico militar, un efecto o abastecimiento es todo elemento necesario para el equipamiento, mantenimiento y operaciones de las tropas. Abarca bienes consumibles y durables, repuestos y materiales de apoyo.",
            "El reglamento incluye subsistencias, vestuario, equipos, armamento, municiones, combustibles y lubricantes, materiales generales, maquinarias, partes, herramientas y repuestos.",
            "No debe confundirse con “efecto final”, expresión utilizada por Arsenales para bienes completos con regímenes específicos de administración y control.",
          ]
        },
        {
          titulo: "El ciclo logístico",
          parrafos: [
            "Es el proceso obligado mediante el cual se resuelve un problema logístico, cualquiera sea su magnitud. Comprende actividades escalonadas en secuencia lógica destinadas a crear, sostener y mantener las fuerzas.",
            "Fases: a) Determinación de requerimientos: identificar, definir, valorar y traducir la necesidad en un requerimiento concreto (fase crítica). b) Obtención: conseguir los recursos reales capaces de satisfacerla. c) Distribución: hacer llegar los recursos obtenidos a la fuerza, en el lugar y oportunidad requeridos.",
            "Las fases son correlativas e interdependientes; el ciclo se repite en los diferentes escalones de comando.",
          ]
        },
        {
          titulo: "Especialidades y servicios de la logística del material",
          parrafos: [
            "Son la parte de la estructura del Instrumento Militar Terrestre organizada, equipada e instruida para planear y ejecutar las actividades de material.",
            "1) Especialidad de Arsenales: potencia de fuego, movilidad, medios electrónicos, materiales de ingenieros, equipos especiales, máquinas y herramientas; abastecimiento y mantenimiento.",
            "2) Especialidad de Intendencia: alimentación, vestuario y equipo, alojamiento, materiales de oficina y escritura, muebles, combustibles y lubricantes.",
            "3) Servicio de Transporte: desplazamiento de personal y abastecimientos mediante medios no orgánicos del usuario.",
            "4) Servicio de Construcciones y Bienes Raíces: construcción, reparación y mantenimiento de instalaciones e infraestructura, y gestión de bienes raíces.",
            "5) Servicio de Veterinaria: aptitud de los animales, abastecimientos veterinarios, prevención de zoonosis e inspección de productos alimenticios.",
          ]
        },
        {
          titulo: "Funciones de abastecimiento",
          parrafos: [
            "Abastecimiento es la función logística mediante la cual se determinan, obtienen, administran, almacenan, distribuyen y, cuando corresponde, evacúan o dan de baja los efectos necesarios para el sostenimiento de la Fuerza.",
            "Actividades principales (RFD 20-01): determinación de necesidades, catalogación, obtención, control de existencias, almacenamiento, distribución, evacuación o recolección, disposición final y baja.",
          ]
        },
        {
          titulo: "Efectos Clase I, II, III, IV y V",
          parrafos: [
            "Clase I: Alimentos y artículos de consumo relativamente uniforme para personal y ganado (víveres, raciones especiales, agua, artículos de cantina).",
            "Clase II: Efectos de uso terrestre con asignaciones prescriptas en los Cuadros de Organización (vehículos, repuestos de dotación, herramientas, vestuario, equipos y armamento).",
            "Clase III: Combustibles y lubricantes para vehículos, equipos y maquinarias de empleo terrestre.",
            "Clase IV: Efectos no previstos en los Cuadros de Organización y efectos de refuerzo a los de Clase II.",
            "Clase V: Municiones de uso terrestre; también explosivos, minas, espoletas, detonadores, efectos pirotécnicos y otros explosivos.",
            "Para el parcial basta dominar las cinco clases principales y un ejemplo representativo de cada una.",
          ]
        },
        {
          titulo: "Mantenimiento preventivo y correctivo",
          parrafos: [
            "Preventivo: cuidado proporcionado al equipo para conservarlo en condiciones de funcionamiento; incluye inspecciones, lubricación, limpieza, detección y corrección de fallas incipientes. Actúa antes de que una falla lo deje fuera de servicio.",
            "Correctivo: se ejecuta para restituir un equipo a sus condiciones normales de funcionamiento; comprende cambio de partes, reparaciones, ajustes, calibraciones, modificaciones y asistencia técnica.",
            "Diferencia esencial: temporal y funcional. El preventivo evita la falla; el correctivo recupera el material cuando el defecto ya existe.",
          ]
        },
        {
          titulo: "Efectos regulados / no regulados y repuestos controlados / no controlados",
          parrafos: [
            "Efectos finales regulados de Arsenales: influyen notoriamente en la capacidad operacional por costo, complejidad, dificultad de obtención, peligrosidad y/o escasez; administración centralizada y controlada.",
            "Efectos finales no regulados: no se encuentran incluidos en los índices de regulados; régimen administrativo menos restrictivo, con control patrimonial.",
            "Repuestos controlados: por importancia, elevado costo y/o difícil obtención se administran por el nivel superior; se vinculan con conjuntos y subconjuntos.",
            "Repuestos no controlados: los que no figuran en la lista de controlados; mayor descentralización.",
            "Regla de estudio: “regulado” refiere a la administración de efectos finales y “controlado” a la administración de repuestos.",
          ]
        },
        {
          titulo: "Tipos de inspección: formales e informales",
          parrafos: [
            "Inspección formal: organizada y preparada con antelación, ejecutada según una orden, guía o plan de control; requiere coordinación previa, determinación de los aspectos a verificar, formularios o planillas y registro de resultados.",
            "Inspección informal: control más flexible y frecuente, ejecutado personalmente por el jefe o personal calificado; puede usar total o parcialmente los procedimientos y formularios de las formales. Aun informal, el jefe debe contar con una guía o planilla de control y dejar asentado el resultado.",
            "Ambas persiguen conocer la situación real del material, detectar deficiencias, comprobar normas y orientar correcciones. Diferencia: grado de preparación, formalización y alcance.",
          ]
        },
        {
          titulo: "Funciones de la logística del material",
          parrafos: [
            "Son agrupamientos convencionales de actividades vinculadas por un objetivo común y características técnicas y procedimientos homogéneos; mediante ellas se hace efectivo el sostén de la Fuerza.",
            "La doctrina agrupa siete funciones: 1) Abastecimiento, 2) Mantenimiento, 3) Construcciones, 4) Transporte, 5) Bienes raíces, 6) Lucha contra el fuego, 7) Veterinaria.",
            "Deben entenderse como partes interrelacionadas de un mismo sistema: la eficacia del apoyo depende de su coordinación.",
          ]
        },

      preguntas: [
        {"tipo":"guia","p":"1. ¿Qué es la logística?","r":"Es el conjunto de actividades destinadas a brindar sostén a las fuerzas, proporcionando los recursos que éstas necesitan con la aptitud adecuada, en la cantidad y calidad requeridas y en el tiempo y lugar oportunos. Su finalidad esencial es contribuir a que la Fuerza disponga y mantenga la capacidad operacional necesaria para cumplir la misión. Integra el apoyo logístico de personal, de material, de finanzas y de asuntos territoriales.","f":"Base doctrinaria: ROD 19-02 y RFD 20-01."},
        {"tipo":"guia","p":"2. ¿Qué es un efecto?","r":"En el lenguaje logístico militar, un efecto o abastecimiento es todo elemento necesario para el equipamiento, mantenimiento y operaciones de las tropas. Abarca bienes consumibles y durables, repuestos y materiales de apoyo. No debe confundirse con “efecto final”, expresión propia de Arsenales.","f":"Guía Parcial de Logística del Material, consigna 2."},
        {"tipo":"guia","p":"3. Explique el ciclo logístico.","r":"Es el proceso obligado mediante el cual se resuelve un problema logístico. Tiene tres fases correlativas e interdependientes: a) Determinación de requerimientos (crítica), b) Obtención, y c) Distribución. Crea, sostiene y mantiene las fuerzas mediante el procesamiento de los recursos logísticos.","f":"Guía Parcial de Logística del Material, consigna 3."},
        {"tipo":"guia","p":"4. Especialidades y servicios de la logística del material.","r":"Son: 1) Especialidad de Arsenales (potencia de fuego, movilidad, medios electrónicos, materiales de ingenieros, máquinas y herramientas); 2) Especialidad de Intendencia (alimentación, vestuario y equipo, alojamiento, combustibles y lubricantes); 3) Servicio de Transporte (desplazamiento con medios no orgánicos); 4) Servicio de Construcciones y Bienes Raíces (instalaciones e infraestructura y bienes raíces); 5) Servicio de Veterinaria (animales, abastecimientos veterinarios y zoonosis).","f":"Guía Parcial de Logística del Material, consigna 4."},
        {"tipo":"guia","p":"5. Funciones de abastecimiento (Ab).","r":"Es la función logística mediante la cual se determinan, obtienen, administran, almacenan, distribuyen y, cuando corresponde, evacúan o dan de baja los efectos. Actividades principales: determinación de necesidades, catalogación, obtención, control de existencias, almacenamiento, distribución, evacuación o recolección, disposición final y baja.","f":"RFD 20-01."},
        {"tipo":"guia","p":"6. Efectos Clase I, II, III, IV y V.","r":"Clase I: alimentos y artículos de consumo relativamente uniforme para personal y ganado. Clase II: efectos de uso terrestre prescriptos en Cuadros de Organización. Clase III: combustibles y lubricantes. Clase IV: efectos no previstos y de refuerzo. Clase V: municiones de uso terrestre.","f":"Guía Parcial de Logística del Material, consigna 6."},
        {"tipo":"guia","p":"7. Mantenimiento preventivo y correctivo.","r":"Preventivo: cuidado planificado para conservar el equipo en condiciones de funcionamiento (inspección, lubricación, limpieza, corrección de fallas incipientes); actúa antes de que una falla lo deje fuera de servicio. Correctivo: restituye el equipo a sus condiciones normales cuando existe un defecto o avería; comprende cambios de partes, reparaciones, ajustes y calibraciones.","f":"Guía Parcial de Logística del Material, consigna 7."},
        {"tipo":"guia","p":"8. Efectos regulados / no regulados y repuestos controlados / no controlados.","r":"Los efectos finales regulados influyen notoriamente en la capacidad operacional por costo, complejidad, obtención, peligrosidad o escasez y poseen administración centralizada; los no regulados no figuran en los índices y tienen régimen menos restrictivo con control patrimonial. Los repuestos controlados se administran por el nivel superior; los no controlados, por el régimen para ellos establecido. Regla: “regulado” refiere a efectos finales; “controlado”, a repuestos.","f":"RFD 21-01-III."},
        {"tipo":"guia","p":"9. Tipos de inspección: formales e informales.","r":"La inspección formal es organizada y preparada con antelación, según orden, guía o plan de control, con formularios y registro de resultados. La informal es un control más flexible y frecuente, ejecutado por el jefe o personal calificado, que puede adaptar los procedimientos formales; aun así, requiere guía o planilla de control y dejar asentado el resultado.","f":"RFD 21-01-III."},
        {"tipo":"guia","p":"10. Funciones de la logística del material.","r":"Son agrupamientos convencionales de actividades con objetivo común y procedimientos homogéneos. La doctrina agrupa siete funciones: abastecimiento, mantenimiento, construcciones, transporte, bienes raíces, lucha contra el fuego y veterinaria. La eficacia del apoyo depende de su coordinación.","f":"Guía Parcial de Logística del Material, consigna 10."},
        {"p":"¿Cuál es la finalidad esencial de la logística?","o":["Contribuir a que la Fuerza disponga y mantenga la capacidad operacional necesaria para cumplir la misión","Aumentar el número de efectivos disponibles","Administrar únicamente el combustible","Asignar vacantes al personal"],"c":0,"e":"La logística brinda sostén con aptitud, cantidad, calidad, tiempo y lugar oportunos.  Referencia: ROD 19-02."},

var LS = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function estUsuarios(){ return LS.get('est_usuarios', []); }
function estUid(){ return LS.get('est_uid', ''); }
function estUsuario(){ var u = estUid(); if (!u) return null; var r = estUsuarios().filter(function(x){ return x.id === u; }); return r.length ? r[0] : null; }
function estGuardarUsuarios(list){ LS.set('est_usuarios', list); }
function KEYU(){ var u = estUid(); return u ? 'u' + u + '_' : ''; }
var KEYQ = function(id){ return 'est_' + KEYU() + 'quiz_' + id; };
var KEYR = function(id){ return 'est_' + KEYU() + 'repaso_' + id; };
var KEYF = function(id){ return 'est_' + KEYU() + 'fallos_' + id; };
function fallosTema(id){ return LS.get(KEYF(id), {}); }
function hashP(p){ var s = String(p).toLowerCase(); var h = 0; for (var i = 0; i < s.length; i++){ h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; } return (h >>> 0).toString(36); }
function sumarFallo(id, p){ var f = fallosTema(id); var k = hashP(p); f[k] = (f[k] || 0) + 1; LS.set(KEYF(id), f); }
function restarFallo(id, p){ var f = fallosTema(id); var k = hashP(p); if (f[k] > 0){ f[k]--; } LS.set(KEYF(id), f); }
function aplicarTema(){
  var d = LS.get('est_tema', 'claro');
  var html = document.documentElement;
  var btnT = document.getElementById('btnTema');
  if (d === 'oscuro'){ html.classList.add('dark'); if (btnT) btnT.textContent = '☀️'; var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', '#11141d'); }
  else { html.classList.remove('dark'); if (btnT) btnT.textContent = '🌙'; var m2 = document.querySelector('meta[name=theme-color]'); if (m2) m2.setAttribute('content', '#3d5afe'); }
}
function alternarTema(){ LS.set('est_tema', document.documentElement.classList.contains('dark') ? 'claro' : 'oscuro'); aplicarTema(); }
function pintarLogin(){
  document.getElementById('hdTitle').textContent = 'Estudio · Acceso';
  var bU = document.getElementById('btnUser'); if (bU) bU.textContent = '👤';
  var us = estUsuarios();
  var h = '<div class="login"><div class="card"><h2>¿Quién está estudiando?</h2>' +
    '<p class="sub">Cada persona tiene su propio progreso y su repaso inteligente. Seleccioná tu nombre, poné tu clave y tocá Entrar.</p>';
  if (us.length){
    h += '<div class="sub" style="margin:2px 0 6px">Tu nombre</div>' +
      '<select class="in" id="selUsuario">' + us.map(function(u){
        return '<option value="' + u.id + '"' + (u.id === estUid() ? ' selected' : '') + '>' + esc(u.nombre) + '</option>';
      }).join('') + '</select>' +
      '<div class="sub" style="margin:2px 0 6px">Tu clave</div>' +
      '<input class="in pin" id="selPin" type="password" inputmode="numeric" maxlength="6" placeholder="• • • •" autocomplete="current-password" style="font-size:22px;letter-spacing:10px" onkeydown="if(event.key===\'Enter\'){entrarLogin()}">' +
      '<button class="bigbtn" onclick="entrarLogin()">Entrar 🍀</button>' +
      '<button class="bigbtn ghost" onclick="borrarSel()" style="margin-top:-4px">🗑 Borrar este usuario</button>' +
      '<p class="note" style="margin-top:8px">¿No está tu nombre? Creá un perfil abajo.</p>';
  } else {
    h += '<p class="note">Todavía no hay ningún estudiante. Creá el primero abajo.</p>';
  }
  h += '<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h3>Agregar una persona</h3>' +
    '<input class="in" id="nuevoNom" placeholder="Nombre (ej: Valentina)">' +
    '<input class="in pin" id="nuevoPin" type="password" inputmode="numeric" maxlength="6" placeholder="Clave (mínimo 3 dígitos)">' +
    '<button class="bigbtn" onclick="crearUsuario()">Crear y entrar</button>' +
    '<p class="note" style="margin-top:10px">La clave la decidís vos: se la ponés a cada estudiante y esa persona la tiene que saber para entrar.</p>' +
    '</div></div>';
  document.getElementById('view').innerHTML = h;
  var pin = document.getElementById('selPin'); if (pin) pin.focus();
}
function borrarSel(){
  var sel = document.getElementById('selUsuario');
  if (!sel || !sel.value) return;
  borrarUsuario(sel.value);
}
function entrarLogin(){
  var sel = document.getElementById('selUsuario');
  var id = sel ? sel.value : '';
  if (!id){ alert('Primero creá un estudiante.'); return; }
  var u = estUsuarios().filter(function(x){ return x.id === id; })[0];
  if (!u) return pintarLogin();
  var pin = (document.getElementById('selPin') || {}).value || '';
  if (String(pin).trim() !== u.clave){ alert('Clave incorrecta. Pedile la clave a quien administra la app.'); return; }
  entrarUsuario(id);
}
function crearUsuario(){
  var nom = (document.getElementById('nuevoNom') || {}).value || '';
  var pin = (document.getElementById('nuevoPin') || {}).value || '';
  nom = nom.trim(); pin = String(pin).trim();
  if (!nom || pin.length < 3){ alert('Poné un nombre y una clave de al menos 3 caracteres.'); return; }
  var list = estUsuarios();
  if (list.some(function(x){ return x.nombre.toLowerCase() === nom.toLowerCase(); })){ alert('Ya existe un estudiante con ese nombre.'); return; }
  var id = 'u' + Date.now().toString(36);
  list.push({ id: id, nombre: nom, clave: pin });
  estGuardarUsuarios(list);
  tg('👤 Se creó el perfil: ' + nom + ' (' + devTag() + ')', 'new');
  entrarUsuario(id);
}
function borrarUsuario(id){
  if (!confirm('¿Borrar a esta persona y todo su progreso? Esta acción no se puede deshacer.')) return;
  var list = estUsuarios().filter(function(x){ return x.id !== id; });
  estGuardarUsuarios(list);
  if (estUid() === id) LS.set('est_uid', '');
  pintarLogin();
}
function entrarUsuario(id){
  LS.set('est_uid', id);
  var u = estUsuario();
  var bU = document.getElementById('btnUser');
  if (bU) bU.textContent = u ? u.nombre.charAt(0).toUpperCase() : '👤';
(function iniciar(){
  aplicarTema();
  if ('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
  if (estUsuario()){ home(); } else { pintarLogin(); }
})();
}
function pantallaLogin(){ pintarLogin(); }
function compartirNota(pct, tema){
  var texto = '📚 Sac\u00e9 ' + pct + '% en "' + tema + '" con la app de Estudio. ¿Lo super\u00e1s?';
  var url = 'https://flavioleonardovillarroel-boop.github.io/estudio/';
  function mostrar(txt){
    var e = document.getElementById('shareMsg');
    if (e) e.innerHTML = txt;
  }
  function copiar(){
    var tx = document.createElement('textarea');
    tx.value = texto + ' ' + url;
    tx.style.position = 'fixed'; tx.style.opacity = '0';
    document.body.appendChild(tx); tx.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(err){}
    tx.remove();
    mostrar(ok ? '<b style="color:var(--ok)">Copiado al portapapeles: pegalo donde quieras (WhatsApp, nota...).</b>' +
      ' También pod\u00e9s <a href="https://wa.me/?text=' + encodeURIComponent(texto + ' ' + url) + '" target="_blank" style="color:var(--accent)">abrir WhatsApp</a>.' :
      'Ac\u00e1 va tu resultado: ' + texto + ' ' + url);
  }
  if (navigator.share){ navigator.share({ text: texto, url: url }).catch(function(){}); }
  else if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto + ' ' + url).then(function(){ mostrar('<b style="color:var(--ok)">Copiado al portapapeles: pegalo donde quieras (WhatsApp, nota...).</b>'); }, copiar);
  } else { copiar(); }
}

  var ids = new Set(m.unidades);
  var temas = CONTENIDO.temas.filter(function(t){ return ids.has(t.id); });
  var preg = temas.reduce(function(a, t){ return a + t.preguntas.length; }, 0);
  var qs = temas.filter(function(t){ return LS.get(KEYQ(t.id), null) !== null; }).length;
  return '<div class="materia" onclick="abrirMateria(\'' + m.id + '\')"><div class="ico">' + (m.icono || '📚') + '</div>' +
    '<b>' + m.nombre + '</b>' +
    '<div class="mDesc">' + m.descripcion + '</div>' +
    '<div class="row note" style="margin-top:10px;gap:14px"><span>📚 ' + temas.length + ' ' + (temas.length === 1 ? 'unidad' : 'unidades') + '</span><span>❓ ' + preg + ' preguntas</span>' +
    (qs ? '<span style="color:var(--ok)">✓ ' + qs + ' con quiz</span>' : '') + '</div></div>';
}

    '<div class="prog"><i style="width:' + Math.min(66, (q || 0) + (rn ? 6 : 0)) + '%"></i></div>' +
    (q !== null || rn ? '<span class="note">' + (q !== null ? 'Quiz: ' + Math.round(q) + '%' : '') + (rn ? ' · repaso: ' + rn : '') + '</span>' : '<span class="note">Sin empezar</span>') +
    '</div>';
}

  var h = '<h2>¿Qué querés estudiar hoy?</h2>' + (CONTENIDO.nota ? '<p class="sub">' + CONTENIDO.nota + '</p>' : '');

  var materias = CONTENIDO.materias || [];
  var enMateria = {};
  materias.forEach(function(m){ m.unidades.forEach(function(id){ enMateria[id] = true; }); });

function abrirTema(id){
  var t = getTema(id); if (!t) return home();

    '<button data-v="crono" onclick="vista(\'' + id + '\',\'crono\',this)">Cronología</button>' +
    '<button data-v="quiz" onclick="vista(\'' + id + '\',\'quiz\',this)">Examen</button></div>' +
    '<div id="bodyVista"></div>';

function getTema(id){ return CONTENIDO.temas.find(function(x){ return x.id === id; }); }
function vista(id, v, btn){
  var t = getTema(id);
  if (btn){ document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on', b === btn); }); }
  var body = document.getElementById('bodyVista');
  if (v === 'leer') leer(t, body);
  else if (v === 'conceptos') conceptos(t, body);
  else if (v === 'crono') crono(t, body);
  else quiz(t, body);
  window.scrollTo(0, 0);
}

function resaltar(texto, t){
  var lista = t.conceptos.slice().sort(function(a, b){ return b.t.length - a.t.length; })
    .map(function(c){ return c.t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
  if (!lista.length) return texto;
  var re = new RegExp('(?<![A-Za-zÀ-ÿ0-9])(' + lista.join('|') + ')(?![A-Za-zÀ-ÿ0-9])', 'gi');
  return texto.replace(re, function(m){
    return '<span class="hl" onclick="ficha(\'' + t.id + '\',this)">' + m + '</span>';
  });
}
function leer(t, body){
  var chips = t.secciones.map(function(s, i){
    return '<span class="sec" onclick="irSec(' + i + ')">' + (i + 1) + ') ' + s.titulo + '</span>';
  }).join('');
  body.innerHTML = '<div class="card"><div class="sub">Secciones de la clase (tocá para ir directo):</div>' + chips + '</div>' +
    '<div id="secs">' + t.secciones.map(function(s){
      return '<div class="card sec-blk"><h3>' + s.titulo + '</h3>' +
        s.parrafos.map(function(p){ return '<p>' + resaltar(p, t) + '</p>'; }).join('') + '</div>';
    }).join('') + '</div>' +

  var duros = LS.get('est_duros_' + t.id, []);
  function pintar(){
    if (i >= cards.length){

      return { q: q, tipo: tipo, orden: orden, correcta: orden.findIndex(function(x){ return x.i === q.c; }) };
    }
    if (tipo === 'vf') return { q: q, tipo: tipo, correcta: q.v ? 0 : 1 };

        '<div class="row"><button class="bigbtn" id="qRevelar">🔎 Revelar respuesta modelo</button></div>' +
        '<div id="qGModel" style="display:none"></div>' +
        '<div class="row" id="qGAssess" style="display:none"><button class="okbtn bigbtn" id="qGYes">✅ La sabía</button><button class="badbtn bigbtn" id="qGNo">No la sabía</button></div>';
    } else {
      html += '<div class="sub" style="margin-bottom:8px">Completá la frase:</div>' +
        '<div style="font-size:15.5px;line-height:2;margin:6px 0 12px">' + fraseConInput(q.p) + '</div>' +
        '<button class="bigbtn" id="qOkReal">Responder</button>';
    }
    html += '<div class="fdb" id="qFdb"></div><div class="correc" id="qCorrec" style="display:none"></div>' +
      '<div class="expl" id="qExpl" style="display:none"></div></div>' +
      '<div class="row" style="margin-top:4px"><button class="bigbtn" id="qNext" style="display:none">Siguiente pregunta →</button></div>';
    body.innerHTML = html;
    function terminar(sel, correcto, mal){
      if (respondida) return;
      respondida = true;
      if (timerIv){ clearInterval(timerIv); timerIv = null; }
      body.querySelectorAll('.qbtn').forEach(function(x){ x.dataset.resolved = '1'; x.disabled = true; });
      var rb = document.getElementById('qOkReal'); if (rb) rb.disabled = true;
      if (correcto){ ok++; okTipo[tipo]++; restarFallo(t.id, q.p); }
      else { fallos.push({ q: q, mal: mal || '(sin responder)' }); sumarFallo(t.id, q.p); }
      if (tipo === 'completar'){
        var inp = document.getElementById('qBlank');
        if (inp){ inp.disabled = true; inp.style.borderColor = correcto ? 'var(--ok)' : 'var(--bad)'; }
      } else {
        var right = body.querySelector('.qbtn[data-v="' + c.correcta + '"]');
        if (right) right.classList.add('sel-ok');
        if (!correcto){ var selB = body.querySelector('.qbtn[data-v="' + sel + '"]'); if (selB) selB.classList.add('sel-bad'); }
      }
      var e = document.getElementById('qExpl');
      var cor = document.getElementById('qCorrec');
      var f = document.getElementById('qFdb');
      f.innerHTML = correcto ? '<b>¡Correcto!</b>' : '<b>Incorrecto</b>';
      f.style.cssText = 'color:' + (correcto ? 'var(--ok)' : 'var(--bad)');
      if (!correcto){
        cor.innerHTML = 'Respuesta correcta: <b>' + esc(respuestaCorrecta(q)) + '</b>' +
          (mal ? '<div class="note">Tu respuesta: ' + esc(mal) + '</div>' : '');
        cor.style.display = 'block';
      }
      if (q.e){ e.innerHTML = '<b>Explicación:</b> ' + q.e; e.style.display = 'block'; }
      var next = document.getElementById('qNext');
      var ultima = idx >= cola.length - 1;
      next.textContent = ultima ? 'Ver mi nota final ▶' : 'Siguiente pregunta →';
      next.style.display = 'inline-block';
      next.onclick = function(){
        if (ultima){ done = true; } else { idx++; }
        pintar();
      };
    }
    if (timerActivo){
      var tt = document.getElementById('qTimer');
      if (tt){
        var seg = 60;
        timerIv = setInterval(function(){
          seg--;
          if (seg <= 0){
            if (timerIv){ clearInterval(timerIv); timerIv = null; }
            if (tt){ tt.textContent = '⏱ 0s'; tt.classList.add('tick'); }
            terminar(-1, false, '(tiempo agotado)');
            return;
          }
          if (tt){ tt.textContent = '⏱ ' + seg + 's'; tt.classList.toggle('tick', seg <= 10); }
        }, 1000);
      }
    }
    if (tipo === 'completar'){
      var btn = document.getElementById('qOkReal');
      btn.onclick = function(){
        if (btn.dataset.resolved) return;
        btn.dataset.resolved = '1';
        btn.disabled = true;
        var inp = document.getElementById('qBlank');
        var val = inp ? inp.value : '';
        var normVal = norm(val);
        var hit = normVal !== '' && q.o.some(function(palabra){ return norm(palabra) === normVal; });
        terminar(-1, hit, val || '(en blanco)');
      };
      var inp = document.getElementById('qBlank');
      if (inp) inp.onkeydown = function(ev){ if (ev.key === 'Enter' && !btn.disabled) btn.click(); };
    } else if (tipo === 'guia'){
      var rev = document.getElementById('qRevelar');
      rev.onclick = function(){
        if (rev.dataset.resolved) return;
        rev.dataset.resolved = '1';
        rev.disabled = true;
        var tx = document.getElementById('qGui'); if (tx) tx.disabled = true;
        var gm = document.getElementById('qGModel');
        gm.style.display = 'block';
        gm.innerHTML = '<div class="card" style="margin:10px 0 0;background:var(--soft)"><b style="color:var(--ok)">Respuesta modelo:</b><div style="line-height:1.55;margin-top:6px">' + esc(q.r) + '</div>' +
          (q.f ? '<div class="note" style="margin-top:8px">📌 ' + esc(q.f) + '</div>' : '') + '</div>';
        document.getElementById('qGAssess').style.display = 'flex';
      };
      document.getElementById('qGYes').onclick = function(){ terminar(-1, true, '(la sabía)'); };
      document.getElementById('qGNo').onclick = function(){ terminar(-1, false, '(no la sabía)'); };
    } else {
      body.querySelectorAll('.qbtn').forEach(function(b){
        b.onclick = function(){
          if (b.dataset.resolved) return;
          var sel = Number(b.dataset.v);
          b.dataset.resolved = '1';
          var mal = tipo === 'vf' ? (sel === 0 ? 'Verdadero' : 'Falso') : c.orden[sel].t;
          terminar(sel, sel === c.correcta, mal);
        };
      });
    }
  }
  pintar();
}

aplicarTema();
if ('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
pintarLogin();
</script>
