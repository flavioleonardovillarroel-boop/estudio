      preguntas: [
        {"p":"¿Cómo se define conceptualmente la fase de ejecución dentro del proceso de enseñanza-aprendizaje militar?","o":["La fase en la que el planeamiento se convierte en acción educativa concreta","El diagnóstico inicial del grupo","El momento de escribir el plan","La calificación final del ciclo"],"c":0,"e":"La ejecución es la fase en la que el planeamiento didáctico se convierte en acción educativa concreta. Comprende la interacción organizada entre educador, educandos, contenidos, métodos, medios y escenario para alcanzar las competencias y capacidades previstas. En el ámbito militar, exige conducir el aprendizaje con disciplina, realismo, seguridad y participación activa, sin apartarse de los objetivos ni de las prescripciones establecidas.  Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.001, incs. a a d, pág. Cap. III-1 (PDF pág. 45)."},
        {"p":"¿Cuáles son las características principales que identifican la fase de ejecución de la instrucción?","o":["Activa, dinámica, flexible, progresiva y realista","Pasiva, rígida y solo teórica","Estática y formal","Improvisada y sin objetivos"],"c":0,"e":"Se caracteriza por ser activa, dinámica, flexible, progresiva, realista y orientada a resultados observables. Es activa porque el educando aprende haciendo; dinámica porque obliga a ajustar métodos y ritmo; flexible porque el instructor debe responder a dificultades imprevistas; progresiva porque avanza desde tareas simples hacia otras más complejas; y realista porque procura reproducir las condiciones en las que se aplicará lo aprendido. En todo momento debe mantenerse la seguridad y la relación con el desempeño profesional.  Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.002, incs. a a e, pág. Cap. III-1 (PDF pág. 45)."},
        {"p":"Mencione y explique brevemente las tareas previas que todo educador debe realizar antes de iniciar el acto educativo.","o":["Estudiar el plan, dominar contenidos, preparar escenario y medios","Solo revisar la asistencia","Entregar las calificaciones","Redactar el reglamento"],"c":0,"e":"Antes de comenzar, el educador debe estudiar el plan de clase o de instrucción; dominar los contenidos; verificar objetivos, estándares e indicadores; conocer las características del grupo; preparar el escenario; comprobar los Medios Auxiliares para la Educación; coordinar apoyos; prever riesgos y medidas de seguridad; organizar tiempos y actividades; y ensayar demostraciones o procedimientos cuando corresponda. También debe confirmar la disponibilidad del material, el estado del equipo y las condiciones administrativas necesarias.  Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.003, incs. a a k, págs. Cap. III-1 y III-2 (PDF págs. 45 y 46)."},
        {"p":"¿Por qué la ejecución es considerada la materialización sobre el terreno o en el aula del planeamiento didáctico realizado previamente?","o":["Se aplican las decisiones de qué, para qué, secuencia, método y comprobación","Porque se reescribe el plan en clase","Porque se cancela la actividad","Porque el instructor no interviene"],"c":0,"e":"Porque durante la ejecución se aplican las decisiones adoptadas en el planeamiento: qué enseñar, para qué hacerlo, en qué secuencia, con qué método, mediante qué actividades y cómo comprobar el aprendizaje. El plan deja de ser una previsión escrita y se transforma en conductas del instructor y de los educandos. La calidad de esta fase permite verificar si lo planificado era adecuado y si debe ajustarse durante o después de la actividad.  Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.002, incs. a, b, d y e, pág. Cap. III-1 (PDF pág. 45)."},
        {"p":"¿Qué implicancias tiene para el instructor el correcto acondicionamiento y preparación del escenario educativo antes de la llegada de los educandos?","o":["Un lugar seguro y funcional que evita demoras y concentra el tiempo en aprender","Solo un tema estético","Ninguna consecuencia","Un requisito para evaluar"],"c":0,"e":"Implica asumir la responsabilidad de que el lugar sea seguro, funcional y coherente con la actividad. El instructor debe ordenar el espacio, verificar iluminación, ventilación, visibilidad y circulación; ubicar materiales y MAPE; probar equipos; eliminar riesgos; delimitar sectores; y prever alternativas ante fallas. Una preparación adecuada evita demoras, reduce distracciones, transmite profesionalismo y permite concentrar el tiempo disponible en el aprendizaje.  Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.003, incs. a a k, págs. Cap. III-1 y III-2 (PDF págs. 45 y 46); y art. 3.006, inc. c, págs. Cap. III-5 a III-7 (PDF págs. 49 a 51)."},
        {"p":"¿Cómo influye el ejercicio del mando y el liderazgo del educador en la efectividad durante la ejecución de la instrucción?","o":["Dan dirección, cohesión y sentido con firmeza, respeto y coherencia","Imponen autoridad arbitraria","Eliminan toda norma","Solo motivan con palabras"],"c":0,"e":"El mando y el liderazgo dan dirección, cohesión y sentido al acto educativo. El educador establece normas claras, mantiene la disciplina, motiva con el ejemplo, comunica con precisión y genera confianza para preguntar y corregir errores. Su autoridad debe ejercerse con firmeza, respeto, justicia y coherencia. Cuando conduce bien, el grupo comprende la finalidad de la actividad, participa y sostiene el esfuerzo necesario para alcanzar el estándar.  Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.006, incs. e.1 y f, págs. Cap. III-8 y III-9 (PDF págs. 52 y 53); Sección IV, art. 3.020, inc. b.2.a, pág. Cap. III-17 (PDF pág. 61)."},
        {"p":"Estructure y nombre los tres pasos fundamentales que componen la ejecución de la instrucción.","o":["Inicio, desarrollo y final","Planeamiento, ejecución y evaluación","Análisis, decisión y preparación","Diagnóstico, medición y calificación"],"c":0,"e":"La ejecución se organiza en tres pasos: Inicio, Desarrollo y Final. El Inicio dispone al educando para aprender y presenta la finalidad de la actividad. El Desarrollo concentra la enseñanza, la práctica y la aplicación de los contenidos. El Final integra lo aprendido, comprueba los resultados, corrige errores y orienta la continuidad del aprendizaje.  Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.004, pág. Cap. III-2 (PDF pág. 46)."},
        {"p":"Describa los objetivos del Primer Paso Inicio. ¿Qué elementos pedagógicos y motivacionales deben incluirse en este paso?","o":["Captar la atención, motivar y recuperar saberes previos","Evaluar con un examen parcial","Repartir el material","Entregar notas"],"c":0,"e":"El Inicio busca captar la atención, generar disposición para aprender y relacionar el nuevo contenido con conocimientos previos. Debe incluir la presentación del tema y de su utilidad profesional, una motivación vinculada con una situación concreta, la recuperación de saberes previos, la comunicación de los resultados esperados y la explicación breve de cómo se desarrollará la actividad. También se aclaran normas, organización y medidas de seguridad cuando correspondan.  Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.005, incs. a, b.1 a b.3 y c, págs. Cap. III-2 y III-3 (PDF págs. 46 y 47)."},
        {"p":"¿En qué consiste el Segundo Paso Desarrollo y por qué constituye el centro de gravedad del acto educativo?","o":["Enseñar, demostrar, practicar y aplicar los contenidos","Solo escuchar al instructor","Cerrar la actividad","Entregar certificados"],"c":0,"e":"El Desarrollo es el momento en que se enseñan, demuestran, practican y aplican los conocimientos, procedimientos y actitudes previstos. Constituye el centro de gravedad porque allí se produce la mayor parte de la actividad del educando y se construye la competencia. El instructor organiza experiencias progresivas, observa el desempeño, formula preguntas, corrige, retroalimenta y modifica el ritmo cuando la situación lo exige.  Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.006, introducción e incs. a a f, págs. Cap. III-3 a III-9 (PDF págs. 47 a 53)."},
        {"p":"Explicite el rol que asume el educador militar durante la fase de desarrollo al aplicar el enfoque de educación basada en competencias.","o":["Conductor, facilitador, demostrador y evaluador del desempeño","Un mero expositor de contenidos","Un observador pasivo","Un espectador del grupo"],"c":0,"e":"El educador actúa como conductor, facilitador, demostrador y evaluador del desempeño. Presenta situaciones profesionales, explica criterios, muestra procedimientos, asigna tareas, observa evidencias y proporciona retroalimentación inmediata. No se limita a transmitir información: crea oportunidades para que el educando integre saberes, habilidades y actitudes y pueda actuar con autonomía creciente dentro de los límites establecidos.  Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.006, incs. d.1 a d.7 y e.1 a e.4, págs. Cap. III-8 y III-9 (PDF págs. 52 y 53)."},
        {"p":"¿Qué tipo de actividades debe realizar el educando durante el desarrollo para asegurar un aprendizaje activo y la consolidación de competencias?","o":["Observar con propósito, preguntar, analizar, practicar, decidir y justificar","Copiar el pizarrón","Escuchar sin participar","Memorizar listas"],"c":0,"e":"Debe observar con propósito, formular preguntas, analizar situaciones, resolver problemas, practicar procedimientos, trabajar individualmente y en equipo, tomar decisiones, justificar respuestas y corregir su actuación a partir de la retroalimentación. Las actividades deben exigir una participación real y progresiva, con oportunidades de repetición consciente y aplicación en situaciones semejantes a las del futuro desempeño.  Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.006, incs. d.1 a d.7 y e.1 a e.4, págs. Cap. III-8 y III-9 (PDF págs. 52 y 53)."},
        {"p":"Defina la importancia del Tercer Paso Final y mencione qué actividades clave deben realizarse en él.","o":["Integrar, comprobar qué se aprendió, corregir, retroalimentar y orientar la continuidad","Iniciar la práctica","Presentar temas nuevos","Solo despedir al grupo"],"c":0,"e":"El Final permite integrar la experiencia y determinar qué se aprendió. El instructor realiza una síntesis de los conceptos centrales, comprueba el aprendizaje mediante preguntas o tareas breves, corrige errores relevantes, efectúa la crítica, brinda retroalimentación, evacua dudas y relaciona el resultado con próximas actividades. También dispone la restitución del escenario y controla el material y equipo empleados.  Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.007, incs. a a c, págs. Cap. III-9 y III-10 (PDF págs. 53 y 54)."},
        {"p":"¿Cuál es la diferencia sustancial entre la síntesis que realiza el instructor al final de la clase y la comprobación del aprendizaje alcanzado por los educandos?","o":["La síntesis ordena; la comprobación exige respuesta del educando y produce evidencia","Son exactamente lo mismo","La comprobación la hace solo el instructor","La síntesis demuestra el aprendizaje"],"c":0,"e":"La síntesis es una acción del instructor que ordena y relaciona los contenidos esenciales para facilitar su comprensión. La comprobación, en cambio, exige una respuesta o actuación del educando y produce evidencia sobre lo que realmente aprendió. Una buena síntesis puede aclarar el tema, pero no demuestra por sí sola que el educando haya alcanzado la capacidad prevista.  Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.007, incs. a a c, págs. Cap. III-9 y III-10 (PDF págs. 53 y 54); y Sección I, art. 3.001, inc. d, pág. Cap. III-1 (PDF pág. 45)."},
        {"p":"¿Cómo se realiza la crítica y la retroalimentación al finalizar una sesión de instrucción en el ámbito militar?","o":["Objetiva, oportuna y centrada en conductas y resultados","Descalificaciones personales","Solo felicitar","Dejarla para otro día"],"c":0,"e":"Se realiza de manera objetiva, oportuna y orientada a mejorar el desempeño. Primero se recuerda la tarea y el estándar; luego se señalan los aciertos, los errores observables y sus causas; finalmente se indica cómo corregirlos y qué debe practicarse. La crítica debe centrarse en conductas y resultados, no en descalificaciones personales. Cuando es posible, se invita al educando a autoevaluarse antes de recibir la apreciación del instructor.  Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.007, incs. a a c, págs. Cap. III-9 y III-10 (PDF págs. 53 y 54); Sección VI, art. 3.030, inc. a.5, pág. Cap. III-24 (PDF pág. 68)."},
        {"p":"¿Qué medidas debe adoptar el instructor en la fase final respecto de los MAPE y el vestuario o equipo utilizado?","o":["Cesar la actividad, comprobar cantidades, ordenar y asegurar el almacenamiento","Dejar los medios donde están","Descartarlos sin control","Olvidar la restitución"],"c":0,"e":"Debe ordenar el cese de la actividad, comprobar cantidades y estado, limpiar y acondicionar los elementos, registrar novedades, devolverlos a sus responsables y asegurar su almacenamiento. Si se utilizó vestuario o equipo especial, debe verificar su correcta restitución y cualquier daño o faltante. El escenario debe quedar en condiciones y los medios sensibles o peligrosos deben controlarse conforme a las normas vigentes.  Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.003, incs. d a f e i, págs. Cap. III-1 y III-2 (PDF págs. 45 y 46); Sección II, art. 3.007 y Figura 12-III, págs. Cap. III-9 y III-10 (PDF págs. 53 y 54)."},
        {"p":"¿Cuáles son las pautas comunes que deben regir la ejecución de todas las materias de la instrucción militar?","o":["Finalidad concreta, progresión, actividad, realismo con seguridad y comprobación","Cada materia sin reglas","Solo exposiciones","Ignorar la seguridad"],"c":0,"e":"Todas las materias deben orientarse a una finalidad concreta, respetar la progresión didáctica, promover la actividad del educando, mantener realismo compatible con la seguridad y utilizar métodos adecuados al contenido y al grupo. La ejecución debe integrar teoría y práctica, relacionar cada aprendizaje con el desempeño militar, sostener la disciplina, emplear racionalmente los recursos y comprobar resultados mediante evidencias observables.  Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.008, incs. a a e, págs. Cap. III-10 y III-11 (PDF págs. 54 y 55)."},
        {"p":"Describa las particularidades metodológicas en la ejecución de la materia Formación Ética Espiritual y Social.","o":["Reflexión guiada, casos, diálogo y ejemplo personal","Memorizar listas de valores","Solo charlas","Solo exámenes escritos"],"c":0,"e":"Debe desarrollarse mediante reflexión guiada, análisis de casos, diálogo, ejemplo personal y vinculación con situaciones reales del servicio. No corresponde reducirla a la memorización de valores. El educador debe favorecer el juicio moral, la responsabilidad, el respeto por la dignidad humana, el compromiso institucional y la coherencia entre convicciones y conducta. Los intercambios requieren un clima respetuoso y compatible con las normas de la institución.  Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.009, texto introductorio e incs. a y b, págs. Cap. III-11 y III-12 (PDF págs. 55 y 56)."},
        {"p":"¿Cómo debe abordarse la enseñanza de la Formación Social Militar en las distintas categorías de personal?","o":["Se adecua a edad, jerarquía y funciones de cada categoría","Es idéntica para todos","Solo alcanza a la tropa","Solo alcanza a oficiales"],"c":0,"e":"Debe adecuarse a la edad, experiencia, jerarquía, responsabilidades y funciones de cada categoría. En la tropa se priorizan hábitos de convivencia, disciplina, integración y cumplimiento del rol. En suboficiales se profundizan la conducción cercana, la formación del personal y la responsabilidad como auxiliares del mando. En oficiales se enfatizan el liderazgo, la conducción de organizaciones, la toma de decisiones y la responsabilidad institucional. Los principios son comunes, pero cambian la profundidad y las situaciones de aplicación.  Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.010, incs. a a c, pág. Cap. III-12 (PDF pág. 56)."},
        {"p":"Explique las características particulares que adopta la ejecución de la materia Didáctica Especial Militar en los institutos de formación o cursos.","o":["Combina fundamentos pedagógicos con práctica docente: planear, conducir y recibir crítica","Solo teoría","Solo evaluación escrita","Sin práctica de mando"],"c":0,"e":"La materia debe combinar fundamentos pedagógicos con práctica docente militar. Los cursantes analizan competencias, capacidades, estándares, métodos y evaluación, pero también diseñan planes, preparan MAPE, conducen clases o instrucciones y reciben crítica sobre su desempeño. La ejecución debe modelar aquello que enseña: claridad de objetivos, participación, realismo, progresión, retroalimentación y coherencia entre planeamiento, desarrollo y evaluación.  Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.011, incs. a a f, pág. Cap. III-12 (PDF pág. 56)."},
        {"p":"¿Cuáles son las exigencias de realismo, seguridad y dinamismo para la ejecución de la instrucción de Combate?","o":["Realismo creciente, seguridad prioritaria y problemas cambiantes","Improvisación descontrolada","Eliminar todo riesgo","Ejercicios estáticos"],"c":0,"e":"La instrucción debe representar con fidelidad creciente las exigencias de la operación, incluyendo incertidumbre, fatiga, coordinación, terreno y presión temporal, sin exceder la preparación del personal. La seguridad es prioritaria: se identifican riesgos, se imparten normas, se controlan armas y medios, se establecen responsables y se detiene la actividad ante una condición insegura. El dinamismo se logra mediante problemas cambiantes y decisiones, sin convertir el ejercicio en improvisación descontrolada.  Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.012, incs. a a p, págs. Cap. III-12 y III-13 (PDF págs. 56 y 57)."},
        {"p":"Detalle los aspectos críticos que debe cuidar el instructor durante la ejecución de la instrucción de Tiro.","o":["Seguridad estricta, control de armas y munición, progresión y corregir un error por vez","Empezar con tiros avanzados","Sin línea de tiro","Sin control de munición"],"c":0,"e":"La prevención exige cumplir estrictamente las normas de seguridad, controlar armas y munición, organizar la línea de tiro y asegurar comunicaciones inequívocas. La progresión debe avanzar desde posiciones, manipulación y tiro en seco hacia ejercicios con mayor complejidad. La técnica se enseña mediante demostración, práctica controlada y observación individual. La corrección de tiro debe basarse en evidencias, identificar la causa del error y aplicar una corrección por vez, sin comprometer la seguridad.  Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.013, incs. a a n, págs. Cap. III-13 y III-14 (PDF págs. 57 y 58)."},
        {"p":"¿Cómo se debe estructurar y ejecutar una sesión de Adiestramiento Físico Militar para garantizar el desarrollo progresivo sin poner en riesgo la salud del personal?","o":["Entrada en calor, parte principal y vuelta a la calma","Solo ejercicios de fuerza","Cargas máximas diarias","Sin control de la fatiga"],"c":0,"e":"La sesión debe incluir entrada en calor, parte principal y vuelta a la calma. La carga se ajusta al nivel, edad, estado de salud, clima y objetivos, y aumenta gradualmente en volumen e intensidad. El instructor controla técnica, hidratación, recuperación y signos de fatiga o lesión; verifica condiciones del terreno y aplica pausas cuando sean necesarias. El registro del rendimiento permite individualizar esfuerzos y evitar sobrecargas.  Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.014, incs. a a k, págs. Cap. III-14 y III-15 (PDF págs. 58 y 59)."},
        {"p":"¿Cuál es el propósito didáctico de la materia Orden Cerrado y qué aspectos de disciplina y coordinación colectiva refuerza?","o":["Hábitos de disciplina, precisión, atención y actuación coordinada","Desarrollar memoria","Enseñar planeamiento","Evaluar resistencia"],"c":0,"e":"Su propósito es formar hábitos de disciplina, precisión, atención, postura, respuesta a voces de mando y actuación coordinada. Refuerza la obediencia consciente, la uniformidad de movimientos, el sentido de pertenencia y la cohesión. Debe enseñarse mediante explicación breve, demostración correcta, ejecución por tiempos, práctica repetida y corrección inmediata, evitando que la repetición pierda finalidad educativa.  Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.015, incs. a a g, pág. Cap. III-15 (PDF pág. 59)."},
        {"p":"Explique las particularidades en la ejecución de materias técnicas como Teoría General y Escritura en Campaña y Cartografía.","o":["Precisión conceptual, demostraciones, ejemplos reales y práctica con comprobación por aplicación","Solo reproducción verbal","Memorización sin práctica","Sin ejemplos"],"c":0,"e":"Estas materias requieren precisión conceptual, demostraciones claras, empleo de ejemplos reales y práctica frecuente. En Teoría General se vinculan normas y conceptos con casos del servicio. En Escritura en Campaña se ejercita la producción de documentos breves, claros y ajustados a formatos. En Cartografía se combinan símbolos, escalas, coordenadas, orientación y trabajo sobre cartas y terreno. La comprobación debe exigir aplicación y no solo reproducción verbal.  Referencia: RFD 51-03, Capítulo III, Sección III, arts. 3.016, incs. a a e, y 3.017, incs. a a c, págs. Cap. III-15 y III-16 (PDF págs. 59 y 60)."},
        {"p":"¿Cuál es la finalidad y los lineamientos generales de la Educación Operacional de los Cuadros?","o":["Mantener y perfeccionar la aptitud profesional de oficiales y suboficiales","Capacitar solo a la tropa","Reemplazar la instrucción","Evaluar conjuntos"],"c":0,"e":"La EOC mantiene y perfecciona la aptitud profesional de oficiales y suboficiales para cumplir funciones de mando, conducción, asesoramiento, ejecución y apoyo. Se desarrolla en forma continua, vinculada con el puesto y con las necesidades del elemento. Sus lineamientos incluyen realismo, actualización doctrinaria y técnica, responsabilidad de la cadena de mando, aprendizaje autónomo, aplicación práctica y evaluación conforme a las competencias requeridas.  Referencia: RFD 51-03, Capítulo III, Sección IV, arts. 3.019 y 3.020, págs. Cap. III-16 a III-18 (PDF págs. 60 a 62)."},
        {"p":"Identifique las áreas de desempeño profesional que abarca la capacitación continua de los cuadros.","o":["Conducción, planeamiento, instrucción, empleo táctico, logística, comunicaciones y asesoramiento","Solo logística","Solo comunicaciones","Solo el combate"],"c":0,"e":"Abarca la conducción y el mando; el planeamiento y la toma de decisiones; la instrucción y educación del personal; el empleo táctico y técnico de medios; la administración de recursos; la logística; las comunicaciones; la seguridad; el asesoramiento; y las funciones específicas de cada arma, especialidad o servicio. La selección concreta depende del cargo, la jerarquía y la misión del elemento.  Referencia: RFD 51-03, Capítulo III, Sección IV, art. 3.020, incs. a a e, págs. Cap. III-16 a III-18 (PDF págs. 60 a 62)."},
        {"p":"¿Cuáles son los aspectos particulares que diferencian la instrucción destinada a los Oficiales de la destinada a los Suboficiales?","o":["Oficiales: conducción y planeamiento; suboficiales: dominio técnico y conducción directa","Son idénticas","El suboficial no lidera","El oficial no enseña"],"c":0,"e":"En los oficiales se enfatizan la conducción, el planeamiento, la apreciación, la decisión, la coordinación y la responsabilidad integral sobre la misión. En los suboficiales se profundizan el dominio técnico, la ejecución y supervisión de procedimientos, la conducción directa del personal y el asesoramiento especializado. Esta distinción no es absoluta: ambos deben comprender la misión, liderar, enseñar y actuar coordinadamente según su nivel de responsabilidad.  Referencia: RFD 51-03, Capítulo III, Sección IV, arts. 3.021, incs. a a e, y 3.022, incs. a a e, págs. Cap. III-18 a III-20 (PDF págs. 62 a 64)."},
        {"p":"¿Qué rol cumple la Escuela de Regimiento y el aprendizaje autónomo dentro del marco de la EOC?","o":["La organización orienta prioridades y el individuo asume su perfeccionamiento","Reemplazan toda capacitación","Son solo lecturas","Son opcionales"],"c":0,"e":"La Escuela de Regimiento organiza la capacitación continua dentro del elemento, vinculándola con sus necesidades reales y con el desempeño de los cargos. El aprendizaje autónomo permite que cada cuadro mantenga y amplíe sus conocimientos mediante estudio, práctica y actualización personal. Ambos se complementan: la organización orienta prioridades y proporciona oportunidades, mientras el individuo asume responsabilidad por su perfeccionamiento.  Referencia: RFD 51-03, Capítulo III, Sección IV, art. 3.021, inc. b, pág. Cap. III-18 (PDF pág. 62); Sección VIII, art. 3.032, incs. a a d, pág. Cap. III-25 (PDF pág. 69)."},
        {"p":"Mencione los métodos y técnicas de enseñanza más adecuados para ser aplicados en la EOC.","o":["Gabinete, casos, juegos de guerra, simulaciones y análisis después de la acción","Solo exposiciones","Solo lectura de textos","Solo ejercicios físicos"],"c":0,"e":"Resultan adecuados los trabajos de gabinete, estudios de caso, resolución de problemas, ejercicios de gabinete, juegos de guerra, exposiciones dialogadas, discusiones dirigidas, prácticas en el terreno, simulaciones, análisis después de la acción y aprendizaje autónomo orientado. La elección depende de la capacidad que se busca desarrollar; para conducción y decisión deben priorizarse situaciones que obliguen a analizar, decidir, fundamentar y coordinar.  Referencia: RFD 51-03, Capítulo III, Sección IV, art. 3.024, introducción e incs. a a c, pág. Cap. III-20 (PDF pág. 64); remisión al art. 3.006.e y al Anexo 18."},
        {"p":"¿Cómo se articulan las Tablas de Educación Operacional en la evaluación y conducción de la EOC?","o":["Traducen las exigencias en tareas, condiciones, estándares e indicadores","Son listas de asistencia","Evalúan a los docentes","Solo registran horarios"],"c":0,"e":"Las TTEO traducen las exigencias profesionales en tareas, condiciones, estándares e indicadores que orientan la instrucción y la evaluación. Permiten planificar una progresión, registrar evidencias, identificar brechas y decidir actividades de recuperación o perfeccionamiento. La cadena de mando las utiliza como referencia común para conducir la EOC y comprobar si el cuadro alcanza el nivel requerido para su función.  Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.008, incs. a.1 y b, págs. Cap. III-10 y III-11 (PDF págs. 54 y 55); Sección VIII, art. 3.034, incs. a a i, pág. Cap. III-26 (PDF pág. 70)."},
        {"p":"Defina la finalidad e importancia fundamental de la Educación Operacional de la Tropa dentro del Ejército.","o":["Forma al soldado para cumplir su rol en la fracción; base del adiestramiento colectivo","Forma oficiales","Capacita conjuntos","Solo valores sin técnica"],"c":0,"e":"La EOT forma al soldado para cumplir con seguridad, disciplina y eficacia las tareas correspondientes a su rol dentro de una fracción. Es fundamental porque transforma al individuo en un integrante útil de la organización militar, desarrolla competencias básicas y específicas, fortalece valores y proporciona la base sobre la cual se realiza el adiestramiento colectivo.  Referencia: RFD 51-03, Capítulo III, Sección V, arts. 3.025 y 3.026, incs. d y e, pág. Cap. III-21 (PDF pág. 65)."},
        {"p":"¿Cuáles son los aspectos centrales a tener en cuenta durante la instrucción individual del Soldado Voluntario?","o":["Experiencia previa, condición física, motivación e instrucción clara, práctica y progresiva","Ignorar su trayectoria","Exigencia sin adaptación","Solo teoría"],"c":0,"e":"Deben considerarse su experiencia previa, condición física, motivación, nivel educativo y proceso de adaptación a la vida militar. La instrucción debe ser clara, práctica, progresiva y repetida hasta alcanzar el estándar; integrar disciplina, seguridad, valores y conocimientos técnicos; brindar retroalimentación frecuente; y controlar de manera individual el dominio de las tareas esenciales antes de aumentar la complejidad.  Referencia: RFD 51-03, Capítulo III, Sección V, art. 3.027, incs. a y b, págs. Cap. III-21 a III-23 (PDF págs. 65 a 67)."},
        {"p":"Explique la estructura y progresión de los Ciclos de Capacitación en la EOT.","o":["Formación básica, formación para el rol y perfeccionamiento, integración y mantenimiento","Un único ciclo","Solo un examen final","Solo táctica"],"c":0,"e":"La progresión comienza con el Ciclo de Formación Básica, que proporciona adaptación, valores, disciplina y destrezas militares comunes. Continúa con la formación para el rol, donde el soldado aprende las tareas específicas de su puesto. Luego se desarrollan etapas de perfeccionamiento, integración y mantenimiento de aptitudes. Cada ciclo debe apoyarse en el anterior y cerrar con una comprobación antes de avanzar.  Referencia: RFD 51-03, Capítulo III, Sección V, art. 3.026, inc. b.2, aparts. a a c, pág. Cap. III-21 (PDF pág. 65); remisión al Anexo 22."},
        {"p":"¿De qué manera debe el instructor adaptar la Didáctica Especial Militar para motivar y lograr el estándar exigido en la tropa?","o":["Lenguaje claro, demostraciones, práctica intensiva, dividir tareas y corregir de inmediato","Bajar el estándar exigido","Solo aumentar la exigencia","Sin práctica"],"c":0,"e":"Debe utilizar lenguaje claro, demostraciones correctas, práctica intensiva y situaciones relacionadas con el rol del soldado. Conviene dividir tareas complejas, explicar su utilidad, reconocer avances, corregir en forma inmediata y ofrecer oportunidades de recuperación. La exigencia debe mantenerse, pero el camino para alcanzar el estándar se adapta al ritmo y a las dificultades del grupo sin reducir el resultado esperado.  Referencia: RFD 51-03, Capítulo III, Sección V, art. 3.027, incs. a.8 a a.11 y b.1 a b.6, págs. Cap. III-22 y III-23 (PDF págs. 66 y 67)."},
        {"p":"¿Qué papel juegan las TTI en el seguimiento de las competencias alcanzadas por el soldado en la EOT?","o":["Definen tareas, condiciones y estándares y registran el progreso individual","Evalúan al instructor","Son mapas de terreno","Solo trámites administrativos"],"c":0,"e":"Las Tablas de Instrucción definen tareas, condiciones y estándares, y permiten registrar el progreso individual. Sirven para organizar la secuencia de capacitación, comprobar competencias, detectar necesidades de refuerzo y aportar información a la conducción. Su utilidad depende de que el registro refleje desempeños observados y no una mera formalidad administrativa.  Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.008, incs. a.1 y b, págs. Cap. III-10 y III-11 (PDF págs. 54 y 55); Sección VIII, art. 3.034, incs. a a i, pág. Cap. III-26 (PDF pág. 70)."},
        {"p":"¿Qué se entiende por Adiestramiento Operacional de Conjuntos y cuál es su diferencia sustancial con la instrucción individual?","o":["Integra fracciones completas: mando, integrantes, procedimientos, apoyos y medios","Es igual a la instrucción individual","Es solo teórico","Corresponde solo a oficiales"],"c":0,"e":"El AOC prepara fracciones y organizaciones para actuar coordinadamente en el cumplimiento de tareas operacionales. A diferencia de la instrucción individual, su objeto principal no es la destreza aislada de una persona, sino la integración del mando, los integrantes, los procedimientos, los apoyos y los medios. Evalúa el desempeño del conjunto frente a una misión y bajo condiciones determinadas.  Referencia: RFD 51-03, Capítulo III, Sección VI, arts. 3.028, inc. a, y 3.029, págs. Cap. III-23 y III-24 (PDF págs. 67 y 68)."},
        {"p":"¿Cómo se articula el AOC con la instrucción de cuadros y la instrucción de tropa?","o":["La EOC aporta cuadros, la EOT soldados y el AOC los integra en tareas colectivas","Son independientes entre sí","El AOC reemplaza a ambas","Solo vale la EOC"],"c":0,"e":"La EOC proporciona cuadros capaces de planear, conducir, supervisar y evaluar; la EOT aporta soldados competentes en sus funciones individuales. El AOC integra ambas capacidades en tareas colectivas. Si existen deficiencias individuales o de conducción, el rendimiento del conjunto se afecta; por eso los resultados del adiestramiento también retroalimentan los programas de cuadros y tropa.  Referencia: RFD 51-03, Capítulo III, Sección VI, art. 3.029, pág. Cap. III-24 (PDF pág. 68)."},
        {"p":"Describa la importancia de las TTAO para certificar la eficacia táctica y técnica de una fracción.","o":["Tareas colectivas, condiciones, estándares e indicadores para certificar la fracción","Califican a cada individuo","Registran asistencia","Planifican el PES"],"c":0,"e":"Las Tablas de Adiestramiento Operacional establecen tareas colectivas, condiciones de ejecución, estándares e indicadores. Permiten evaluar con criterios comunes si la fracción puede cumplir su misión, identificar brechas tácticas o técnicas y registrar su evolución. La certificación exige evidencias obtenidas durante ejecuciones representativas y no solamente la declaración de que la actividad fue realizada.  Referencia: RFD 51-03, Capítulo III, Sección VI, art. 3.028, inc. i, págs. Cap. III-23 y III-24 (PDF págs. 67 y 68); art. 3.030, inc. a.4, pág. Cap. III-24 (PDF pág. 68)."},
        {"p":"¿En qué consisten las Prácticas de Conjunto, los Ejercicios de Adiestramiento y las Tareas Tácticas de Adiestramiento Operacional?","o":["Son una progresión desde la coordinación básica hacia el desempeño integrado","Actividades sin orden","Solo exámenes teóricos","Reemplazan la instrucción"],"c":0,"e":"Las Prácticas de Conjunto integran inicialmente funciones y procedimientos parciales, con control cercano y posibilidad de repetir. Los Ejercicios de Adiestramiento presentan situaciones más completas en las que la organización aplica capacidades bajo una conducción definida. Las TTAO expresan las acciones colectivas esenciales que la fracción debe ejecutar conforme a condiciones y estándares. En conjunto, constituyen una progresión desde la coordinación básica hacia el desempeño operacional integrado.  Referencia: RFD 51-03, Capítulo III, Sección VI, art. 3.030, incs. a y b, págs. Cap. III-24 y III-25 (PDF págs. 68 y 69)."},
        {"p":"¿Cómo debe configurarse el escenario didáctico para que un ejercicio de adiestramiento simule de manera realista las exigencias del combate moderno?","o":["Representa misión, ambiente, terreno, amenaza y restricciones, con seguridad","Idealiza todas las condiciones","Evita todo riesgo","Solo muestra mapas"],"c":0,"e":"Debe representar la misión, el ambiente operacional, el terreno, la amenaza, la población, las comunicaciones, los apoyos y las restricciones relevantes. Puede incorporar incertidumbre, información incompleta, degradación tecnológica, presión temporal y necesidad de coordinación. El realismo debe ser funcional al objetivo y compatible con la seguridad, los recursos y el nivel de preparación. Cada estímulo debe provocar decisiones o acciones que puedan observarse y evaluarse.  Referencia: RFD 51-03, Capítulo III, Sección VI, arts. 3.028, incs. b a j, y 3.030, incs. a y b, págs. Cap. III-23 a III-25 (PDF págs. 67 a 69)."},
        {"p":"¿Cuáles son las particularidades a prever durante la ejecución de la educación operacional de las Reservas de la Fuerza?","o":["Heterogeneidad de edades y experiencias: diagnosticar, graduar cargas y actualizar doctrina","Trato igualitario estricto","Solo preparación física","Sin diagnóstico previo"],"c":0,"e":"Debe considerarse la heterogeneidad de edades, experiencias, especialidades, condición física y tiempo disponible. La ejecución requiere diagnosticar conocimientos previos, concentrarse en competencias esenciales, actualizar doctrina y procedimientos, graduar las cargas, reforzar seguridad y prever modalidades combinadas. También debe facilitar la rápida integración de los reservistas a las organizaciones y funciones para las que puedan ser convocados.  Referencia: RFD 51-03, Capítulo III, Sección VII, art. 3.031, pág. Cap. III-25 (PDF pág. 69); Anexo 24, apart. I.1 a I.3 y apart. II.1 a II.2, págs. A 24-1 a A 24-3 (PDF págs. 205 a 207)."},
        {"p":"Explique cómo se vincula la fase de ejecución con el aprendizaje autónomo en el ámbito militar.","o":["Consignas, materiales, plazos, tutorías y productos verificables bajo orientación institucional","Estudio libre sin control","Sin retroalimentación","Reemplaza la enseñanza presencial"],"c":0,"e":"Durante la ejecución, el aprendizaje autónomo se concreta mediante consignas, materiales, plazos, tutorías y productos verificables. El educando organiza parte de su estudio, consulta fuentes, practica y controla su avance, pero actúa dentro de una orientación institucional. El instructor define la finalidad y los estándares, acompaña, responde consultas y comprueba los resultados. La autonomía complementa la enseñanza presencial y favorece la actualización permanente.  Referencia: RFD 51-03, Capítulo III, Sección VIII, art. 3.032, incs. a a d, pág. Cap. III-25 (PDF pág. 69); remisiones al RFD 51-01, Cap. III, y RFD 51-02, art. 1.002."},
        {"p":"¿De qué forma interactúa la Educación a Distancia dentro de la fase de ejecución de la instrucción?","o":["Plataformas, foros, videoconferencias y evaluaciones con seguimiento y evidencias","Enviar archivos para lectura","Es exclusivamente presencial","Sin seguimiento"],"c":0,"e":"La EaD permite desarrollar contenidos y actividades sin coincidencia física permanente entre instructor y educando. Durante la ejecución utiliza plataformas, materiales digitales, foros, videoconferencias, evaluaciones y tutorías. Puede aplicarse de modo sincrónico, asincrónico o combinado. Su eficacia exige consignas precisas, comunicación regular, accesibilidad, seguimiento y actividades que produzcan evidencias; no debe reducirse al envío de archivos para lectura.  Referencia: RFD 51-03, Capítulo III, Sección VIII, art. 3.033, pág. Cap. III-26 (PDF pág. 70); remisión expresa al RFD 51-02, Cap. XII."},
        {"p":"Describa la integración de las Tecnologías de la Información y la Comunicación en la Educación Operacional durante la ejecución práctica.","o":["Apoyan presentación, simulación, comunicación y registro; son un medio, no la finalidad","Sustituyen al educador","Son solo administrativas","No requieren alternativas"],"c":0,"e":"Las TIC apoyan la presentación de contenidos, simulación, comunicación, acceso a doctrina, trabajo colaborativo, registro del desempeño y retroalimentación. Pueden incluir plataformas educativas, simuladores, cartografía digital, sistemas de mando y control de entrenamiento y recursos multimedia. Deben seleccionarse por su aporte al objetivo, proteger la información, prever fallas y mantener alternativas. La tecnología es un medio; no sustituye la práctica ni la conducción del educador.  Referencia: RFD 51-03, Capítulo III, Sección VI, art. 3.028, inc. c, pág. Cap. III-23 (PDF pág. 67); Sección VIII, art. 3.032, inc. c, pág. Cap. III-25 (PDF pág. 69); remisiones al Cap. I, Sección III, Anexo 3 y Cap. V."},
        {"p":"Elabore una síntesis que explique de qué modo la fase de ejecución se conecta con la fase de Evaluación para cerrar el ciclo de gestión educativa.","o":["La ejecución produce evidencias; los resultados de la evaluación mejoran el siguiente ciclo","Son fases aisladas","La evaluación antecede a la ejecución","No se retroalimentan"],"c":0,"e":"La ejecución produce las actuaciones y evidencias que la evaluación necesita para determinar el grado de logro. Durante la actividad, el instructor observa, registra, pregunta y retroalimenta; al finalizar, compara el desempeño con los estándares e indicadores. Los resultados permiten acreditar aprendizajes, disponer recuperaciones y revisar contenidos, métodos, medios y condiciones. Esa información vuelve al planeamiento y mejora la siguiente ejecución, cerrando un ciclo continuo de planear, ejecutar, evaluar y ajustar. Síntesis final La fase de ejecución integra tres pasos: Inicio, Desarrollo y Final. En ellos, el educador orienta, demuestra, organiza la práctica, observa y retroalimenta; el educando participa, aplica, decide y produce evidencias. Este proceso adopta modalidades diferentes según se trate de formación ética, materias técnicas, combate, tiro, educación de cuadros, tropa o adiestramiento de conjuntos, pero conserva principios comunes: finalidad, actividad, progresión, realismo, seguridad y comprobación del aprendizaje. La ejecución se enlaza con la evaluación porque toda actividad debe generar evidencias comparables con un estándar. Los resultados permiten acreditar capacidades, corregir deficiencias y ajustar el planeamiento posterior. De esta manera, la gestión educativa mantiene continuidad y orienta el esfuerzo hacia el desempeño profesional requerido por la Fuerza. Bibliografía orientativa Ejército Argentino. RFD 51-03 Didáctica Especial Militar. Edición vigente. Ejército Argentino. RFD 51-02 Acciones Educativas. Edición vigente. Ejército Argentino. RFD 51-01 Educación en el Ejército. Edición vigente.  Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.001, inc. d, pág. Cap. III-1 (PDF pág. 45); Sección V, art. 3.027, inc. c.1 y c.2, pág. Cap. III-23 (PDF pág. 67); remisión al Capítulo IV."}
      ]

      {
      id: "hist_cuest",
      nombre: "Cuestionario UD 2 y UD 3 · Resuelto",
      desc: "Cuestionario resuelto de la Guía de Estudio UD 2 y UD 3 de Historia Argentina: Guerra del Brasil (1825–1828), Conflicto anglo-francés (1845) y Guerra de la Triple Alianza (1865–1870). Preguntas y respuestas modelo tal cual la guía; tocá Examen para resolverla del mismo modo que DEM." ,
      secciones: [
        {
          titulo: "Guerra con el Imperio del Brasil (1825–1828)",
          parrafos: [
            "PREGUNTA 1 — ¿Cuál fue el detonante o casus belli que condujo a la declaración formal de guerra por parte del Imperio del Brasil a las Provincias Unidas?",
            "RESPUESTA MODELO: El hecho inmediato fue que el Congreso de las Provincias Unidas aceptó la incorporación de la Provincia Oriental el 25 de octubre de 1825. El Imperio del Brasil consideró esa decisión un acto hostil y declaró formalmente la guerra el 10 de diciembre de 1825.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 2 — El plan original de las Provincias Unidas concebido por el Gral. Alvear para la campaña en Río Grande del Sur se basaba en la maniobra de “líneas interiores”. ¿En qué consistía el desarrollo operacional de dicho plan? ¿Y qué factor imprevisto lo alteró?",
            "RESPUESTA MODELO: El plan buscaba penetrar en Río Grande del Sur, ocupar Bagé como centro logístico y operar desde una posición intermedia para batir separadamente a las fuerzas imperiales antes de que pudieran reunirse. Lo alteró principalmente el mal tiempo: fuertes lluvias y caminos intransitables, que demoraron el avance y permitieron la reunión del enemigo.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 3 — Tras verse imposibilitado de atacar a un enemigo reunido en las ventajosas alturas de Camacuá, Alvear inició una marcha hacia el norte (San Gabriel/Santa María) antes de girar al oeste. ¿Qué buscaba esta maniobra?",
            "RESPUESTA MODELO: Buscaba hacer salir a Barbacena de las alturas de Camacuá, donde el enemigo tenía ventaja, y llevarlo hacia un terreno más favorable para la caballería republicana. También procuraba engañarlo, haciéndole creer que el Ejército Republicano se retiraba.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 4 — El 19 de febrero de 1827, el Ejército Republicano se encontraba en una posición tácticamente desfavorable y de altísimo riesgo a orillas del río Santa María. ¿Cuál fue la medida táctica adoptada por Alvear, previa a la batalla de Ituzaingó, para revertir ese peligro y garantizar la libertad de acción del Ejército Republicano?",
            "RESPUESTA MODELO: Alvear adelantó tropas y ocupó las alturas dominantes del Morro de las Calaveras, con lo que ganó tiempo para desplegar al grueso del Ejército Republicano y recuperar libertad de acción.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 5 — Estudiar e identificar el orden de batalla de Ituzaingó.",
            "RESPUESTA MODELO: El Ejército Republicano, al mando de Carlos María de Alvear, contaba con aproximadamente 7.700 hombres. El Imperial, al mando del marqués de Barbacena, reunía aproximadamente entre 8.500 y 9.000 hombres. En el esquema deben identificarse sus alas, centro y reservas principales.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés. Esquema extraído de los materiales de clase.",
            "PREGUNTA 6 — Durante el desarrollo de las cargas de caballería republicana (Brandsen, Paz, Lavalle, Olavarría), ¿qué elemento del terreno dificultó los ataques?",
            "RESPUESTA MODELO: Un zanjón transversal del terreno dificultó las cargas de caballería republicana.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 7 — A pesar de advertir las complejidades tácticas del terreno, este coronel sacrificó su vida liderando una carga de caballería que se convirtió en un símbolo de subordinación y de valor militar. ¿De quién se trata?",
            "RESPUESTA MODELO: Se trató del coronel Federico Brandsen, muerto al frente de una carga de caballería.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 8 — ¿Por qué Carmen de Patagones se convirtió en un objetivo militar importante para el Brasil en 1827?",
            "RESPUESTA MODELO: Porque, ante el bloqueo de Buenos Aires, Carmen de Patagones se había convertido en refugio y apostadero de corsarios de las Provincias Unidas, desde donde se afectaba el comercio y la navegación brasileña.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 9 — ¿Cómo estuvo constituida la fuerza defensiva local en Patagones para hacer frente a las fuerzas de la Escuadra imperial brasileña?",
            "RESPUESTA MODELO: La defensa reunió alrededor de 330 hombres, entre tropas regulares, negros libertos, marinos y dotaciones corsarias, milicianos gauchos y vecinos armados.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 10 — ¿En qué consistió el engaño implementado en el Fuerte de Patagones por el comandante Martín Lacarra?",
            "RESPUESTA MODELO: Lacarra vistió a mujeres y ancianos con uniformes y gorros rojos para simular una fuerza de reserva más numerosa y engañar a los brasileños.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 11 — ¿Cuál fue el resultado de la Guerra del Brasil?",
            "RESPUESTA MODELO: La guerra terminó con la Convención Preliminar de Paz de 1828, que consagró la independencia de la Provincia Oriental y dio origen al Estado Oriental del Uruguay.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
          ]
        },
        {
          titulo: "Conflicto anglo-francés (1845)",
          parrafos: [
            "PREGUNTA 12 — ¿Cuál era el objetivo de Francia y Gran Bretaña y por qué se enfrentaron con la Confederación?",
            "RESPUESTA MODELO: Francia y Gran Bretaña buscaban abrir la navegación de los ríos interiores al libre comercio, reducir el control de Buenos Aires sobre el sistema fluvial e influir en la situación política del Uruguay. La política de Rosas chocaba con esos intereses, por eso se enfrentaron con la Confederación.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 13 — ¿Quién fue el comandante general designado por el gobierno de Juan Manuel de Rosas para organizar y dirigir la defensa?",
            "RESPUESTA MODELO: El comandante designado fue el general Lucio Norberto Mansilla.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 14 — ¿Por qué el sitio de Vuelta de Obligado fue seleccionado por las fuerzas de la Confederación para establecer la línea defensiva?",
            "RESPUESTA MODELO: Se eligió Vuelta de Obligado porque el río Paraná allí se angostaba y describía una curva que limitaba la maniobra de los buques, mientras las barrancas favorecían el emplazamiento de las baterías costeras.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 15 — ¿Qué elementos y obstáculos utilizó la Confederación Argentina para bloquear el avance de las naves a vapor sobre el cauce del río?",
            "RESPUESTA MODELO: Se tendieron tres cadenas gruesas de hierro de costa a costa, sostenidas por 24 barcazas o pontones, y se reforzó el obstáculo con baterías de artillería en tierra.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
            "PREGUNTA 16 — Estudiar e identificar el orden de batalla de Vuelta de Obligado.",
            "RESPUESTA MODELO: La defensa de la Confederación, dirigida por Mansilla, contaba con aproximadamente 2.200 hombres, baterías costeras y el cierre del río mediante cadenas y pontones. La escuadra anglo-francesa reunió 11 buques de guerra —entre ellos vapores, corbetas y bergantines— y numerosos mercantes.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés. Esquema extraído de los materiales de clase.",
            "PREGUNTA 17 — ¿Cuál fue el resultado de la batalla de Vuelta de Obligado?",
            "RESPUESTA MODELO: Tácticamente, la fuerza anglo-francesa consiguió forzar el paso. Sin embargo, sufrió fuertes daños y no logró un éxito estratégico duradero: la expedición comercial fue poco rentable y, a la larga, la soberanía argentina sobre los ríos interiores quedó reconocida.",
            "Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés.",
          ]
        },
        {
          titulo: "Guerra de la Triple Alianza (1865–1870)",
          parrafos: [
            "PREGUNTA 18 — ¿Cómo se originó esta guerra?",
            "RESPUESTA MODELO: La guerra se originó en las tensiones regionales vinculadas con la intervención brasileña en Uruguay, los problemas limítrofes y la navegación fluvial. Paraguay, dirigido por Francisco Solano López, reaccionó contra la expansión de la influencia brasileña, apresó el Marqués de Olinda, invadió Mato Grosso y luego ocupó Corrientes. Esto llevó a la formación de la Triple Alianza entre Argentina, Brasil y Uruguay.",
            "Referencia: Guía de Estudio UD3 (Historia Argentina) — Guerra de la Triple Alianza.",
            "PREGUNTA 19 — Batalla de Tuyutí: identificar el orden de batalla (esquema), maniobra principal y resultado.",
            "RESPUESTA MODELO: En Tuyutí, los aliados estaban desplegados a la defensiva, mientras Paraguay atacó con varias agrupaciones. La maniobra principal paraguaya fue un ataque general en varias columnas sobre los flancos y el centro aliados, con una columna destinada a aparecer por la retaguardia. El resultado fue una victoria aliada y una grave derrota paraguaya.",
            "Referencia: Guía de Estudio UD3 (Historia Argentina) — Guerra de la Triple Alianza. Esquema extraído de los materiales de clase.",
            "PREGUNTA 20 — Batalla de Curupaytí: identificar el orden de batalla (esquema), maniobra principal y resultado.",
            "RESPUESTA MODELO: En Curupaytí, los paraguayos defendían una posición fortificada con trincheras, fosos, obstáculos y terreno anegadizo. La maniobra aliada consistió en un bombardeo previo seguido por un ataque frontal organizado en cuatro columnas. El resultado fue una derrota aliada, porque la posición no fue neutralizada y el terreno favoreció plenamente a la defensa paraguaya.",
            "Referencia: Guía de Estudio UD3 (Historia Argentina) — Guerra de la Triple Alianza. Esquema extraído de los materiales de clase.",
          ]
        },

        {"p":"¿Cuál fue el detonante o casus belli que condujo a la declaración formal de guerra por parte del Imperio del Brasil a las Provincias Unidas?","o":["La ocupación de Montevideo por tropas imperiales","La incorporación de la Provincia Oriental al Congreso de las Provincias Unidas","El bloqueo del puerto de Buenos Aires","La batalla de las Higueritas"],"c":1,"e":"El hecho inmediato fue que el Congreso de las Provincias Unidas aceptó la incorporación de la Provincia Oriental el 25 de octubre de 1825. El Imperio del Brasil consideró esa decisión un acto hostil y declaró formalmente la guerra el 10 de diciembre de 1825.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"El plan original de las Provincias Unidas concebido por el Gral. Alvear se basaba en la maniobra de “líneas interiores”. ¿En qué consistía su desarrollo operacional y qué factor imprevisto lo alteró?","o":["Penetrar en Río Grande, ocupar Bagé y batir por separado a las fuerzas imperiales; lo alteró el mal tiempo","Avanzar directo sobre Montevideo por el litoral; lo alteró la caballería brasileña","Atacar Camacuá de frente; lo alteró un cambio de mando","Marchar sobre Buenos Aires; lo alteró la flota imperial"],"c":0,"e":"El plan buscaba penetrar en Río Grande del Sur, ocupar Bagé como centro logístico y operar desde una posición intermedia para batir separadamente a las fuerzas imperiales antes de que pudieran reunirse. Lo alteró principalmente el mal tiempo: fuertes lluvias y caminos intransitables, que demoraron el avance y permitieron la reunión del enemigo.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"Tras verse imposibilitado de atacar a un enemigo reunido en las alturas de Camacuá, Alvear marchó al norte (San Gabriel/Santa María) y giró al oeste. ¿Qué buscaba esta maniobra?","o":["Cortar la retirada imperial hacia Porto Alegre","Hacer salir a Barbacena de Camacuá y llevarlo a un terreno favorable para la caballería republicana, además de engañarlo","Proteger Buenos Aires de un desembarco","Unirse a las fuerzas de Lavalle en el litoral"],"c":1,"e":"Buscaba hacer salir a Barbacena de las alturas de Camacuá, donde el enemigo tenía ventaja, y llevarlo hacia un terreno más favorable para la caballería republicana. También procuraba engañarlo, haciéndole creer que el Ejército Republicano se retiraba.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"El 19 de febrero de 1827 el Ejército Republicano estaba en posición desfavorable a orillas del río Santa María. ¿Qué medida táctica adoptó Alvear, previa a Ituzaingó, para revertir el peligro y garantizar su libertad de acción?","o":["Retroceder a Bagé","Cruzar el río de noche en forma sorpresiva","Ocupar las alturas dominantes del Morro de las Calaveras","Negociar una tregua con Barbacena"],"c":2,"e":"Alvear adelantó tropas y ocupó las alturas dominantes del Morro de las Calaveras, con lo que ganó tiempo para desplegar al grueso del Ejército Republicano y recuperar libertad de acción.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"Estudiar e identificar el orden de batalla de Ituzaingó: ¿qué fuerzas aproximadas reunió cada bando?","o":["Republicano ~7.700 hombres (Alvear) vs. Imperial ~8.500-9.000 (Barbacena)","Republicano ~5.000 vs. Imperial ~12.000","Republicano ~10.000 vs. Imperial ~6.000","Republicano ~3.000 vs. Imperial ~15.000"],"c":0,"e":"El Ejército Republicano, al mando de Carlos María de Alvear, contaba con aproximadamente 7.700 hombres. El Imperial, al mando del marqués de Barbacena, reunía aproximadamente entre 8.500 y 9.000 hombres. En el esquema deben identificarse sus alas, centro y reservas principales.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés. Esquema extraído de los materiales de clase."},
        {"p":"Durante las cargas de caballería republicana (Brandsen, Paz, Lavalle, Olavarría), ¿qué elemento del terreno dificultó los ataques?","o":["Un arroyo profundo","Un zanjón transversal del terreno","Una zona boscosa cerrada","Los pantanos del río Santa María"],"c":1,"e":"Un zanjón transversal del terreno dificultó las cargas de caballería republicana.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"Este coronel sacrificó su vida liderando una carga de caballería y se convirtió en símbolo de subordinación y valor militar. ¿De quién se trata?","o":["Juan Lavalle","José María Paz","Federico Brandsen","Tomás de Olavarría"],"c":2,"e":"Se trató del coronel Federico Brandsen, muerto al frente de una carga de caballería.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"¿Por qué Carmen de Patagones se convirtió en un objetivo militar importante para el Brasil en 1827?","o":["Por ser el principal puerto cerealero del sur","Por ser refugio y apostadero de corsarios de las Provincias Unidas","Por su fortaleza de piedra","Por su posición estratégica frente a las Malvinas"],"c":1,"e":"Porque, ante el bloqueo de Buenos Aires, Carmen de Patagones se había convertido en refugio y apostadero de corsarios de las Provincias Unidas, desde donde se afectaba el comercio y la navegación brasileña.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"¿Cómo estuvo constituida la fuerza defensiva local en Patagones para hacer frente a la Escuadra imperial brasileña?","o":["Solo milicianos gauchos","Unos 330 hombres: tropas regulares, negros libertos, marinos, corsarios, milicianos y vecinos armados","La guarnición regular enviada desde Buenos Aires","Unos 800 soldados veteranos"],"c":1,"e":"La defensa reunió alrededor de 330 hombres, entre tropas regulares, negros libertos, marinos y dotaciones corsarias, milicianos gauchos y vecinos armados.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"¿En qué consistió el engaño implementado en el Fuerte de Patagones por el comandante Martín Lacarra?","o":["Fingió un brote de enfermedad entre la tropa","Vistió a mujeres y ancianos con uniformes y gorros rojos para simular una reserva más numerosa","Encendió fogatas falsas a lo largo de la costa","Plantó banderas brasileñas para confundir al enemigo"],"c":1,"e":"Lacarra vistió a mujeres y ancianos con uniformes y gorros rojos para simular una fuerza de reserva más numerosa y engañar a los brasileños.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"¿Cuál fue el resultado de la Guerra del Brasil?","o":["La anexión de la Provincia Oriental al Brasil","La Convención Preliminar de Paz de 1828 y la independencia de la Provincia Oriental (Uruguay)","El pago de una indemnización de guerra","El cierre definitivo del río de la Plata"],"c":1,"e":"La guerra terminó con la Convención Preliminar de Paz de 1828, que consagró la independencia de la Provincia Oriental y dio origen al Estado Oriental del Uruguay.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"¿Cuál era el objetivo de Francia y Gran Bretaña y por qué se enfrentaron con la Confederación?","o":["Conquistar el litoral argentino","Abrir la navegación de los ríos interiores al libre comercio, reducir el control de Buenos Aires e influir en el Uruguay","Apoyar a Rosas contra el Brasil","Bloquear permanentemente el puerto de Buenos Aires"],"c":1,"e":"Francia y Gran Bretaña buscaban abrir la navegación de los ríos interiores al libre comercio, reducir el control de Buenos Aires sobre el sistema fluvial e influir en la situación política del Uruguay. La política de Rosas chocaba con esos intereses, por eso se enfrentaron con la Confederación.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"¿Quién fue el comandante general designado por el gobierno de Juan Manuel de Rosas para organizar y dirigir la defensa?","o":["Juan Manuel de Rosas","Lucio Norberto Mansilla","Ángel Pacheco","Martín Lacarra"],"c":1,"e":"El comandante designado fue el general Lucio Norberto Mansilla.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"¿Por qué el sitio de Vuelta de Obligado fue seleccionado para establecer la línea defensiva?","o":["Por la amplitud del río en ese tramo","Porque el Paraná allí se angostaba y describía una curva que limitaba la maniobra de los buques, con barrancas propicias para las baterías","Por su cercanía a Buenos Aires","Porque era el punto más ancho del río"],"c":1,"e":"Se eligió Vuelta de Obligado porque el río Paraná allí se angostaba y describía una curva que limitaba la maniobra de los buques, mientras las barrancas favorecían el emplazamiento de las baterías costeras.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"¿Qué elementos y obstáculos utilizó la Confederación para bloquear el avance de las naves a vapor sobre el río?","o":["Minas y torpedos de fondeo","Tres cadenas gruesas de hierro de costa a costa sostenidas por 24 barcazas o pontones, reforzadas con baterías de artillería","Estacas de madera y redes de pesca","Un muelle flotante artillado"],"c":1,"e":"Se tendieron tres cadenas gruesas de hierro de costa a costa, sostenidas por 24 barcazas o pontones, y se reforzó el obstáculo con baterías de artillería en tierra.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"Estudiar e identificar el orden de batalla de Vuelta de Obligado: ¿con qué fuerzas contó cada bando?","o":["Confederación ~2.200 hombres + baterías y cadenas; escuadra anglo-francesa de 11 buques y numerosos mercantes","Confederación ~8.000 hombres; escuadra de 3 buques","Confederación ~500 hombres; escuadra de 30","Confederación ~10.000 hombres; escuadra de 5"],"c":0,"e":"La defensa de la Confederación, dirigida por Mansilla, contaba con aproximadamente 2.200 hombres, baterías costeras y el cierre del río mediante cadenas y pontones. La escuadra anglo-francesa reunió 11 buques de guerra —entre ellos vapores, corbetas y bergantines— y numerosos mercantes.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés. Esquema extraído de los materiales de clase."},
        {"p":"¿Cuál fue el resultado de la batalla de Vuelta de Obligado?","o":["Victoria total de la Confederación","La escuadra anglo-francesa forzó el paso tácticamente, pero con fuertes daños y sin éxito estratégico duradero; la soberanía argentina sobre los ríos quedó reconocida","La Confederación hundió por completo a la escuadra","Se firmó la paz inmediatamente después"],"c":1,"e":"Tácticamente, la fuerza anglo-francesa consiguió forzar el paso. Sin embargo, sufrió fuertes daños y no logró un éxito estratégico duradero: la expedición comercial fue poco rentable y, a la larga, la soberanía argentina sobre los ríos interiores quedó reconocida.  Referencia: Guía de Estudio UD2 (Historia Argentina) — Guerra del Brasil y conflicto anglo-francés."},
        {"p":"¿Cómo se originó la Guerra de la Triple Alianza?","o":["Por un conflicto fronterizo con Chile","Por tensiones regionales ante la intervención brasileña en Uruguay, problemas limítrofes y la navegación fluvial; Solano López apresó el Marqués de Olinda, invadió Mato Grosso y ocupó Corrientes","Por la anexión paraguaya del Chaco","Por el cierre del comercio con Europa"],"c":1,"e":"La guerra se originó en las tensiones regionales vinculadas con la intervención brasileña en Uruguay, los problemas limítrofes y la navegación fluvial. Paraguay, dirigido por Francisco Solano López, reaccionó contra la expansión de la influencia brasileña, apresó el Marqués de Olinda, invadió Mato Grosso y luego ocupó Corrientes. Esto llevó a la formación de la Triple Alianza entre Argentina, Brasil y Uruguay.  Referencia: Guía de Estudio UD3 (Historia Argentina) — Guerra de la Triple Alianza."},
        {"p":"Batalla de Tuyutí: identificar el orden de batalla (esquema), la maniobra principal y el resultado.","o":["Los aliados atacaron de frente y Paraguay venció","Paraguay atacó en varias columnas sobre flancos y centro aliados; victoria aliada y grave derrota paraguaya","Paraguay se defendió en posición fortificada y venció","Hubo un empate táctico"],"c":1,"e":"En Tuyutí, los aliados estaban desplegados a la defensiva, mientras Paraguay atacó con varias agrupaciones. La maniobra principal paraguaya fue un ataque general en varias columnas sobre los flancos y el centro aliados, con una columna destinada a aparecer por la retaguardia. El resultado fue una victoria aliada y una grave derrota paraguaya.  Referencia: Guía de Estudio UD3 (Historia Argentina) — Guerra de la Triple Alianza. Esquema extraído de los materiales de clase."},
        {"p":"Batalla de Curupaytí: identificar el orden de batalla (esquema), la maniobra principal y el resultado.","o":["Ataque nocturno paraguayo; victoria aliada","Los aliados bombardearon y atacaron de frente en cuatro columnas contra una posición fortificada paraguaya; el resultado fue una derrota aliada","Paraguay atacó en columnas y hubo empate","Los aliados flanquearon por el río y vencieron"],"c":1,"e":"En Curupaytí, los paraguayos defendían una posición fortificada con trincheras, fosos, obstáculos y terreno anegadizo. La maniobra aliada consistió en un bombardeo previo seguido por un ataque frontal organizado en cuatro columnas. El resultado fue una derrota aliada, porque la posición no fue neutralizada y el terreno favoreció plenamente a la defensa paraguaya.  Referencia: Guía de Estudio UD3 (Historia Argentina) — Guerra de la Triple Alianza. Esquema extraído de los materiales de clase."},
      ]

      preguntas: [
        {"p":"¿Quiénes integraron la Triple Alianza contra Paraguay?","o":["Argentina, Brasil y Uruguay","Argentina, Paraguay y Uruguay","Brasil, Paraguay y Bolivia","Argentina, Brasil y Chile"],"c":0,"e":"La guerra enfrentó a Paraguay, dirigido por Francisco Solano López, contra la Triple Alianza integrada por el Imperio del Brasil, Uruguay (Partido Colorado) y la Argentina, presidida por Bartolomé Mitre.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿En qué fecha se formalizó el Tratado de la Triple Alianza?","o":["24 de mayo de 1866","1 de mayo de 1865","11 de junio de 1865","22 de septiembre de 1866"],"c":1,"e":"El Tratado de la Triple Alianza se formalizó el 1 de mayo de 1865.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Cuál fue, según el material, el primer acto de guerra de Paraguay?","o":["La batalla del Riachuelo","La ocupación de Buenos Aires","La captura del Marqués de Olinda","El ataque a Montevideo"],"c":2,"e":"La captura del Marqués de Olinda aparece como primer acto de guerra en el material.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Qué hecho incorporó directamente a la Argentina al conflicto?","o":["La batalla de Tuyutí","El hundimiento del Marqués de Olinda","El bombardeo de Buenos Aires","La invasión y ocupación de Corrientes"],"c":3,"e":"Paraguay solicitó permiso para atravesar territorio argentino rumbo a Rio Grande do Sul y Mitre, neutral, no lo concedió. La posterior invasión y ocupación de Corrientes incorporó directamente a la Argentina al conflicto.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Qué partido uruguayo aparece vinculado a sectores liberales argentinos y al apoyo brasileño?","o":["Partido Colorado","Partido Blanco","Partido Federal","Partido Nacionalista"],"c":0,"e":"El Partido Blanco era nacionalista/federal, afín a Paraguay y a sectores federales argentinos; el Partido Colorado estaba vinculado a sectores liberales argentinos y al apoyo brasileño.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Cuánto demoró aproximadamente la movilización de la Guardia Nacional argentina?","o":["Unas dos semanas","Casi diez meses, de abril de 1865 a febrero de 1866","Tres años","Un mes exacto"],"c":1,"e":"La reunión de la Guardia Nacional demoró casi diez meses, desde abril de 1865 hasta febrero de 1866, con resistencias locales, evasiones, motines y sublevaciones.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Qué unidad organizó Mitre el 29 de abril de 1865, vinculada al coronel Juan Czetz?","o":["Un regimiento de caballería","Una batería de artillería","Una Compañía de Zapadores de 100 plazas","Un batallón de tiradores"],"c":2,"e":"El 29 de abril de 1865 Mitre dispuso la organización de una Compañía de Zapadores de 100 plazas; el coronel de ingenieros Juan Czetz quedó vinculado a la comisión. El 19 de junio se creó el Batallón de Ingenieros, a órdenes del Sargento Mayor Alejandro Díaz.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Por qué la batalla del Riachuelo (11/06/1865) se considera un punto de inflexión?","o":["La derrota de la escuadra paraguaya (almirante Barroso) aisló a Paraguay y transformó la guerra de ofensiva en defensiva","Fue la primera victoria aliada terrestre","Permitió el asedio de Montevideo","Marcó la firma del tratado"],"c":0,"e":"La derrota de la escuadra paraguaya frente al almirante Barroso dejó a Paraguay más aislado, redujo su capacidad de reponer buques, artillería y materias primas, y contribuyó a transformar la guerra paraguaya de ofensiva en defensiva.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Qué medios de las imágenes del material evidencian el carácter moderno del conflicto?","o":["Espadas y lanzas","Mosquetes de chispa","Armas de retrocarga","Cañones, lanzadores de cohetes y fusiles de ánima rayada"],"c":3,"e":"Las imágenes del material muestran cañones, lanzadores de cohetes y fusiles de ánima rayada, medios asociados al carácter moderno del conflicto.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"En Tuyutí (24/05/1866), ¿en qué consistió el plan ofensivo de Solano López?","o":["Un ataque frontal nocturno","Sorprender el campamento aliado con cuatro columnas y buscar un doble envolvimiento","Un sitio prolongado","Un desembarco anfibio"],"c":1,"e":"López optó por una ofensiva preventiva destinada a sorprender el campamento aliado mediante cuatro columnas y buscar un doble envolvimiento. La falta de coordinación paraguaya y la defensa en profundidad aliada fueron las claves.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Cuál fue el resultado de la batalla de Tuyutí?","o":["Victoria aliada con graves pérdidas paraguayas (entre 10.000 y 13.000 bajas)","Victoria paraguaya","Empate táctico","Retirada de ambos bandos"],"c":0,"e":"El resultado fue una victoria aliada. El material ofrece cifras aproximadas variables: entre 10.000 y 13.000 bajas paraguayas y entre 3.500 y 4.300 aliadas. La victoria dañó decisivamente la capacidad ofensiva paraguaya.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Qué posición fue tomada por fuerzas brasileñas el 3 de septiembre de 1866, previa a Curupaytí?","o":["Humaitá","Estero Bellaco","Curuzú","Concepción"],"c":2,"e":"La posición de Curuzú, situada al sudoeste de Curupaytí, fue tomada por fuerzas brasileñas el 3 de septiembre de 1866. La demora posterior permitió reforzar Curupaytí.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿En qué consistió el plan aliado para asaltar Curupaytí?","o":["Bombardeo aéreo nocturno","Cañoneo naval preliminar seguido de asalto frontal con dos columnas brasileñas y dos argentinas, sin artillería propia","Sitio sin ataque","Desembarco exclusivamente anfibio"],"c":1,"e":"Primera fase: cañoneo naval preliminar de la Escuadra Imperial brasileña. Segunda fase: asalto frontal de infantería con dos columnas brasileñas y dos argentinas, sin artillería propia, zapadores inicialmente en reserva, desembarco anfibio previsto y columnas escalonadas en cuatro líneas.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Qué factores empeoraron la situación aliada en Curupaytí?","o":["Cinco días de lluvias, demora que permitió reforzar la posición, escalas cortas y bombardeo naval ineficaz","Falta de voluntarios","Deserciones masivas","Falta de buques"],"c":0,"e":"Cinco días de lluvias intensas empantanaron el terreno; la demora dio tiempo adicional a los paraguayos para reforzar la posición; las escalas argentinas resultaron cortas para la profundidad real de los obstáculos; y el bombardeo naval no neutralizó seriamente las defensas.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Cuál fue el error de Mitre durante el avance en Curupaytí?","o":["Abandonó el frente","Lanzó un segundo bombardeo sobre su propia infantería","Ordenó la retirada antes de empezar","Empeñó nuevas fuerzas tras recibir información errónea de que parte de la trinchera había sido tomada"],"c":3,"e":"Mitre recibió información errónea de que una parte de la trinchera había sido tomada y ordenó empeñar nuevas fuerzas. Pasadas las 16:00, ante el fracaso de las avanzadas, ordenó la retirada.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Qué consecuencia inmediata tuvo la derrota de Curupaytí?","o":["Paralizó al ejército de la Alianza y hubo unos 14 meses sin un enfrentamiento de importancia comparable","Provocó la rendición argentina","Obligó a Solano López a rendirse","Fue el fin inmediato de la guerra"],"c":0,"e":"La derrota paralizó al ejército de la Alianza y produjo una prolongada estabilización del frente: aproximadamente 14 meses sin un encuentro de importancia comparable, con fuerte repercusión política y periodística en los países aliados.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Dónde finalizó la guerra en 1870, como última acción destacada?","o":["Cerro Corá","Tuyutí","Casco","Lomas Valentinas"],"c":0,"e":"La guerra finalizó en 1870, con Cerro Corá como última acción destacada por el material.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿En cuántas grandes campañas divide el material la guerra?","o":["Tres","Cinco","Siete","Dos"],"c":1,"e":"El material divide la guerra en cinco grandes campañas.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Cómo caracteriza el material a la Guerra de la Triple Alianza?","o":["Un conflicto corto y colonial","Una guerra exclusivamente marítima","El conflicto sudamericano más prolongado y destructivo del siglo XIX, con rasgos modernos","Un enfrentamiento entre Chile y Argentina"],"c":2,"e":"El material la caracteriza como el conflicto sudamericano más prolongado y destructivo del siglo XIX, con rasgos modernos por el armamento, la fortificación, los medios navales y la movilización; reconfiguró el equilibrio político regional.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
        {"p":"¿Qué consecuencia tuvo la guerra para la Argentina según el material?","o":["Perdió territorio nacional","Su economía se mantuvo intacta","Desapareció la Guardia Nacional","Contribuyó a la formación de un Ejército de carácter nacional y a su profesionalización"],"c":3,"e":"Para la Argentina, la experiencia contribuyó a la formación de un Ejército de carácter nacional y dio impulso a su profesionalización.  Referencia: Guía de Estudio Organizada UD3 (Triple Alianza)."},
