<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudio</title>
<style>
:root{ --bg:#f4f6fb; --card:#ffffff; --ink:#1c2333; --muted:#6b7790; --line:#dfe4ef; --accent:#3d5afe; --accent2:#7c4dff; --ok:#1f9d55; --bad:#e5484d; --soft:#eef1fb; --gold:#b46a00; }
*{ box-sizing:border-box; }
body{ margin:0; font-family:Segoe UI,system-ui,-apple-system,Arial,sans-serif; background:var(--bg); color:var(--ink); }
header{ background:linear-gradient(120deg,#3d5afe,#7c4dff); color:#fff; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20; }
header h1{ font-size:18px; margin:0; font-weight:700; }
header button{ background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; }
main{ max-width:820px; margin:0 auto; padding:16px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
h2{ font-size:20px; margin:0 0 4px; }
h3{ font-size:16px; margin:0 0 10px; color:var(--accent); }
.sub{ color:var(--muted); font-size:13px; margin:0 0 12px; }
.temas{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.tema{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; cursor:pointer; transition:.15s; }
.tema:hover{ border-color:var(--accent); transform:translateY(-2px); }
.tema b{ display:block; font-size:15px; margin-bottom:6px; }
.tema ul{ margin:0; padding-left:16px; font-size:12.5px; color:var(--muted); }
.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
.tabs button{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 14px; font-size:13.5px; cursor:pointer; color:var(--ink); }
.tabs button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
.texto p{ line-height:1.7; margin:0 0 12px; font-size:15px; }
.hl{ background:var(--accent); color:#fff; border-radius:4px; padding:0 3px; cursor:pointer; white-space:nowrap; }
.sec{ font-size:12.5px; color:var(--muted); display:inline-block; background:var(--soft); border:1px solid var(--line); border-radius:20px; padding:3px 10px; margin:0 4px 6px 0; cursor:pointer; }
.bigbtn{ background:var(--accent); border:0; color:#fff; border-radius:10px; padding:11px 15px; font-size:14.5px; cursor:pointer; }
.bigbtn:disabled{ opacity:.45; cursor:default; }
.ghost{ background:var(--card); border:1px solid var(--line); color:var(--ink); }
.okbtn{ background:var(--ok); }
.badbtn{ background:var(--bad); }
.flip{ perspective:1000px; cursor:pointer; }
.flip .inner{ position:relative; transition:transform .4s; transform-style:preserve-3d; }
.flip.flipped .inner{ transform:rotateX(180deg); }
.flip .face{ backface-visibility:hidden; background:var(--soft); border:1px solid var(--line); border-radius:14px; padding:26px 18px; min-height:170px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:18px; }
.flip .back{ position:absolute; inset:0; transform:rotateX(180deg); background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
.flip .back small{ display:block; font-size:12px; opacity:.85; margin-bottom:10px; }
.qbtn{ display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin:7px 0; font-size:14px; cursor:pointer; }
.qbtn.sel-ok{ border-color:var(--ok); background:#e7f6ec; }
.qbtn.sel-bad{ border-color:var(--bad); background:#fdeeee; }
.fdb{ font-size:13.5px; margin:8px 0; }
.inBlank{ display:inline-block; width:180px; max-width:70%; border:1px solid var(--accent); border-bottom:2px solid var(--accent); background:#fff; padding:5px 8px; font-size:15px; margin:0 4px; color:var(--ink); border-radius:8px; outline:none; }
.inBlank:disabled{ opacity:.6; }
.expl{ background:var(--soft); border-left:3px solid var(--accent); border-radius:6px; padding:8px 10px; font-size:13px; margin:8px 0; }
.tl{ position:relative; margin-left:8px; padding-left:22px; border-left:2px solid var(--line); }
.tl div{ position:relative; margin-bottom:12px; padding:8px 10px; border-radius:10px; background:var(--card); border:1px solid var(--line); cursor:pointer; }
.tl div::before{ content:''; position:absolute; left:-27px; top:13px; width:10px; height:10px; border-radius:50%; background:var(--accent); }
.tl b{ color:var(--accent); font-size:14px; }
.tl p{ margin:3px 0 0; font-size:14px; line-height:1.5; filter:blur(7px); transition:.25s; user-select:none; }
.tl div.abierta p{ filter:none; user-select:text; }
.tl .pista{ font-size:11.5px; color:var(--muted); margin:0 0 3px; }
.prog{ height:8px; background:var(--line); border-radius:6px; overflow:hidden; margin:10px 0; }
.prog i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0; border-radius:6px; transition:.3s; }
.row{ display:flex; gap:8px; flex-wrap:wrap; }
.note{ font-size:12.5px; color:var(--muted); }
.msg{ background:#fff8e6; border:1px solid #f0ddb0; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
.in{ width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:12px; }
.lista-card{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:6px 0; background:var(--soft); }
.lista-card b{ color:var(--accent); }
.ficha{ position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:3px solid var(--accent); padding:16px 18px 18px; z-index:30; box-shadow:0 -6px 24px rgba(0,0,0,.12); }
.ficha b{ color:var(--accent); font-size:15px; }
.ficha p{ margin:6px 0 12px; font-size:14px; line-height:1.5; }
.rates{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; margin-top:12px; }
.rates button{ border:0; border-radius:9px; padding:9px 4px; font-size:12.5px; cursor:pointer; color:#fff; }
@media(max-width:560px){ .temas{ grid-template-columns:1fr; } }
</style>
</head>

<script>
var CONTENIDO = {
  titulo: "Estudio · Historia Argentina",
  nota: "Historia Argentina (prof. Eugenia Rossi): UD 1 Luchas por la Emancipación · Clase 3 de UD 2 (Guerra del Brasil y Obligado) · UD 3 Guerra de la Triple Alianza. Criminalística: ejemplo.",
  temas: [
    {
      id: "historia",
      nombre: "Historia · Clase 3 UD 2",
      secciones: [
        {
          titulo: "Presentación de la clase",
          parrafos: [
            "La clase estudia las acciones bélicas contra potencias extranjeras previas a la consolidación del Estado Nacional: la Guerra del Brasil (1825-1828) y el Conflicto Anglo-Francés (1845-1849), cuyo episodio central fue el Combate de la Vuelta de Obligado (20/11/1845).",
            "En ambos conflictos, las Provincias Unidas y luego la Confederación enfrentaron a potencias con superioridad naval y material, por el control estratégico de la cuenca del Plata: un factor que marcó todo el período y condicionó la construcción del Estado."
          ]
        },
        {
          titulo: "Guerra del Brasil · origen y antecedentes",
          parrafos: [
            "La Guerra del Brasil fue un conflicto armado entre las Provincias Unidas del Río de la Plata y el Imperio del Brasil, originado en el levantamiento de la Provincia Oriental contra la dominación brasileña y en la posterior incorporación de ese territorio a las Provincias Unidas. Se desarrolló en los ámbitos terrestre, fluvial y marítimo, y concluyó en 1828 con una solución diplomática que dio origen a la República Oriental del Uruguay.",
            "Constituyó un conflicto regional en el que confluyeron tres cuestiones: la cuestión oriental, la construcción de la autoridad política en las Provincias Unidas y la disputa por el control estratégico del Río de la Plata.",
            "Los antecedentes eran geopolíticos: desde la época colonial el espacio rioplatense fue zona de competencia entre las coronas española y portuguesa. La Banda Oriental interesaba a Portugal y a Brasil por su posición frente al Río de la Plata, el control de las comunicaciones fluviales y terrestres, la seguridad de la frontera meridional brasileña y sus recursos ganaderos.",
            "De la intervención portuguesa a la Provincia Cisplatina: 1808 traslado de la corte portuguesa a Río de Janeiro; 1811 intervención en la Banda Oriental; 1816 invasión luso-brasileña y derrota del proyecto artiguista; 1817 ocupación de Montevideo; 1821 incorporación de la Banda Oriental como Provincia Cisplatina; 1822 independencia de Brasil, quedando la provincia bajo el nuevo Imperio."
          ]
        },
        {
          titulo: "1825 · de la cuestión oriental a la guerra",
          parrafos: [
            "El 19 de abril de 1825 desembarcaron los Treinta y Tres Orientales, expedición encabezada por Juan Antonio Lavalleja; en los meses siguientes el movimiento se extendió por la campaña oriental y enfrentó a las fuerzas imperiales.",
            "El 25 de agosto la Asamblea de la Florida declaró la independencia de la Provincia Oriental respecto del Imperio del Brasil y manifestó su voluntad de incorporarse a las Provincias Unidas. El 25 de octubre el Congreso Constituyente aceptó la incorporación: ese fue el casus belli. El 10 de diciembre de 1825 el Imperio del Brasil declaró la guerra a las Provincias Unidas.",
            "Ante la declaración, Brasil empleó su superioridad naval para bloquear los principales puertos, en especial Buenos Aires: el objetivo era aislar económicamente a las Provincias Unidas, interrumpir su comercio exterior y dificultar el abastecimiento y la capacidad de sostener la guerra."
          ]
        },
        {
          titulo: "Un Estado en construcción y un ejército por organizar",
          parrafos: [
            "En 1825 las Provincias Unidas NO constituían un Estado nacional consolidado: cada provincia conservaba su autonomía política, administrativa y fiscal. Esta etapa, conocida como período de las autonomías provinciales, comenzó con la disolución del poder central tras la batalla de Cepeda (1820) y duró hasta la organización constitucional de 1853.",
            "La declaración de guerra exigió crear una fuerza nacional a partir de estructuras fragmentadas. La Ley de Creación de un Ejército Nacional (31/05/1825) fijó 7.600 efectivos, con aportes por provincia (Buenos Aires 1.600; Córdoba 1.200; Santa Fe 200), sobre la base de los restos del Regimiento Río de la Plata, el Ejército Auxiliar del Perú y el Batallón de Cazadores de Salta; se designó general en jefe a Martín Rodríguez. El reclutamiento forzoso, la falta de presupuesto y la crisis del bloqueo provocaron fuerte resistencia social.",
            "En 1826 el Congreso Constituyente creó un Poder Ejecutivo nacional y Bernardino Rivadavia fue elegido presidente para unificar la dirección del esfuerzo de guerra, sin una Constitución formalmente consolidada. Comandaban el esfuerzo: Carlos María de Alvear al frente del ejército republicano y Guillermo Brown al mando de la escuadra. Del lado imperial, comandaban el ejército el Marqués de Barbacena, mientras el emperador era Pedro I.",
            "El plan republicano consistía en una marcha de aproximación de más de 400 km hasta Bagé y luego una maniobra por líneas interiores: batir fraccionadamente al enemigo, atacando primero a una agrupación y, consolidada la victoria, incidir sobre la otra.",
            "El camino fue durísimo: en 30 días se recorrieron los 400 km venciendo el calor, la falta de agua y alimentos; hubo un saqueo vergonzoso de Bagé; las lluvias convirtieron la zona en una ciénaga y obligaron a detenerse 5 días, tiempo que aprovechó el enemigo para reunir su ejército. Barbacena eligió las sierras de Camacuá, pedregosas y quebradas, para neutralizar la caballería argentina, mayor fortaleza republicana."
          ]
        },
        {
          titulo: "Batalla de Ituzaingó · 20/02/1827",
          parrafos: [
            "Fuerzas enfrentadas: el Ejército Republicano contaba con unos 7.700 hombres bajo el mando de Alvear, con Lavalleja en la vanguardia y división de caballería clave a cargo de Brandsen, Lavalle, Olazábal, Iriarte y Soler. El Ejército Imperial sumaba 8.500 a 9.000 efectivos, con contingentes veteranos de línea y mercenarios europeos, comandados por el Marqués de Barbacena. Los republicanos tenían preponderancia de caballería; el Imperio, mejores pertrechos, apoyo logístico e infantería regular.",
            "Barbacena calculó erróneamente que los republicanos se retiraban y ordenó avanzar en la madrugada del 20 de febrero. Alvear, advertido del terreno desventajoso (a orillas del crecido río Santa María), adelantó tropas para ocupar las alturas dominantes del Morro de las Calaveras y ganó tiempo para desplegar el grueso del ejército. Un zanjón transversal frenó a la infantería brasileña, que quedó inmovilizada.",
            "Las cargas: Lavalleja cargó sobre la izquierda brasileña y, aunque fue rechazado, obligó a los imperiales a formar en cuadro, perdiendo movilidad. La heroica carga de Brandsen, ordenada por Alvear contra el zanjón y la infantería enemiga, costó la muerte del coronel pero quebró la resistencia. Sucesivas cargas de Paz, Lavalle y Pacheco y la lúcida maniobra de Olavarría desorganizaron a la caballería imperial; la infantería en cuadro terminó desbordada por los flancos y Barbacena debió retirarse en desorden, con su parque amenazado por un incendio.",
            "Bajas y resultados: imperiales entre 300 y 400 muertos y heridos, más prisioneros, el archivo del ejército y la casaca roja de Barbacena (que Alvear llevó como trofeo); además se capturó la partitura de la marcha que pasó a ser la Marcha de Ituzaingó. Bajas republicanas: alrededor de 150. PERO no se pudo explotar la ventaja militar, porque la tropa estaba agotada, sin raciones y los caballos al límite.",
            "¿Fue una batalla decisiva? No: para ser decisiva debe alterar de forma permanente el curso de la guerra, destruir el centro de gravedad enemigo y obligar al adversario a cambiar su concepción estratégica. Conclusiones de la campaña: la maniobra transformó una situación táctica desfavorable (río a la espalda, terreno bajo) en victoria mediante la ocupación de puntos llave y armas combinadas; preponderancia de la caballería; aproximación indirecta; y problemas de mando, ya que el resistido liderazgo de Alvear fue compensado por la iniciativa de sus coroneles."
          ]
        },
        {
          titulo: "Combate de Carmen de Patagones · 07/03/1827",
          parrafos: [
            "Ante el bloqueo de Buenos Aires, Carmen de Patagones se transformó en refugio y apostadero de los corsarios de las Provincias Unidas, por lo que se volvió un objetivo imperial. La expedición invasora, dirigida en el terreno por el capitán de fragata inglés James Shepherd, reunió 4 buques de guerra (Duqueza de Goiás, Itaparica, Escudeiro y Constanza), 52 piezas de artillería y más de 600 hombres.",
            "La guerra de corso fue clave: el Estado autoriza a particulares a armar buques para hostigar el comercio enemigo, regulados por la Patente de Corso, con presas validadas por un Tribunal de Presas; el corsario es combatiente legítimo, no pirata. Multiplicó la capacidad de fuego de las Provincias Unidas, dificultó el comercio imperial y obligó a la Armada brasileña a dispersarse.",
            "La defensa local, sin apoyo del gobierno y sin caballos, fue organizada por el comandante Martín Lacarra con 330 hombres: tropas del fuerte, infantería de negros libertos, marinos de los buques corsarios (Bella Flor, Oriental Argentino, los balleneros Hijo de Mayo e Hijo de Julio, las goletas Emperatriz y Chiquita) y milicias de gauchos y vecinos. Como estratagema, se vistió a mujeres y ancianos con uniformes y gorros rojos en el fuerte para simular una gran reserva.",
            "El río Negro y sus bancos de arena jugaron un papel decisivo: Bynnon desplegó los corsarios aislando la flota imperial; la Duqueza de Goiás encalló y se destruyó, y la Itaparica quedó severamente dañada. Shepherd desembarcó 400 infantes en la medianoche del 6 de marzo, pero fueron emboscados en el Cerro de la Caballada con fuego combinado de los buques y las fuerzas terrestres; el capitán murió en los primeros intercambios. A media mañana las naves restantes se rindieron y por la tarde capituló la Itaparica. Una victoria táctica asimétrica que neutralizó la expedición anfibia brasileña."
          ]
        },
        {
          titulo: "Fin de la guerra y consecuencias políticas",
          parrafos: [
            "La guerra entró en un punto muerto por el impacto económico del bloqueo y el agotamiento financiero de ambas naciones. La diplomacia británica, mediada por Lord John Ponsonby, impulsó la paz para destrabar el comercio y asegurar la libre navegación del estuario.",
            "En 1827 Rivadavia envió a Río de Janeiro al ministro Manuel García, pero la Misión García implicaba renunciar a la soberanía sobre la Provincia Oriental y desmovilizar: su contenido fue rechazado en Buenos Aires como una claudicación, la 'paz deshonrosa', frente a las victorias obtenidas. El repudio aceleró la renuncia de Rivadavia y la disolución de los poderes nacionales y del Congreso Constituyente.",
            "Restituida la autonomía provincial, la Legislatura bonaerense eligió gobernador al coronel Manuel Dorrego, que quedó a cargo de las relaciones exteriores. Obligado por la falta de recursos, firmó en agosto de 1828 la Convención Preliminar de Paz, que consagró la independencia de la Provincia Oriental como mal menor: nacía la República Oriental del Uruguay. El descontento del ejército, parte del cual era de tendencia unitaria, llevó a que el 1 de diciembre de 1828 Dorrego fuera derrocado; tras ofrecer resistencia armada, fue fusilado en Navarro el 13 de diciembre por el coronel Juan Lavalle.",
            "Los debates del Congreso giraron en torno a dónde residía la soberanía: se diferenciaron dos bloques. Los unitarios sostenían un poder central fuerte y que la soberanía reside originariamente en la Nación. Los federales defendían la soberanía y preexistencia de las provincias, que delegan solo atribuciones limitadas en un gobierno nacional pactado. Con la disolución del Congreso y la crisis por la forma de resolver la guerra, esa polarización dio paso a la guerra civil entre unitarios y federales."
          ]
        },
        {
          titulo: "Conflicto Anglo-Francés y Vuelta de Obligado · 1845",
          parrafos: [
            "En 1845 Gran Bretaña y Francia, las dos mayores potencias industriales y navales del mundo, intervinieron militarmente en el Río de la Plata contra la Confederación Argentina, que aún no tenía Poder Ejecutivo ni Constitución nacional: desde el Pacto Federal (1831), el manejo de las relaciones exteriores estaba en manos del gobernador de Buenos Aires, Juan Manuel de Rosas (segundo mandato, 1835-1852).",
            "Objetivos de la alianza: romper el proteccionismo aduanero impuesto por Rosas desde 1836 y abrir a la libre navegación los ríos interiores (Paraná y Uruguay); geopoliticamente, inclinar la guerra civil uruguaya a favor de los colorados (aliados de unitarios y franceses), levantar el sitio de Montevideo, y hasta fragmentar el poder central separando las provincias del Litoral en una supuesta 'República de la Mesopotamia'. El 26 de septiembre de 1845 la escuadra bloquó Buenos Aires y ocupó la Isla Martín García.",
            "Los buques de guerra a vapor permitieron prescindir de los vientos, internarse contra la corriente y escoltar un convoy de casi 100 barcos mercantes. Rosas designó al general Lucio Norberto Mansilla para organizar la defensa.",
            "Mansilla eligió la Vuelta de Obligado, al norte de San Pedro, donde el río se angosta (hasta unos mil metros) y describe una doble curva con zonas abarrancadas que dificulta la maniobra naval. Desplegó de costa a costa tres cadenas de hierro sobre 24 barcazas o pontones anclados, unos 2.200 soldados y baterías de artillería de diversos calibres, inferiores en alcance y potencia a los cañones europeos.",
            "La escuadra anglo-francesa sumaba 11 buques de guerra (2 corbetas, 6 bergantines y 3 vapores de casco de metal) más unos 90 mercantes. El 20 de noviembre de 1845 forzaron el paso: pese al devastador fuego naval, las baterías resistieron hasta la caída de la tarde, cuando desembarcó la infantería de marina, tomó las posiciones y cortó las cadenas. Los defensores sufrieron 250 bajas y los aliados unas 50.",
            "Mansilla nunca buscó ganar en un duelo simétrico: su objetivo era provocar un desgaste insostenible, una victoria pírrica para el enemigo. Y el castigo continuó tras Obligado: en el viaje hacia Corrientes y en el regreso, los convoyes fueron hostigados en El Tonelero, San Lorenzo y, sobre todo, en la Batalla de Angostura del Quebracho, donde se destruyeron 6 mercantes (a uno las baterías y cuatro quemados por sus propias tripulaciones). Una victoria pírrica es aquella que se consigue con pérdidas tan devastadoras que equivale a una derrota; el término viene de Pirro de Epiro, que al vencer en la Batalla de Ásculo (279 a.C.) dijo: 'Otra victoria como esta, y estoy perdido'.",
            "El resultado fue el fracaso comercial de la expedición: aunque los buques llegaron a Corrientes y Paraguay, el mercado estaba empobrecido y sin circulante, y nada se vendió. El 24 de noviembre de 1849 Gran Bretaña (tratado Arana-Southern) y Francia (Arana-Lépredour) firmaron la paz, reconociendo la soberanía argentina sobre los ríos interiores y devolviendo la flota capturada. El impacto fue enorme: Brasil y Chile moderaron su hostilidad, unitarios como el coronel Martiniano Chilavert se sumaron a la defensa, y desde su exilio José de San Martín escribió a Tomás Guido destacando que los argentinos 'no son empanadas que se comen sin más trabajo que abrir la boca'."
          ]
        }
      ],
      conceptos: [
        {t: "Guerra del Brasil", d: "Conflicto armado (1825-1828) entre las Provincias Unidas y el Imperio del Brasil por la Provincia Oriental y el control estratégico del Río de la Plata. Terminó con la independencia de la República Oriental del Uruguay."},
        {t: "Provincia Cisplatina", d: "Nombre que recibió la Banda Oriental al pasar a dominio portugués (1821) y luego al Imperio brasileño (1822)."},
        {t: "Casus belli", d: "El 25/10/1825 el Congreso aceptó la incorporación de la Provincia Oriental a las Provincias Unidas; el Imperio lo consideró un acto de guerra y declaró la guerra el 10/12/1825."},
        {t: "Treinta y Tres Orientales", d: "Expedición encabezada por Juan Antonio Lavalleja que desembarcó en la Playa de la Agraciada el 19/04/1825 para liberar la Provincia Oriental."},
        {t: "Asamblea de la Florida", d: "Reunión del 25/08/1825 que declaró la independencia de la Provincia Oriental respecto del Imperio y su voluntad de incorporarse a las Provincias Unidas."},
        {t: "Bloqueo del Río de la Plata", d: "Operación naval brasileña para aislar económicamente a las Provincias Unidas: bloquear puertos, cortar el comercio exterior y el abastecimiento."},
        {t: "Autonomías provinciales", d: "Etapa entre la batalla de Cepeda (1820) y la organización constitucional (1853): cada provincia mantuvo su autonomía política, sin una autoridad nacional efectiva."},
        {t: "Ley de Creación de un Ejército Nacional", d: "Sancionada el 31/05/1825: fijó 7.600 efectivos con aporte por provincia (Buenos Aires 1.600, Córdoba 1.200, Santa Fe 200); general en jefe Martín Rodríguez."},
        {t: "Maniobra por líneas interiores", d: "Estrategia de batir fraccionadamente al enemigo: atacar primero a una agrupación y, consolidada la victoria, incidir sobre la otra."},

        {t: "Batalla de Ituzaingó", d: "Combate del 20/02/1827 entre Alvear y Barbacena. Victoria táctica republicana lograda con el esfuerzo concentrado de la caballería, incluida la heroica carga de Brandsen, que murió cumpliendo la orden. Bajas: unas 150 republicanas frente a 300-400 imperiales; no se pudo explotar la victoria."},
        {t: "Guerra de corso", d: "Estrategia naval en la que el Estado autoriza a particulares a armar buques para hostigar el comercio y los intereses del enemigo, con Patente de Corso y presas validadas por un Tribunal de Presas; el corsario es combatiente legítimo, no pirata."},
        {t: "Combate de Carmen de Patagones", d: "Acción del 07/03/1827: la escuadrilla corsaria y la defensa local, organizada por Martín Lacarra, destruyeron la expedición imperial de Shepherd. Victoria táctica asimétrica."},

        {t: "Unitarios vs. Federales", d: "Unitarios: soberanía en la Nación como todo indivisible y poder central fuerte. Federales: soberanía originaria de las provincias, que delegan solo atribuciones limitadas en un gobierno pactado."}

          titulo: "Qué es la criminalística",
          parrafos: [
            "La criminalística es la disciplina encargada de descubrir, explicar y probar cómo ocurrió un delito, aplicando el método científico a la escena del hecho. Su objetivo no es decidir culpabilidades (eso lo hace el derecho), sino aportar evidencias objetivas: qué pasó, con qué, cómo y quién intervino.",
            "Todo parte de la escena protegida: se la preserva para evitar la contaminación, se la registra y recién después se realiza el relevamiento y la recolección de evidencias, siempre manteniendo la cadena de custodia. Cada indicio se analiza en un laboratorio especializado y el perito vuelca los resultados en un informe pericial."

          ]
        }

    {
      id: "historia_ud1",
      nombre: "Historia · UD 1 Emancipación",
      secciones: [
        {
          titulo: "El Día del Ejército Argentino",
          parrafos: [
            "El 29 de mayo de 1810 se conmemora el Día del Ejército Argentino: ese día la Primera Junta de Gobierno reconoció oficialmente a las fuerzas militares que habían respaldado la Revolución de Mayo, elevó los batallones de milicias al rango de regimientos y reorganizó las tropas. Ese gesto se considera el nacimiento formal del Ejército Argentino.",
            "Las luchas por la emancipación enfrentaron a patriotas y realistas en tres grandes teatros: el norte (Expediciones Auxiliadoras al Alto Perú y Guerra Gaucha), el litoral (Combate de San Lorenzo) y el Pacífico (Plan Continental, Chile y Perú)."
          ]
        },
        {
          titulo: "Expediciones Auxiliadoras al Alto Perú",
          parrafos: [
            "El objetivo de las Expediciones Auxiliadoras al Alto Perú era extender y asegurar la Revolución de Mayo hacia el norte, impedir el avance realista desde el Perú, apoyar a los pueblos favorables a la causa revolucionaria y neutralizar el principal foco militar español en el Alto Perú.",
            "La Primera Campaña Auxiliadora (1810-1811) comenzó con el coronel Francisco Ortiz de Ocampo; luego el mando militar efectivo pasó a Antonio González Balcarce, con Juan José Castelli como delegado político de la Junta. Acciones principales: Cotagaita (27/10/1810), derrota patriota; Suipacha (7/11/1810), primera gran victoria patria; y Huaqui (20/06/1811), derrota decisiva.",
            "Final: tras Huaqui el ejército se desorganizó y se retiró hacia Potosí, Jujuy y Salta; se perdió el control del Alto Perú."
          ]
        },
        {
          titulo: "Segunda campaña: Belgrano y el Ejército del Norte",
          parrafos: [
            "La Segunda Campaña Auxiliadora fue comandada por el general Manuel Belgrano a partir de marzo de 1812.",
            "Belgrano desobedeció la orden del gobierno central de retirarse hasta Córdoba y frenó el repliegue en Tucumán: consideró que abandonar la provincia dejaría desprotegido todo el norte y contaba con un fuerte apoyo de la población tucumana para reorganizar y reforzar sus fuerzas.",
            "El Éxodo Jujeño (23/08/1812) fue la retirada general de la población de Jujuy junto con el Ejército del Norte, aplicando una política de tierra arrasada: se retiraron personas, alimentos, ganado y bienes útiles y se destruyó lo que no podía transportarse. El objetivo era negar recursos al ejército realista y debilitar su avance."
          ]
        },
        {
          titulo: "Las grandes batallas",
          parrafos: [
            "Combate de Las Piedras (3/09/1812): acción de retaguardia con contraataque ofensivo. La retaguardia patriota al mando de Eustoquio Díaz Vélez rechazó y venció a la vanguardia realista, frenó la presión enemiga y elevó la moral del Ejército del Norte.",
            "Batalla de Tucumán (24/09/1812): victoria trascendental. Belgrano contaba con unos 2.000 hombres (infantería en el centro y caballería en las alas, destacada la caballería tucumana en la derecha) frente a los más de 3.000 de Pío Tristán. Maniobra ofensiva: Belgrano modificó el frente de su dispositivo y la carga de la caballería del ala derecha golpeó con fuerza el flanco realista. Tristán no pudo tomar Tucumán y se retiró a Salta.",
            "Batalla de Salta (20/02/1813): victoria completa. Belgrano evitó el camino previsible y realizó un movimiento envolvente por la quebrada de Chachapoyas hasta Castañares: atacó por el norte y la retaguardia, obligando a Tristán a invertir su frente, y luego generalizó el ataque empleando reservas. Tristán capituló: sus tropas entregaron armas y banderas y juraron no volver a combatir contra las Provincias Unidas hasta el Desaguadero.",
            "Batalla de Vilcapugio (1/10/1813): derrota patriota. Aunque la derecha y parte del centro tuvieron ventaja inicial, un toque confuso de reunión o retirada sembró pánico y desorden; la caballería realista de Saturnino Castro golpeó el flanco y la retaguardia, y Joaquín de la Pezuela reorganizó y contraatacó.",
            "Combate de Tambo Nuevo (octubre de 1813): acción exitosa de reconocimiento y sorpresa. En una misión posterior a Vilcapugio, los soldados José Mariano Gómez, Santiago Albarracín y Juan Bautista Salazar sorprendieron de noche a una guardia realista superior en número y tomaron prisioneros; Belgrano los ascendió a sargentos: son los Tres Sargentos de Tambo Nuevo.",
            "Batalla de Ayohuma (14/11/1813): derrota. Belgrano (unos 3.000-3.400 hombres y 8 piezas de artillería) esperaba que el enemigo descendiera a la llanura para atacarlo con rapidez, pero Pezuela (unos 3.500 hombres y 18 cañones) maniobró sobre el flanco patriota y quebró su línea con superioridad de infantería y artillería.",
            "Balance de la Segunda Campaña: Tucumán y Salta salvaron el norte y frenaron la ofensiva realista, pero las derrotas de Vilcapugio y Ayohuma impidieron consolidar el control del Alto Perú; la campaña terminó con el Ejército del Norte a la defensiva."
          ]
        },
        {
          titulo: "La Guerra Gaucha",

var LS = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
var KEYQ = function(id){ return 'est_quiz_' + id; };
var KEYR = function(id){ return 'est_repaso_' + id; };

function home(){
  document.getElementById('hdTitle').textContent = CONTENIDO.titulo;
  var h = '<h2>¿Qué querés estudiar hoy?</h2>' + (CONTENIDO.nota ? '<p class="sub">' + CONTENIDO.nota + '</p>' : '');
  h += '<div class="msg">Cómo funciona: abrí un tema → <b>Leer</b> (resumen con términos táctiles) · <b>Conceptos</b> (tarjetas y lista con buscador) · <b>Cronología</b> (tocás cada fecha para revelar) · <b>Examen</b> (auto-evaluación con opción múltiple, verdadero/falso y completar frases, y nota final al terminar). Tu progreso se guarda solo en este navegador.</div>';
  h += '<div class="temas">' + CONTENIDO.temas.map(function(t){
    var q = LS.get(KEYQ(t.id), null);
    var r = LS.get(KEYR(t.id), [0,0,0,0]);
    var rn = r[0] + r[1] + r[2] + r[3];
    return '<div class="tema" onclick="abrirTema(\'' + t.id + '\')"><b>' + t.nombre + '</b>' +
      '<ul><li>' + t.secciones.length + ' secciones</li><li>' + t.conceptos.length + ' conceptos</li><li>' + t.cronologia.length + ' fechas</li><li>' + t.preguntas.length + ' preguntas</li></ul>' +
      '<div class="prog"><i style="width:' + Math.min(66, (q || 0) + (rn ? 6 : 0)) + '%"></i></div>' +
      (q !== null || rn ? '<span class="note">' + (q !== null ? 'Quiz: ' + Math.round(q) + '%' : '') + (rn ? ' · repaso: ' + rn : '') + '</span>' : '<span class="note">Sin empezar</span>') +
      '</div>';
  }).join('') + '</div>';
  document.getElementById('view').innerHTML = h;
}

function abrirTema(id){
  var t = getTema(id); if (!t) return home();
  document.getElementById('hdTitle').textContent = t.nombre;
  var v = document.getElementById('view');
  v.innerHTML = '<h2>' + t.nombre + '</h2>' +
    '<div class="tabs">' +
    '<button class="on" data-v="leer" onclick="vista(\'' + id + '\',\'leer\',this)">Leer</button>' +
    '<button data-v="conceptos" onclick="vista(\'' + id + '\',\'conceptos\',this)">Conceptos</button>' +
    '<button data-v="crono" onclick="vista(\'' + id + '\',\'crono\',this)">Cronología</button>' +
    '<button data-v="quiz" onclick="vista(\'' + id + '\',\'quiz\',this)">Examen</button></div>' +
    '<div id="bodyVista"></div>';
  vista(id, 'leer');
}
function getTema(id){ return CONTENIDO.temas.find(function(x){ return x.id === id; }); }
function vista(id, v, btn){
  var t = getTema(id);
  if (btn){ document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on', b === btn); }); }
  var body = document.getElementById('bodyVista');
  if (v === 'leer') leer(t, body);
  else if (v === 'conceptos') conceptos(t, body);
  else if (v === 'crono') crono(t, body);
  else quiz(t, body);
  window.scrollTo(0, 0);
}

function resaltar(texto, t){
  var lista = t.conceptos.slice().sort(function(a, b){ return b.t.length - a.t.length; })
    .map(function(c){ return c.t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
  if (!lista.length) return texto;
  var re = new RegExp('(?<![A-Za-zÀ-ÿ0-9])(' + lista.join('|') + ')(?![A-Za-zÀ-ÿ0-9])', 'gi');
  return texto.replace(re, function(m){
    return '<span class="hl" onclick="ficha(\'' + t.id + '\',this)">' + m + '</span>';
  });
}
function leer(t, body){
  var chips = t.secciones.map(function(s, i){
    return '<span class="sec" onclick="irSec(' + i + ')">' + (i + 1) + ') ' + s.titulo + '</span>';
  }).join('');
  body.innerHTML = '<div class="card"><div class="sub">Secciones de la clase (tocá para ir directo):</div>' + chips + '</div>' +
    '<div id="secs">' + t.secciones.map(function(s){
      return '<div class="card sec-blk"><h3>' + s.titulo + '</h3>' +
        s.parrafos.map(function(p){ return '<p>' + resaltar(p, t) + '</p>'; }).join('') + '</div>';
    }).join('') + '</div>' +
    '<div class="row" style="justify-content:center"><button class="ghost bigbtn" onclick="vista(\'' + t.id + '\',\'conceptos\')">Ir a Conceptos →</button></div>';
}
function irSec(i){
  var el = document.querySelectorAll('.sec-blk')[i];
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function ficha(tid, el){
  var t = getTema(tid);
  var term = el.textContent;
  var c = t.conceptos.find(function(x){ return x.t.toLowerCase() === term.toLowerCase(); });
  if (!c) return;
  document.getElementById('fT').textContent = c.t;
  document.getElementById('fD').textContent = c.d;
  document.getElementById('ficha').style.display = 'block';
}
function cerrarFicha(){ document.getElementById('ficha').style.display = 'none'; }

    '<div class="row" style="justify-content:flex-end"><button class="ghost bigbtn" onclick="revelarTodas()">Revelar todas</button></div></div>' +
    '<div id="tlWrap"><div class="tl">' + t.cronologia.map(function(c){
      return '<div onclick="this.classList.toggle(\'abierta\')"><b>' + c.fecha + '</b><p class="pista">tocá para revelar</p><p>' + c.dato + '</p></div>';
    }).join('') + '</div></div>';
}
function revelarTodas(){
  document.querySelectorAll('#tlWrap .tl div').forEach(function(d){ d.classList.add('abierta'); });
}

function barajar(a){
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var x = b[i]; b[i] = b[j]; b[j] = x; }
  return b;
}

function conceptos(t, body){
  var modo = LS.get('est_modo_' + t.id, 'cards');
  body.innerHTML = '<div class="card"><input class="in" id="cBus" placeholder="Buscar concepto..." oninput="renderConceptos(\'' + t.id + '\')">' +
    '<div class="row" style="justify-content:space-between">' +
    '<div class="row"><button class="' + (modo === 'cards' ? 'bigbtn' : 'ghost bigbtn') + '" onclick="setModo(\'' + t.id + '\',\'cards\')">Tarjetas</button>' +
    '<button class="' + (modo === 'lista' ? 'bigbtn' : 'ghost bigbtn') + '" onclick="setModo(\'' + t.id + '\',\'lista\')">Lista</button></div>' +
    '<button class="ghost bigbtn" onclick="barajeo(\'' + t.id + '\')">Mezclar</button></div></div>' +
    '<div id="cBody"></div>';
  renderConceptos(t.id);
}
function setModo(id, m){
  LS.set('est_modo_' + id, m);
  conceptos(getTema(id), document.getElementById('bodyVista'));
}
function renderConceptos(id){
  var t = getTema(id);
  var q = (document.getElementById('cBus').value || '').toLowerCase();
  var lista = t.conceptos.filter(function(c){ return !q || (c.t + ' ' + c.d).toLowerCase().indexOf(q) !== -1; });
  var modo = LS.get('est_modo_' + id, 'cards');
  var body = document.getElementById('cBody');
  if (modo === 'lista'){
    body.innerHTML = lista.map(function(c){
      return '<div class="lista-card"><b>' + c.t + '</b><div>' + c.d + '</div></div>';
    }).join('') || '<p class="sub">Sin resultados.</p>';
  } else {
    var html = lista.map(function(c, i){
      return '<div class="card" style="cursor:pointer" onclick="flipCard(this)"><div class="inner2"><div><b style="color:var(--accent)">' + c.t + '</b><div style="color:var(--muted);font-size:12px;margin-top:4px">tocá para ver definición</div></div><div style="display:none;margin-top:8px;font-size:14px;line-height:1.5">' + c.d + '</div></div></div>';
    }).join('') || '<p class="sub">Sin resultados.</p>';
    if (lista.length > 1) html += '<div class="row" style="justify-content:center"><button class="ghost bigbtn" onclick="mostrarTodas(\'' + id + '\')">Mostrar todas</button></div>';
    body.innerHTML = html;
  }
}
function flipCard(el){ var d = el.querySelector('.inner2>div:last-child'); d.style.display = d.style.display === 'none' ? 'block' : 'none'; }
function mostrarTodas(id){ document.querySelectorAll('#cBody .card .inner2>div:last-child').forEach(function(d){ d.style.display = 'block'; }); }
function barajeo(id){
  var t = getTema(id);
  t.conceptos = barajar(t.conceptos);
  renderConceptos(id);
  var b = LS.get(KEYR(id), [0,0,0,0]);
  LS.set(KEYR(id), [0,0,0,0]);
}

function repaso(t, body, cards){
  cards = cards || t.conceptos.slice();
  var i = 0, actual = null;
  var rate = LS.get(KEYR(t.id), [0,0,0,0]);
  var duros = LS.get('est_duros_' + t.id, []);
  function pintar(){
    if (i >= cards.length){
      var total = rate[0] + rate[1] + rate[2] + rate[3];
      body.innerHTML = '<div class="card"><h2>¡Repaso terminado!</h2>' +
        '<p class="sub">Otra vez: ' + rate[0] + ' · Difícil: ' + rate[1] + ' · Bien: ' + rate[2] + ' · Fácil: ' + rate[3] + '</p>' +
        (rate[0] + rate[1] > 0 ? '<div class="msg">Quedaron ' + (rate[0] + rate[1]) + ' conceptos difíciles. Tocá para repasarlos solo.</div>' : '<div class="msg">¡Impecable!</div>') +
        '<div class="row"><button class="bigbtn" onclick="vista(\'' + t.id + '\',\'conceptos\')">Terminar</button>' +
        (rate[0] + rate[1] > 0 ? '<button class="badbtn bigbtn" onclick="repasarDificiles(\'' + t.id + '\')">Repasar difíciles</button>' : '') +
        '</div></div>';
      return;
    }
    var c = cards[i];
    actual = c;
    var pct = Math.round((i / cards.length) * 100);
    body.innerHTML = '<div class="card"><div class="prog"><i style="width:' + pct + '%"></i></div>' +
      '<div class="note" id="repasoInfo">' + (i + 1) + ' de ' + cards.length + '</div>' +
      '<div class="flip" id="flash" onclick="this.classList.toggle(\'flipped\')"><div class="inner">' +
      '<div class="face">' + c.t + '</div><div class="face back"><small>tocá para ver</small>' + c.d + '</div>' +
      '</div></div>' +
      '<div class="rates">' +
      '<button class="badbtn" onclick="rate(0)">Otra vez</button>' +
      '<button style="background:#e58e00" onclick="rate(1)">Difícil</button>' +
      '<button class="okbtn" onclick="rate(2)">Bien</button>' +
      '<button style="background:var(--accent2)" onclick="rate(3)">Fácil</button></div>' +
      '<div class="row" style="justify-content:space-between;margin-top:10px">' +
      '<button class="ghost bigbtn" onclick="atras()">← Atrás</button>' +
      '<button class="bigbtn" onclick="sig()">Siguiente →</button></div></div>';
    document.getElementById('repasoInfo').textContent = 'Concepto ' + (i + 1) + ' de ' + cards.length;
  }
  window.atras = function(){ if (i > 0) i--; paintInner(); };
  window.sig = function(){ i++; pintar(); };
  window.rate = function(k){
    rate[k]++;
    if (k <= 1 && actual && duros.indexOf(actual.t) === -1) duros.push(actual.t);
    LS.set(KEYR(t.id), rate);
    LS.set('est_duros_' + t.id, duros);
    i++;
    pintar();
  };
  function paintInner(){ pintar(); }
  pintar();
}
function repasarDificiles(id){
  var t = getTema(id);
  var duros = LS.get('est_duros_' + id, []);
  var lista = t.conceptos.filter(function(c){ return duros.indexOf(c.t) !== -1; });
  if (!lista.length) lista = barajar(t.conceptos).slice(0, 5);
  repaso(t, document.getElementById('bodyVista'), barajar(lista));
}

function norm(s){
  var a = 'áàäâãéèëêíìïîóòöôõúùüûñç', b = 'aaaaaeeeeiiiiooooouuuunc', out = '';
  s = (s || '').toLowerCase().trim();
  for (var i = 0; i < s.length; i++){ var j = a.indexOf(s[i]); out += j >= 0 ? b[j] : s[i]; }
  return out.replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function esc(s){ return (s || '').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function tipoLabel(q){
  if (q.tipo === 'vf') return 'Verdadero / Falso';
  if (q.tipo === 'completar') return 'Completar frase';
  return 'Opción múltiple';
}
function respuestaCorrecta(q){
  if (q.tipo === 'vf') return q.v ? 'Verdadero' : 'Falso';
  if (q.tipo === 'completar') return q.o.join(' / ');
  return q.o[q.c];
}
function textoNota(pct){
  if (pct >= 90) return 'Excelente';
  if (pct >= 70) return 'Muy bien';
  if (pct >= 50) return 'Aprobado';
  return 'A estudiar más';
}
function fraseConInput(p){
  var partes = p.split('____');
  if (partes.length === 1) return p + '<input class="inBlank" id="qBlank" placeholder="respuesta">';
  var html = '';
  for (var i = 0; i < partes.length; i++){
    html += partes[i];
    if (i < partes.length - 1) html += '<input class="inBlank" id="qBlank" placeholder="respuesta">';
  }
  return html;
}

function quiz(t, body){
  var idx = 0, ok = 0, done = false, fallos = [];
  var totTipo = { mc: 0, vf: 0, completar: 0 }, okTipo = { mc: 0, vf: 0, completar: 0 };
  var preguntas = barajar(t.preguntas);
  preguntas.forEach(function(q){ totTipo[q.tipo || 'mc']++; });
  function prepPregunta(q){
    var tipo = q.tipo || 'mc';
    if (tipo === 'mc'){
      var orden = barajar(q.o.map(function(txt, oi){ return { t: txt, i: oi }; }));
      return { q: q, tipo: tipo, orden: orden, correcta: orden.findIndex(function(x){ return x.i === q.c; }) };
    }
    if (tipo === 'vf') return { q: q, tipo: tipo, correcta: q.v ? 0 : 1 };
    return { q: q, tipo: tipo, correcta: -1 };
  }
  var cola = preguntas.map(prepPregunta);
  function pintar(){
    if (done){
      var mejor = LS.get(KEYQ(t.id), null);
      var pct = Math.round((ok / t.preguntas.length) * 100);
      var nuevo = mejor === null || pct > mejor;
      if (nuevo) LS.set(KEYQ(t.id), pct);
      var detalle = ['mc', 'vf', 'completar'].map(function(k){
        return '<span style="margin-right:10px">' + (k === 'mc' ? 'Múltiple' : k === 'vf' ? 'V/F' : 'Completar') + ': ' + okTipo[k] + '/' + totTipo[k] + '</span>';
      }).join('');
      var recap = fallos.length ? '<div class="card"><h3>Para repasar</h3>' + fallos.map(function(f){
        return '<div class="lista-card"><b>' + esc(f.q.p).replace(/____/g, '…') + '</b>' +
          '<div class="note">Tu respuesta: ' + esc(f.mal) + '</div>' +
          '<div class="note" style="color:var(--ok)">Correcta: ' + esc(respuestaCorrecta(f.q)) + '</div>' +
          (f.q.e ? '<div class="expl" style="margin-top:6px">' + f.q.e + '</div>' : '') + '</div>';
      }).join('') + '</div>' : '<div class="msg">¡Perfecto, sin errores!</div>';
      body.innerHTML = '<div class="card"><h2>Nota final</h2>' +
        '<div style="font-size:46px;font-weight:800;color:var(--accent);margin:4px 0">' + pct + '<span style="font-size:20px">%</span></div>' +
        '<p class="sub">' + textoNota(pct) + ' · Respondiste bien ' + ok + ' de ' + t.preguntas.length + ' preguntas.</p>' +
        '<div class="prog"><i style="width:' + pct + '%"></i></div>' +
        '<p class="sub">' + detalle + '</p>' +
        (nuevo ? '<p class="sub" style="color:var(--ok)">¡Nuevo mejor resultado en este navegador!</p>' : (mejor !== null ? '<p class="sub">Mejor resultado guardado: ' + mejor + '%</p>' : '')) +
        '<div class="row"><button class="bigbtn" onclick="vista(\'' + t.id + '\',\'quiz\')">Repetir examen</button>' +
        '<button class="ghost bigbtn" onclick="vista(\'' + t.id + '\',\'conceptos\')">Repasar conceptos</button></div></div>' + recap;
      return;
    }
    var c = cola[idx], q = c.q, tipo = c.tipo, i = idx;
    var html = '<div class="card"><div class="sub">Pregunta ' + (i + 1) + ' de ' + cola.length + ' · ' + tipoLabel(q) + '</div>' +
      '<div class="prog"><i style="width:' + Math.round((i / cola.length) * 100) + '%"></i></div>';
    if (tipo === 'mc'){
      html += '<h2 style="font-size:17px;line-height:1.5">' + q.p + '</h2>' +
        c.orden.map(function(op, oi){ return '<button class="qbtn" data-v="' + oi + '">' + String.fromCharCode(65 + oi) + ') ' + esc(op.t) + '</button>'; }).join('');
    } else if (tipo === 'vf'){
      html += '<h2 style="font-size:17px;line-height:1.5">' + q.p + '</h2>' +
        '<button class="qbtn" data-v="0">Verdadero</button><button class="qbtn" data-v="1">Falso</button>';
    } else {
      html += '<div class="sub" style="margin-bottom:8px">Completá la frase:</div>' +
        '<div style="font-size:15.5px;line-height:2;margin:6px 0 12px">' + fraseConInput(q.p) + '</div>' +
        '<button class="bigbtn" id="qOkReal">Responder</button>';
    }
    html += '<div class="fdb" id="qFdb"></div><div class="expl" id="qExpl" style="display:none"></div></div>';
    body.innerHTML = html;
    function terminar(sel, correcto, mal){
      body.querySelectorAll('.qbtn').forEach(function(x){ x.dataset.resolved = '1'; x.disabled = true; });
      if (correcto){ ok++; okTipo[tipo]++; } else { fallos.push({ q: q, mal: mal || '(sin responder)' }); }
      if (tipo === 'completar'){
        var inp = document.getElementById('qBlank');
        if (inp){ inp.disabled = true; inp.style.borderColor = correcto ? 'var(--ok)' : 'var(--bad)'; }
      } else {
        var right = body.querySelector('.qbtn[data-v="' + c.correcta + '"]');
        if (right) right.classList.add('sel-ok');
        if (!correcto){ var selB = body.querySelector('.qbtn[data-v="' + sel + '"]'); if (selB) selB.classList.add('sel-bad'); }
      }
      var e = document.getElementById('qExpl');
      var f = document.getElementById('qFdb');
      f.innerHTML = correcto ? '<b>¡Correcto!</b>' : '<b>Incorrecto.</b> Correcta: ' + esc(respuestaCorrecta(q));
      f.style.cssText = 'color:' + (correcto ? 'var(--ok)' : 'var(--bad)');
      if (q.e){ e.innerHTML = '<b>Explicación:</b> ' + q.e; e.style.display = 'block'; }
      setTimeout(function(){ idx++; pintar(); }, correcto ? 1500 : 3000);
    }
    if (tipo === 'completar'){
      var btn = document.getElementById('qOkReal');
      btn.onclick = function(){
        if (btn.dataset.resolved) return;
        btn.dataset.resolved = '1';
        btn.disabled = true;
        var inp = document.getElementById('qBlank');
        var val = inp ? inp.value : '';
        var normVal = norm(val);
        var hit = normVal !== '' && q.o.some(function(palabra){ return norm(palabra) === normVal; });
        terminar(-1, hit, val || '(en blanco)');
      };
      var inp = document.getElementById('qBlank');
      if (inp) inp.onkeydown = function(ev){ if (ev.key === 'Enter' && !btn.disabled) btn.click(); };
    } else {
      body.querySelectorAll('.qbtn').forEach(function(b){
        b.onclick = function(){
          if (b.dataset.resolved) return;
          var sel = Number(b.dataset.v);
          b.dataset.resolved = '1';
          var mal = tipo === 'vf' ? (sel === 0 ? 'Verdadero' : 'Falso') : c.orden[sel].t;
          terminar(sel, sel === c.correcta, mal);
        };
      });
    }
  }
  pintar();
}

home();
</script>
</body>
</html>
