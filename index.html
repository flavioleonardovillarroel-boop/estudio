<style>
:root{ --bg:#f4f6fb; --card:#ffffff; --ink:#1c2333; --muted:#6b7790; --line:#dfe4ef; --accent:#3d5afe; --accent2:#7c4dff; --ok:#1f9d55; --bad:#e5484d; --soft:#eef1fb; --gold:#b46a00; --inp:#ffffff; }
html.dark{ --bg:#11141d; --card:#1a2030; --ink:#e6eaf5; --muted:#98a4bd; --line:#2b3347; --accent:#7d92ff; --accent2:#a06bff; --ok:#34c76b; --bad:#ff6b6e; --soft:#232a3d; --gold:#ffc25a; --inp:#232a3d; }
html.dark .msg{ background:#2a2414; border-color:#4a3f1f; }
html.dark .qbtn.sel-ok{ background:#10301f; }
html.dark .qbtn.sel-bad{ background:#3a1517; }
html.dark .correc{ background:#3a1517; border-color:rgba(255,107,110,.4); }
html.dark .ficha{ box-shadow:0 -6px 24px rgba(0,0,0,.5); }
html.dark header{ background:linear-gradient(120deg,#2d43c9,#5b32c9); }
*{ box-sizing:border-box; }
body{ margin:0; font-family:Segoe UI,system-ui,-apple-system,Arial,sans-serif; background:var(--bg); color:var(--ink); }
header{ background:linear-gradient(120deg,#3d5afe,#7c4dff); color:#fff; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20; }
header h1{ font-size:18px; margin:0; font-weight:700; }
header button{ background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; }
main{ max-width:820px; margin:0 auto; padding:16px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
h2{ font-size:20px; margin:0 0 4px; }
h3{ font-size:16px; margin:0 0 10px; color:var(--accent); }
.sub{ color:var(--muted); font-size:13px; margin:0 0 12px; }
.temas{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.materias{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.materia{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; cursor:pointer; transition:.15s; position:relative; overflow:hidden; }
.materia:hover{ border-color:var(--accent); transform:translateY(-2px); }
.materia::after{ content:''; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
.materia .ico{ font-size:32px; margin-bottom:8px; }
.materia b{ display:block; font-size:16px; margin-bottom:4px; }
.materia .mDesc{ font-size:12.5px; color:var(--muted); line-height:1.5; }
.grupo{ margin:0 0 22px; }
.grupo h3{ margin:0 0 2px; color:var(--accent); }
.grupo .sub{ margin:2px 0 10px; }
.grupo .subtemas{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.tDesc{ font-size:12.5px; color:var(--muted); margin-bottom:8px; line-height:1.45; }
.tema{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; cursor:pointer; transition:.15s; }
.tema:hover{ border-color:var(--accent); transform:translateY(-2px); }
.tema b{ display:block; font-size:15px; margin-bottom:6px; }
.tema ul{ margin:0; padding-left:16px; font-size:12.5px; color:var(--muted); }
.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
.tabs button{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 14px; font-size:13.5px; cursor:pointer; color:var(--ink); }
.tabs button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
.texto p{ line-height:1.7; margin:0 0 12px; font-size:15px; }
.hl{ background:var(--accent); color:#fff; border-radius:4px; padding:0 3px; cursor:pointer; white-space:nowrap; }
.sec{ font-size:12.5px; color:var(--muted); display:inline-block; background:var(--soft); border:1px solid var(--line); border-radius:20px; padding:3px 10px; margin:0 4px 6px 0; cursor:pointer; }
.bigbtn{ background:var(--accent); border:0; color:#fff; border-radius:10px; padding:11px 15px; font-size:14.5px; cursor:pointer; }
.bigbtn:disabled{ opacity:.45; cursor:default; }
.ghost{ background:var(--card); border:1px solid var(--line); color:var(--ink); }
.okbtn{ background:var(--ok); }
.badbtn{ background:var(--bad); }
.flip{ perspective:1000px; cursor:pointer; }
.flip .inner{ position:relative; transition:transform .4s; transform-style:preserve-3d; }
.flip.flipped .inner{ transform:rotateX(180deg); }
.flip .face{ backface-visibility:hidden; background:var(--soft); border:1px solid var(--line); border-radius:14px; padding:26px 18px; min-height:170px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:18px; }
.flip .back{ position:absolute; inset:0; transform:rotateX(180deg); background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
.flip .back small{ display:block; font-size:12px; opacity:.85; margin-bottom:10px; }
.qbtn{ display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin:7px 0; font-size:14px; cursor:pointer; }
.qbtn.sel-ok{ border-color:var(--ok); background:#e7f6ec; }
.qbtn.sel-bad{ border-color:var(--bad); background:#fdeeee; }
.fdb{ font-size:14px; margin:8px 0; font-weight:700; }
.correc{ background:#fdeeee; border:1px solid rgba(186,41,41,.35); border-left:3px solid var(--bad); border-radius:8px; padding:8px 10px; font-size:13.5px; margin:6px 0; color:var(--ink); }
.correc .note{ margin-top:4px; font-size:13px; }
.inBlank{ display:inline-block; width:180px; max-width:70%; border:1px solid var(--accent); border-bottom:2px solid var(--accent); background:var(--inp); padding:5px 8px; font-size:15px; margin:0 4px; color:var(--ink); border-radius:8px; outline:none; }
.inBlank:disabled{ opacity:.6; }
.expl{ background:var(--soft); border-left:3px solid var(--accent); border-radius:6px; padding:8px 10px; font-size:13px; margin:8px 0; }
textarea.txa{ width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; font-size:14.5px; line-height:1.5; background:var(--card); color:var(--ink); resize:vertical; margin:8px 0; outline:none; }
textarea.txa:focus{ border-color:var(--accent); }
.toastF{ position:fixed; left:14px; right:14px; bottom:18px; z-index:40; display:flex; align-items:center; gap:12px; background:var(--card); border:1.5px solid var(--accent); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.28); padding:14px 16px; font-size:14.5px; line-height:1.45; transform:translateY(30px); opacity:0; pointer-events:none; transition:.35s; max-width:560px; margin-left:auto; margin-right:auto; }
.toastF.in{ transform:translateY(0); opacity:1; pointer-events:auto; }
.toastF .temoji{ font-size:22px; flex-shrink:0; }
.toastF button{ margin-left:auto; background:none; border:0; color:var(--muted); font-size:16px; cursor:pointer; padding:2px 6px; }
.tl{ position:relative; margin-left:8px; padding-left:22px; border-left:2px solid var(--line); }
.tl div{ position:relative; margin-bottom:12px; padding:8px 10px; border-radius:10px; background:var(--card); border:1px solid var(--line); cursor:pointer; }
.tl div::before{ content:''; position:absolute; left:-27px; top:13px; width:10px; height:10px; border-radius:50%; background:var(--accent); }
.tl b{ color:var(--accent); font-size:14px; }
.tl p{ margin:3px 0 0; font-size:14px; line-height:1.5; filter:blur(7px); transition:.25s; user-select:none; }
.tl div.abierta p{ filter:none; user-select:text; }
.tl .pista{ font-size:11.5px; color:var(--muted); margin:0 0 3px; }
.prog{ height:8px; background:var(--line); border-radius:6px; overflow:hidden; margin:10px 0; }
.prog i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0; border-radius:6px; transition:.3s; }
.row{ display:flex; gap:8px; flex-wrap:wrap; }
.note{ font-size:12.5px; color:var(--muted); }
.msg{ background:#fff8e6; border:1px solid #f0ddb0; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
.in{ width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:12px; }
.lista-card{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:6px 0; background:var(--soft); }
.lista-card b{ color:var(--accent); }
.ficha{ position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:3px solid var(--accent); padding:16px 18px 18px; z-index:30; box-shadow:0 -6px 24px rgba(0,0,0,.12); }
.ficha b{ color:var(--accent); font-size:15px; }
.ficha p{ margin:6px 0 12px; font-size:14px; line-height:1.5; }
.rates{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; margin-top:12px; }
.rates button{ border:0; border-radius:9px; padding:9px 4px; font-size:12.5px; cursor:pointer; color:#fff; }
@media(max-width:560px){ .temas{ grid-template-columns:1fr; } .grupo .subtemas{ grid-template-columns:1fr; } .materias{ grid-template-columns:1fr; } }
.login{ max-width:430px; margin:6vh auto 0; }
.chip{ background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; margin-left:6px; }
.hbtn{ display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:7px 0; font-size:14.5px; cursor:pointer; color:var(--ink); }
.pin{ letter-spacing:7px; text-align:center; font-size:17px; font-weight:700; }
.timer{ display:inline-block; background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:4px 11px; font-size:13px; font-weight:700; margin-bottom:8px; }
.timer.tick{ background:var(--bad); border-color:var(--bad); color:#fff; }
.mini{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.mini .der{ display:flex; gap:6px; }
.mini .x{ background:var(--bad); border:0; border-radius:7px; color:#fff; padding:6px 9px; font-size:12px; cursor:pointer; }
</style>
</head>

<header>
  <h1 id="hdTitle">Estudio</h1>
  <div>
    <button id="btnTema" onclick="alternarTema()" title="Claro / oscuro">🌙</button>
    <button id="btnUser" onclick="pantallaLogin()" title="Cambiar de usuario">👤</button>
    <button onclick="home()">Inicio</button>
  </div>
</header>
<main id="view"></main>
<div class="ficha" id="ficha" style="display:none"><b id="fT"></b><p id="fD"></p><div class="row"><button class="ghost bigbtn" onclick="cerrarFicha()">Cerrar</button></div></div>
<script>
var CONTENIDO = {
  titulo: "Estudio · Historia y Especialidad",
  nota: "Materias cargadas: Historia (3 unidades), Táctica (ROB 00-01), Técnica (ROP 19-01), Didáctica Especial Militar (RFD 51-03) y Logística (ROD 19-01/19-02 y RFD 20-01/21-01). Exámenes finales el 24 y 25/09/2026.",
  temas: [
    {
      id: "historia",
      nombre: "UD 2 (Clase 3) · Guerra del Brasil y Obligado",
      desc: "Guerra del Brasil (1825-1828): Ituzaingó y Carmen de Patagones, consecuencias políticas, y el conflicto anglo-francés con la Vuelta de Obligado (1845).",
      secciones: [
        {
          titulo: "Presentación de la clase",
          parrafos: [
            "La clase estudia las acciones bélicas contra potencias extranjeras previas a la consolidación del Estado Nacional: la Guerra del Brasil (1825-1828) y el Conflicto Anglo-Francés (1845-1849), cuyo episodio central fue el Combate de la Vuelta de Obligado (20/11/1845).",
            "En ambos conflictos, las Provincias Unidas y luego la Confederación enfrentaron a potencias con superioridad naval y material, por el control estratégico de la cuenca del Plata: un factor que marcó todo el período y condicionó la construcción del Estado."
          ]
        },
        {
          titulo: "Guerra del Brasil · origen y antecedentes",
          parrafos: [
            "La Guerra del Brasil fue un conflicto armado entre las Provincias Unidas del Río de la Plata y el Imperio del Brasil, originado en el levantamiento de la Provincia Oriental contra la dominación brasileña y en la posterior incorporación de ese territorio a las Provincias Unidas. Se desarrolló en los ámbitos terrestre, fluvial y marítimo, y concluyó en 1828 con una solución diplomática que dio origen a la República Oriental del Uruguay.",
            "Constituyó un conflicto regional en el que confluyeron tres cuestiones: la cuestión oriental, la construcción de la autoridad política en las Provincias Unidas y la disputa por el control estratégico del Río de la Plata.",
            "Los antecedentes eran geopolíticos: desde la época colonial el espacio rioplatense fue zona de competencia entre las coronas española y portuguesa. La Banda Oriental interesaba a Portugal y a Brasil por su posición frente al Río de la Plata, el control de las comunicaciones fluviales y terrestres, la seguridad de la frontera meridional brasileña y sus recursos ganaderos.",
            "De la intervención portuguesa a la Provincia Cisplatina: 1808 traslado de la corte portuguesa a Río de Janeiro; 1811 intervención en la Banda Oriental; 1816 invasión luso-brasileña y derrota del proyecto artiguista; 1817 ocupación de Montevideo; 1821 incorporación de la Banda Oriental como Provincia Cisplatina; 1822 independencia de Brasil, quedando la provincia bajo el nuevo Imperio."
          ]
        },
        {
          titulo: "1825 · de la cuestión oriental a la guerra",
          parrafos: [
            "El 19 de abril de 1825 desembarcaron los Treinta y Tres Orientales, expedición encabezada por Juan Antonio Lavalleja; en los meses siguientes el movimiento se extendió por la campaña oriental y enfrentó a las fuerzas imperiales.",
            "El 25 de agosto la Asamblea de la Florida declaró la independencia de la Provincia Oriental respecto del Imperio del Brasil y manifestó su voluntad de incorporarse a las Provincias Unidas. El 25 de octubre el Congreso Constituyente aceptó la incorporación: ese fue el casus belli. El 10 de diciembre de 1825 el Imperio del Brasil declaró la guerra a las Provincias Unidas.",
            "Ante la declaración, Brasil empleó su superioridad naval para bloquear los principales puertos, en especial Buenos Aires: el objetivo era aislar económicamente a las Provincias Unidas, interrumpir su comercio exterior y dificultar el abastecimiento y la capacidad de sostener la guerra."
          ]
        },
        {
          titulo: "Un Estado en construcción y un ejército por organizar",
          parrafos: [
            "En 1825 las Provincias Unidas NO constituían un Estado nacional consolidado: cada provincia conservaba su autonomía política, administrativa y fiscal. Esta etapa, conocida como período de las autonomías provinciales, comenzó con la disolución del poder central tras la batalla de Cepeda (1820) y duró hasta la organización constitucional de 1853.",
            "La declaración de guerra exigió crear una fuerza nacional a partir de estructuras fragmentadas. La Ley de Creación de un Ejército Nacional (31/05/1825) fijó 7.600 efectivos, con aportes por provincia (Buenos Aires 1.600; Córdoba 1.200; Santa Fe 200), sobre la base de los restos del Regimiento Río de la Plata, el Ejército Auxiliar del Perú y el Batallón de Cazadores de Salta; se designó general en jefe a Martín Rodríguez. El reclutamiento forzoso, la falta de presupuesto y la crisis del bloqueo provocaron fuerte resistencia social.",
            "En 1826 el Congreso Constituyente creó un Poder Ejecutivo nacional y Bernardino Rivadavia fue elegido presidente para unificar la dirección del esfuerzo de guerra, sin una Constitución formalmente consolidada. Comandaban el esfuerzo: Carlos María de Alvear al frente del ejército republicano y Guillermo Brown al mando de la escuadra. Del lado imperial, comandaban el ejército el Marqués de Barbacena, mientras el emperador era Pedro I.",
            "El plan republicano consistía en una marcha de aproximación de más de 400 km hasta Bagé y luego una maniobra por líneas interiores: batir fraccionadamente al enemigo, atacando primero a una agrupación y, consolidada la victoria, incidir sobre la otra.",
            "El camino fue durísimo: en 30 días se recorrieron los 400 km venciendo el calor, la falta de agua y alimentos; hubo un saqueo vergonzoso de Bagé; las lluvias convirtieron la zona en una ciénaga y obligaron a detenerse 5 días, tiempo que aprovechó el enemigo para reunir su ejército. Barbacena eligió las sierras de Camacuá, pedregosas y quebradas, para neutralizar la caballería argentina, mayor fortaleza republicana."
          ]
        },
        {
          titulo: "Batalla de Ituzaingó · 20/02/1827",
          parrafos: [
            "Fuerzas enfrentadas: el Ejército Republicano contaba con unos 7.700 hombres bajo el mando de Alvear, con Lavalleja en la vanguardia y división de caballería clave a cargo de Brandsen, Lavalle, Olazábal, Iriarte y Soler. El Ejército Imperial sumaba 8.500 a 9.000 efectivos, con contingentes veteranos de línea y mercenarios europeos, comandados por el Marqués de Barbacena. Los republicanos tenían preponderancia de caballería; el Imperio, mejores pertrechos, apoyo logístico e infantería regular.",
            "Barbacena calculó erróneamente que los republicanos se retiraban y ordenó avanzar en la madrugada del 20 de febrero. Alvear, advertido del terreno desventajoso (a orillas del crecido río Santa María), adelantó tropas para ocupar las alturas dominantes del Morro de las Calaveras y ganó tiempo para desplegar el grueso del ejército. Un zanjón transversal frenó a la infantería brasileña, que quedó inmovilizada.",
            "Las cargas: Lavalleja cargó sobre la izquierda brasileña y, aunque fue rechazado, obligó a los imperiales a formar en cuadro, perdiendo movilidad. La heroica carga de Brandsen, ordenada por Alvear contra el zanjón y la infantería enemiga, costó la muerte del coronel pero quebró la resistencia. Sucesivas cargas de Paz, Lavalle y Pacheco y la lúcida maniobra de Olavarría desorganizaron a la caballería imperial; la infantería en cuadro terminó desbordada por los flancos y Barbacena debió retirarse en desorden, con su parque amenazado por un incendio.",
            "Bajas y resultados: imperiales entre 300 y 400 muertos y heridos, más prisioneros, el archivo del ejército y la casaca roja de Barbacena (que Alvear llevó como trofeo); además se capturó la partitura de la marcha que pasó a ser la Marcha de Ituzaingó. Bajas republicanas: alrededor de 150. PERO no se pudo explotar la ventaja militar, porque la tropa estaba agotada, sin raciones y los caballos al límite.",
            "¿Fue una batalla decisiva? No: para ser decisiva debe alterar de forma permanente el curso de la guerra, destruir el centro de gravedad enemigo y obligar al adversario a cambiar su concepción estratégica. Conclusiones de la campaña: la maniobra transformó una situación táctica desfavorable (río a la espalda, terreno bajo) en victoria mediante la ocupación de puntos llave y armas combinadas; preponderancia de la caballería; aproximación indirecta; y problemas de mando, ya que el resistido liderazgo de Alvear fue compensado por la iniciativa de sus coroneles."
          ]
        },
        {
          titulo: "Combate de Carmen de Patagones · 07/03/1827",
          parrafos: [
            "Ante el bloqueo de Buenos Aires, Carmen de Patagones se transformó en refugio y apostadero de los corsarios de las Provincias Unidas, por lo que se volvió un objetivo imperial. La expedición invasora, dirigida en el terreno por el capitán de fragata inglés James Shepherd, reunió 4 buques de guerra (Duqueza de Goiás, Itaparica, Escudeiro y Constanza), 52 piezas de artillería y más de 600 hombres.",
            "La guerra de corso fue clave: el Estado autoriza a particulares a armar buques para hostigar el comercio enemigo, regulados por la Patente de Corso, con presas validadas por un Tribunal de Presas; el corsario es combatiente legítimo, no pirata. Multiplicó la capacidad de fuego de las Provincias Unidas, dificultó el comercio imperial y obligó a la Armada brasileña a dispersarse.",
            "La defensa local, sin apoyo del gobierno y sin caballos, fue organizada por el comandante Martín Lacarra con 330 hombres: tropas del fuerte, infantería de negros libertos, marinos de los buques corsarios (Bella Flor, Oriental Argentino, los balleneros Hijo de Mayo e Hijo de Julio, las goletas Emperatriz y Chiquita) y milicias de gauchos y vecinos. Como estratagema, se vistió a mujeres y ancianos con uniformes y gorros rojos en el fuerte para simular una gran reserva.",
            "El río Negro y sus bancos de arena jugaron un papel decisivo: Bynnon desplegó los corsarios aislando la flota imperial; la Duqueza de Goiás encalló y se destruyó, y la Itaparica quedó severamente dañada. Shepherd desembarcó 400 infantes en la medianoche del 6 de marzo, pero fueron emboscados en el Cerro de la Caballada con fuego combinado de los buques y las fuerzas terrestres; el capitán murió en los primeros intercambios. A media mañana las naves restantes se rindieron y por la tarde capituló la Itaparica. Una victoria táctica asimétrica que neutralizó la expedición anfibia brasileña."
          ]
        },
        {
          titulo: "Fin de la guerra y consecuencias políticas",
          parrafos: [
            "La guerra entró en un punto muerto por el impacto económico del bloqueo y el agotamiento financiero de ambas naciones. La diplomacia británica, mediada por Lord John Ponsonby, impulsó la paz para destrabar el comercio y asegurar la libre navegación del estuario.",
            "En 1827 Rivadavia envió a Río de Janeiro al ministro Manuel García, pero la Misión García implicaba renunciar a la soberanía sobre la Provincia Oriental y desmovilizar: su contenido fue rechazado en Buenos Aires como una claudicación, la 'paz deshonrosa', frente a las victorias obtenidas. El repudio aceleró la renuncia de Rivadavia y la disolución de los poderes nacionales y del Congreso Constituyente.",
            "Restituida la autonomía provincial, la Legislatura bonaerense eligió gobernador al coronel Manuel Dorrego, que quedó a cargo de las relaciones exteriores. Obligado por la falta de recursos, firmó en agosto de 1828 la Convención Preliminar de Paz, que consagró la independencia de la Provincia Oriental como mal menor: nacía la República Oriental del Uruguay. El descontento del ejército, parte del cual era de tendencia unitaria, llevó a que el 1 de diciembre de 1828 Dorrego fuera derrocado; tras ofrecer resistencia armada, fue fusilado en Navarro el 13 de diciembre por el coronel Juan Lavalle.",

            "Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.002, incs. a a e, pág. Cap. III-1 (PDF pág. 45).",
            "PREGUNTA 3 — Mencione y explique brevemente las tareas previas que todo educador debe realizar antes de iniciar el acto educativo.",
            "RESPUESTA MODELO: Antes de comenzar, el educador debe estudiar el plan de clase o de instrucción; dominar los contenidos; verificar objetivos, estándares e indicadores; conocer las características del grupo; preparar el escenario; comprobar los Medios Auxiliares para la Educación; coordinar apoyos; prever riesgos y medidas de seguridad; organizar tiempos y actividades; y ensayar demostraciones o procedimientos cuando corresponda. También debe confirmar la disponibilidad del material, el estado del equipo y las condiciones administrativas necesarias.",
            "Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.003, incs. a a k, págs. Cap. III-1 y III-2 (PDF págs. 45 y 46).",
            "PREGUNTA 4 — ¿Por qué la ejecución es considerada la materialización sobre el terreno o en el aula del planeamiento didáctico realizado previamente?",
            "RESPUESTA MODELO: Porque durante la ejecución se aplican las decisiones adoptadas en el planeamiento: qué enseñar, para qué hacerlo, en qué secuencia, con qué método, mediante qué actividades y cómo comprobar el aprendizaje. El plan deja de ser una previsión escrita y se transforma en conductas del instructor y de los educandos. La calidad de esta fase permite verificar si lo planificado era adecuado y si debe ajustarse durante o después de la actividad.",
            "Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.002, incs. a, b, d y e, pág. Cap. III-1 (PDF pág. 45).",
            "PREGUNTA 5 — ¿Qué implicancias tiene para el instructor el correcto acondicionamiento y preparación del escenario educativo antes de la llegada de los educandos?",
            "RESPUESTA MODELO: Implica asumir la responsabilidad de que el lugar sea seguro, funcional y coherente con la actividad. El instructor debe ordenar el espacio, verificar iluminación, ventilación, visibilidad y circulación; ubicar materiales y MAPE; probar equipos; eliminar riesgos; delimitar sectores; y prever alternativas ante fallas. Una preparación adecuada evita demoras, reduce distracciones, transmite profesionalismo y permite concentrar el tiempo disponible en el aprendizaje.",
            "Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.003, incs. a a k, págs. Cap. III-1 y III-2 (PDF págs. 45 y 46); y art. 3.006, inc. c, págs. Cap. III-5 a III-7 (PDF págs. 49 a 51).",
            "PREGUNTA 6 — ¿Cómo influye el ejercicio del mando y el liderazgo del educador en la efectividad durante la ejecución de la instrucción?",
            "RESPUESTA MODELO: El mando y el liderazgo dan dirección, cohesión y sentido al acto educativo. El educador establece normas claras, mantiene la disciplina, motiva con el ejemplo, comunica con precisión y genera confianza para preguntar y corregir errores. Su autoridad debe ejercerse con firmeza, respeto, justicia y coherencia. Cuando conduce bien, el grupo comprende la finalidad de la actividad, participa y sostiene el esfuerzo necesario para alcanzar el estándar.",
            "Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.006, incs. e.1 y f, págs. Cap. III-8 y III-9 (PDF págs. 52 y 53); Sección IV, art. 3.020, inc. b.2.a, pág. Cap. III-17 (PDF pág. 61).",

        {
          titulo: "Sección II Pasos de la ejecución de la instrucción",
          parrafos: [
            "PREGUNTA 7 — Estructure y nombre los tres pasos fundamentales que componen la ejecución de la instrucción.",
            "RESPUESTA MODELO: La ejecución se organiza en tres pasos: Inicio, Desarrollo y Final. El Inicio dispone al educando para aprender y presenta la finalidad de la actividad. El Desarrollo concentra la enseñanza, la práctica y la aplicación de los contenidos. El Final integra lo aprendido, comprueba los resultados, corrige errores y orienta la continuidad del aprendizaje.",
            "Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.004, pág. Cap. III-2 (PDF pág. 46).",
            "PREGUNTA 8 — Describa los objetivos del Primer Paso Inicio. ¿Qué elementos pedagógicos y motivacionales deben incluirse en este paso?",
            "RESPUESTA MODELO: El Inicio busca captar la atención, generar disposición para aprender y relacionar el nuevo contenido con conocimientos previos. Debe incluir la presentación del tema y de su utilidad profesional, una motivación vinculada con una situación concreta, la recuperación de saberes previos, la comunicación de los resultados esperados y la explicación breve de cómo se desarrollará la actividad. También se aclaran normas, organización y medidas de seguridad cuando correspondan.",
            "Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.005, incs. a, b.1 a b.3 y c, págs. Cap. III-2 y III-3 (PDF págs. 46 y 47).",
            "PREGUNTA 9 — ¿En qué consiste el Segundo Paso Desarrollo y por qué constituye el centro de gravedad del acto educativo?",
            "RESPUESTA MODELO: El Desarrollo es el momento en que se enseñan, demuestran, practican y aplican los conocimientos, procedimientos y actitudes previstos. Constituye el centro de gravedad porque allí se produce la mayor parte de la actividad del educando y se construye la competencia. El instructor organiza experiencias progresivas, observa el desempeño, formula preguntas, corrige, retroalimenta y modifica el ritmo cuando la situación lo exige.",
            "Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.006, introducción e incs. a a f, págs. Cap. III-3 a III-9 (PDF págs. 47 a 53).",
            "PREGUNTA 10 — Explicite el rol que asume el educador militar durante la fase de desarrollo al aplicar el enfoque de educación basada en competencias.",
            "RESPUESTA MODELO: El educador actúa como conductor, facilitador, demostrador y evaluador del desempeño. Presenta situaciones profesionales, explica criterios, muestra procedimientos, asigna tareas, observa evidencias y proporciona retroalimentación inmediata. No se limita a transmitir información: crea oportunidades para que el educando integre saberes, habilidades y actitudes y pueda actuar con autonomía creciente dentro de los límites establecidos.",
            "Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.006, incs. d.1 a d.7 y e.1 a e.4, págs. Cap. III-8 y III-9 (PDF págs. 52 y 53).",
            "PREGUNTA 11 — ¿Qué tipo de actividades debe realizar el educando durante el desarrollo para asegurar un aprendizaje activo y la consolidación de competencias?",
            "RESPUESTA MODELO: Debe observar con propósito, formular preguntas, analizar situaciones, resolver problemas, practicar procedimientos, trabajar individualmente y en equipo, tomar decisiones, justificar respuestas y corregir su actuación a partir de la retroalimentación. Las actividades deben exigir una participación real y progresiva, con oportunidades de repetición consciente y aplicación en situaciones semejantes a las del futuro desempeño.",
            "Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.006, incs. d.1 a d.7 y e.1 a e.4, págs. Cap. III-8 y III-9 (PDF págs. 52 y 53).",
            "PREGUNTA 12 — Defina la importancia del Tercer Paso Final y mencione qué actividades clave deben realizarse en él.",
            "RESPUESTA MODELO: El Final permite integrar la experiencia y determinar qué se aprendió. El instructor realiza una síntesis de los conceptos centrales, comprueba el aprendizaje mediante preguntas o tareas breves, corrige errores relevantes, efectúa la crítica, brinda retroalimentación, evacua dudas y relaciona el resultado con próximas actividades. También dispone la restitución del escenario y controla el material y equipo empleados.",
            "Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.007, incs. a a c, págs. Cap. III-9 y III-10 (PDF págs. 53 y 54).",
            "PREGUNTA 13 — ¿Cuál es la diferencia sustancial entre la síntesis que realiza el instructor al final de la clase y la comprobación del aprendizaje alcanzado por los educandos?",
            "RESPUESTA MODELO: La síntesis es una acción del instructor que ordena y relaciona los contenidos esenciales para facilitar su comprensión. La comprobación, en cambio, exige una respuesta o actuación del educando y produce evidencia sobre lo que realmente aprendió. Una buena síntesis puede aclarar el tema, pero no demuestra por sí sola que el educando haya alcanzado la capacidad prevista.",
            "Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.007, incs. a a c, págs. Cap. III-9 y III-10 (PDF págs. 53 y 54); y Sección I, art. 3.001, inc. d, pág. Cap. III-1 (PDF pág. 45).",
            "PREGUNTA 14 — ¿Cómo se realiza la crítica y la retroalimentación al finalizar una sesión de instrucción en el ámbito militar?",
            "RESPUESTA MODELO: Se realiza de manera objetiva, oportuna y orientada a mejorar el desempeño. Primero se recuerda la tarea y el estándar; luego se señalan los aciertos, los errores observables y sus causas; finalmente se indica cómo corregirlos y qué debe practicarse. La crítica debe centrarse en conductas y resultados, no en descalificaciones personales. Cuando es posible, se invita al educando a autoevaluarse antes de recibir la apreciación del instructor.",
            "Referencia: RFD 51-03, Capítulo III, Sección II, art. 3.007, incs. a a c, págs. Cap. III-9 y III-10 (PDF págs. 53 y 54); Sección VI, art. 3.030, inc. a.5, pág. Cap. III-24 (PDF pág. 68).",
            "PREGUNTA 15 — ¿Qué medidas debe adoptar el instructor en la fase final respecto de los MAPE y el vestuario o equipo utilizado?",
            "RESPUESTA MODELO: Debe ordenar el cese de la actividad, comprobar cantidades y estado, limpiar y acondicionar los elementos, registrar novedades, devolverlos a sus responsables y asegurar su almacenamiento. Si se utilizó vestuario o equipo especial, debe verificar su correcta restitución y cualquier daño o faltante. El escenario debe quedar en condiciones y los medios sensibles o peligrosos deben controlarse conforme a las normas vigentes.",
            "Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.003, incs. d a f e i, págs. Cap. III-1 y III-2 (PDF págs. 45 y 46); Sección II, art. 3.007 y Figura 12-III, págs. Cap. III-9 y III-10 (PDF págs. 53 y 54).",

        {
          titulo: "Sección III Materias de la instrucción y el adiestramiento operacional",
          parrafos: [
            "PREGUNTA 16 — ¿Cuáles son las pautas comunes que deben regir la ejecución de todas las materias de la instrucción militar?",
            "RESPUESTA MODELO: Todas las materias deben orientarse a una finalidad concreta, respetar la progresión didáctica, promover la actividad del educando, mantener realismo compatible con la seguridad y utilizar métodos adecuados al contenido y al grupo. La ejecución debe integrar teoría y práctica, relacionar cada aprendizaje con el desempeño militar, sostener la disciplina, emplear racionalmente los recursos y comprobar resultados mediante evidencias observables.",
            "Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.008, incs. a a e, págs. Cap. III-10 y III-11 (PDF págs. 54 y 55).",
            "PREGUNTA 17 — Describa las particularidades metodológicas en la ejecución de la materia Formación Ética Espiritual y Social.",
            "RESPUESTA MODELO: Debe desarrollarse mediante reflexión guiada, análisis de casos, diálogo, ejemplo personal y vinculación con situaciones reales del servicio. No corresponde reducirla a la memorización de valores. El educador debe favorecer el juicio moral, la responsabilidad, el respeto por la dignidad humana, el compromiso institucional y la coherencia entre convicciones y conducta. Los intercambios requieren un clima respetuoso y compatible con las normas de la institución.",
            "Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.009, texto introductorio e incs. a y b, págs. Cap. III-11 y III-12 (PDF págs. 55 y 56).",
            "PREGUNTA 18 — ¿Cómo debe abordarse la enseñanza de la Formación Social Militar en las distintas categorías de personal?",
            "RESPUESTA MODELO: Debe adecuarse a la edad, experiencia, jerarquía, responsabilidades y funciones de cada categoría. En la tropa se priorizan hábitos de convivencia, disciplina, integración y cumplimiento del rol. En suboficiales se profundizan la conducción cercana, la formación del personal y la responsabilidad como auxiliares del mando. En oficiales se enfatizan el liderazgo, la conducción de organizaciones, la toma de decisiones y la responsabilidad institucional. Los principios son comunes, pero cambian la profundidad y las situaciones de aplicación.",
            "Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.010, incs. a a c, pág. Cap. III-12 (PDF pág. 56).",
            "PREGUNTA 19 — Explique las características particulares que adopta la ejecución de la materia Didáctica Especial Militar en los institutos de formación o cursos.",
            "RESPUESTA MODELO: La materia debe combinar fundamentos pedagógicos con práctica docente militar. Los cursantes analizan competencias, capacidades, estándares, métodos y evaluación, pero también diseñan planes, preparan MAPE, conducen clases o instrucciones y reciben crítica sobre su desempeño. La ejecución debe modelar aquello que enseña: claridad de objetivos, participación, realismo, progresión, retroalimentación y coherencia entre planeamiento, desarrollo y evaluación.",
            "Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.011, incs. a a f, pág. Cap. III-12 (PDF pág. 56).",
            "PREGUNTA 20 — ¿Cuáles son las exigencias de realismo, seguridad y dinamismo para la ejecución de la instrucción de Combate?",
            "RESPUESTA MODELO: La instrucción debe representar con fidelidad creciente las exigencias de la operación, incluyendo incertidumbre, fatiga, coordinación, terreno y presión temporal, sin exceder la preparación del personal. La seguridad es prioritaria: se identifican riesgos, se imparten normas, se controlan armas y medios, se establecen responsables y se detiene la actividad ante una condición insegura. El dinamismo se logra mediante problemas cambiantes y decisiones, sin convertir el ejercicio en improvisación descontrolada.",
            "Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.012, incs. a a p, págs. Cap. III-12 y III-13 (PDF págs. 56 y 57).",
            "PREGUNTA 21 — Detalle los aspectos críticos que debe cuidar el instructor durante la ejecución de la instrucción de Tiro.",
            "RESPUESTA MODELO: La prevención exige cumplir estrictamente las normas de seguridad, controlar armas y munición, organizar la línea de tiro y asegurar comunicaciones inequívocas. La progresión debe avanzar desde posiciones, manipulación y tiro en seco hacia ejercicios con mayor complejidad. La técnica se enseña mediante demostración, práctica controlada y observación individual. La corrección de tiro debe basarse en evidencias, identificar la causa del error y aplicar una corrección por vez, sin comprometer la seguridad.",
            "Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.013, incs. a a n, págs. Cap. III-13 y III-14 (PDF págs. 57 y 58).",
            "PREGUNTA 22 — ¿Cómo se debe estructurar y ejecutar una sesión de Adiestramiento Físico Militar para garantizar el desarrollo progresivo sin poner en riesgo la salud del personal?",
            "RESPUESTA MODELO: La sesión debe incluir entrada en calor, parte principal y vuelta a la calma. La carga se ajusta al nivel, edad, estado de salud, clima y objetivos, y aumenta gradualmente en volumen e intensidad. El instructor controla técnica, hidratación, recuperación y signos de fatiga o lesión; verifica condiciones del terreno y aplica pausas cuando sean necesarias. El registro del rendimiento permite individualizar esfuerzos y evitar sobrecargas.",
            "Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.014, incs. a a k, págs. Cap. III-14 y III-15 (PDF págs. 58 y 59).",
            "PREGUNTA 23 — ¿Cuál es el propósito didáctico de la materia Orden Cerrado y qué aspectos de disciplina y coordinación colectiva refuerza?",
            "RESPUESTA MODELO: Su propósito es formar hábitos de disciplina, precisión, atención, postura, respuesta a voces de mando y actuación coordinada. Refuerza la obediencia consciente, la uniformidad de movimientos, el sentido de pertenencia y la cohesión. Debe enseñarse mediante explicación breve, demostración correcta, ejecución por tiempos, práctica repetida y corrección inmediata, evitando que la repetición pierda finalidad educativa.",
            "Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.015, incs. a a g, pág. Cap. III-15 (PDF pág. 59).",
            "PREGUNTA 24 — Explique las particularidades en la ejecución de materias técnicas como Teoría General y Escritura en Campaña y Cartografía.",

            "Referencia: RFD 51-03, Capítulo III, Sección III, arts. 3.016, incs. a a e, y 3.017, incs. a a c, págs. Cap. III-15 y III-16 (PDF págs. 59 y 60).",

        {

          parrafos: [
            "PREGUNTA 25 — ¿Cuál es la finalidad y los lineamientos generales de la Educación Operacional de los Cuadros?",
            "RESPUESTA MODELO: La EOC mantiene y perfecciona la aptitud profesional de oficiales y suboficiales para cumplir funciones de mando, conducción, asesoramiento, ejecución y apoyo. Se desarrolla en forma continua, vinculada con el puesto y con las necesidades del elemento. Sus lineamientos incluyen realismo, actualización doctrinaria y técnica, responsabilidad de la cadena de mando, aprendizaje autónomo, aplicación práctica y evaluación conforme a las competencias requeridas.",
            "Referencia: RFD 51-03, Capítulo III, Sección IV, arts. 3.019 y 3.020, págs. Cap. III-16 a III-18 (PDF págs. 60 a 62).",
            "PREGUNTA 26 — Identifique las áreas de desempeño profesional que abarca la capacitación continua de los cuadros.",
            "RESPUESTA MODELO: Abarca la conducción y el mando; el planeamiento y la toma de decisiones; la instrucción y educación del personal; el empleo táctico y técnico de medios; la administración de recursos; la logística; las comunicaciones; la seguridad; el asesoramiento; y las funciones específicas de cada arma, especialidad o servicio. La selección concreta depende del cargo, la jerarquía y la misión del elemento.",
            "Referencia: RFD 51-03, Capítulo III, Sección IV, art. 3.020, incs. a a e, págs. Cap. III-16 a III-18 (PDF págs. 60 a 62).",
            "PREGUNTA 27 — ¿Cuáles son los aspectos particulares que diferencian la instrucción destinada a los Oficiales de la destinada a los Suboficiales?",
            "RESPUESTA MODELO: En los oficiales se enfatizan la conducción, el planeamiento, la apreciación, la decisión, la coordinación y la responsabilidad integral sobre la misión. En los suboficiales se profundizan el dominio técnico, la ejecución y supervisión de procedimientos, la conducción directa del personal y el asesoramiento especializado. Esta distinción no es absoluta: ambos deben comprender la misión, liderar, enseñar y actuar coordinadamente según su nivel de responsabilidad.",
            "Referencia: RFD 51-03, Capítulo III, Sección IV, arts. 3.021, incs. a a e, y 3.022, incs. a a e, págs. Cap. III-18 a III-20 (PDF págs. 62 a 64).",
            "PREGUNTA 28 — ¿Qué rol cumple la Escuela de Regimiento y el aprendizaje autónomo dentro del marco de la EOC?",
            "RESPUESTA MODELO: La Escuela de Regimiento organiza la capacitación continua dentro del elemento, vinculándola con sus necesidades reales y con el desempeño de los cargos. El aprendizaje autónomo permite que cada cuadro mantenga y amplíe sus conocimientos mediante estudio, práctica y actualización personal. Ambos se complementan: la organización orienta prioridades y proporciona oportunidades, mientras el individuo asume responsabilidad por su perfeccionamiento.",
            "Referencia: RFD 51-03, Capítulo III, Sección IV, art. 3.021, inc. b, pág. Cap. III-18 (PDF pág. 62); Sección VIII, art. 3.032, incs. a a d, pág. Cap. III-25 (PDF pág. 69).",

            "RESPUESTA MODELO: Resultan adecuados los trabajos de gabinete, estudios de caso, resolución de problemas, ejercicios de gabinete, juegos de guerra, exposiciones dialogadas, discusiones dirigidas, prácticas en el terreno, simulaciones, análisis después de la acción y aprendizaje autónomo orientado. La elección depende de la capacidad que se busca desarrollar; para conducción y decisión deben priorizarse situaciones que obliguen a analizar, decidir, fundamentar y coordinar.",

            "PREGUNTA 31 — Defina la finalidad e importancia fundamental de la Educación Operacional de la Tropa dentro del Ejército.",
            "RESPUESTA MODELO: La EOT forma al soldado para cumplir con seguridad, disciplina y eficacia las tareas correspondientes a su rol dentro de una fracción. Es fundamental porque transforma al individuo en un integrante útil de la organización militar, desarrolla competencias básicas y específicas, fortalece valores y proporciona la base sobre la cual se realiza el adiestramiento colectivo.",
            "Referencia: RFD 51-03, Capítulo III, Sección V, arts. 3.025 y 3.026, incs. d y e, pág. Cap. III-21 (PDF pág. 65).",
            "PREGUNTA 32 — ¿Cuáles son los aspectos centrales a tener en cuenta durante la instrucción individual del Soldado Voluntario?",
            "RESPUESTA MODELO: Deben considerarse su experiencia previa, condición física, motivación, nivel educativo y proceso de adaptación a la vida militar. La instrucción debe ser clara, práctica, progresiva y repetida hasta alcanzar el estándar; integrar disciplina, seguridad, valores y conocimientos técnicos; brindar retroalimentación frecuente; y controlar de manera individual el dominio de las tareas esenciales antes de aumentar la complejidad.",

            "PREGUNTA 33 — Explique la estructura y progresión de los Ciclos de Capacitación en la EOT.",
            "RESPUESTA MODELO: La progresión comienza con el Ciclo de Formación Básica, que proporciona adaptación, valores, disciplina y destrezas militares comunes. Continúa con la formación para el rol, donde el soldado aprende las tareas específicas de su puesto. Luego se desarrollan etapas de perfeccionamiento, integración y mantenimiento de aptitudes. Cada ciclo debe apoyarse en el anterior y cerrar con una comprobación antes de avanzar.",
            "Referencia: RFD 51-03, Capítulo III, Sección V, art. 3.026, inc. b.2, aparts. a a c, pág. Cap. III-21 (PDF pág. 65); remisión al Anexo 22.",
            "PREGUNTA 34 — ¿De qué manera debe el instructor adaptar la Didáctica Especial Militar para motivar y lograr el estándar exigido en la tropa?",
            "RESPUESTA MODELO: Debe utilizar lenguaje claro, demostraciones correctas, práctica intensiva y situaciones relacionadas con el rol del soldado. Conviene dividir tareas complejas, explicar su utilidad, reconocer avances, corregir en forma inmediata y ofrecer oportunidades de recuperación. La exigencia debe mantenerse, pero el camino para alcanzar el estándar se adapta al ritmo y a las dificultades del grupo sin reducir el resultado esperado.",
            "Referencia: RFD 51-03, Capítulo III, Sección V, art. 3.027, incs. a.8 a a.11 y b.1 a b.6, págs. Cap. III-22 y III-23 (PDF págs. 66 y 67).",
            "PREGUNTA 35 — ¿Qué papel juegan las TTI en el seguimiento de las competencias alcanzadas por el soldado en la EOT?",
            "RESPUESTA MODELO: Las Tablas de Instrucción definen tareas, condiciones y estándares, y permiten registrar el progreso individual. Sirven para organizar la secuencia de capacitación, comprobar competencias, detectar necesidades de refuerzo y aportar información a la conducción. Su utilidad depende de que el registro refleje desempeños observados y no una mera formalidad administrativa.",
            "Referencia: RFD 51-03, Capítulo III, Sección III, art. 3.008, incs. a.1 y b, págs. Cap. III-10 y III-11 (PDF págs. 54 y 55); Sección VIII, art. 3.034, incs. a a i, pág. Cap. III-26 (PDF pág. 70).",
          ]
        },
        {
          titulo: "Sección VI Adiestramiento Operacional de Conjuntos",
          parrafos: [
            "PREGUNTA 36 — ¿Qué se entiende por Adiestramiento Operacional de Conjuntos y cuál es su diferencia sustancial con la instrucción individual?",
            "RESPUESTA MODELO: El AOC prepara fracciones y organizaciones para actuar coordinadamente en el cumplimiento de tareas operacionales. A diferencia de la instrucción individual, su objeto principal no es la destreza aislada de una persona, sino la integración del mando, los integrantes, los procedimientos, los apoyos y los medios. Evalúa el desempeño del conjunto frente a una misión y bajo condiciones determinadas.",
            "Referencia: RFD 51-03, Capítulo III, Sección VI, arts. 3.028, inc. a, y 3.029, págs. Cap. III-23 y III-24 (PDF págs. 67 y 68).",
            "PREGUNTA 37 — ¿Cómo se articula el AOC con la instrucción de cuadros y la instrucción de tropa?",
            "RESPUESTA MODELO: La EOC proporciona cuadros capaces de planear, conducir, supervisar y evaluar; la EOT aporta soldados competentes en sus funciones individuales. El AOC integra ambas capacidades en tareas colectivas. Si existen deficiencias individuales o de conducción, el rendimiento del conjunto se afecta; por eso los resultados del adiestramiento también retroalimentan los programas de cuadros y tropa.",
            "Referencia: RFD 51-03, Capítulo III, Sección VI, art. 3.029, pág. Cap. III-24 (PDF pág. 68).",
            "PREGUNTA 38 — Describa la importancia de las TTAO para certificar la eficacia táctica y técnica de una fracción.",
            "RESPUESTA MODELO: Las Tablas de Adiestramiento Operacional establecen tareas colectivas, condiciones de ejecución, estándares e indicadores. Permiten evaluar con criterios comunes si la fracción puede cumplir su misión, identificar brechas tácticas o técnicas y registrar su evolución. La certificación exige evidencias obtenidas durante ejecuciones representativas y no solamente la declaración de que la actividad fue realizada.",
            "Referencia: RFD 51-03, Capítulo III, Sección VI, art. 3.028, inc. i, págs. Cap. III-23 y III-24 (PDF págs. 67 y 68); art. 3.030, inc. a.4, pág. Cap. III-24 (PDF pág. 68).",
            "PREGUNTA 39 — ¿En qué consisten las Prácticas de Conjunto, los Ejercicios de Adiestramiento y las Tareas Tácticas de Adiestramiento Operacional?",
            "RESPUESTA MODELO: Las Prácticas de Conjunto integran inicialmente funciones y procedimientos parciales, con control cercano y posibilidad de repetir. Los Ejercicios de Adiestramiento presentan situaciones más completas en las que la organización aplica capacidades bajo una conducción definida. Las TTAO expresan las acciones colectivas esenciales que la fracción debe ejecutar conforme a condiciones y estándares. En conjunto, constituyen una progresión desde la coordinación básica hacia el desempeño operacional integrado.",
            "Referencia: RFD 51-03, Capítulo III, Sección VI, art. 3.030, incs. a y b, págs. Cap. III-24 y III-25 (PDF págs. 68 y 69).",
            "PREGUNTA 40 — ¿Cómo debe configurarse el escenario didáctico para que un ejercicio de adiestramiento simule de manera realista las exigencias del combate moderno?",
            "RESPUESTA MODELO: Debe representar la misión, el ambiente operacional, el terreno, la amenaza, la población, las comunicaciones, los apoyos y las restricciones relevantes. Puede incorporar incertidumbre, información incompleta, degradación tecnológica, presión temporal y necesidad de coordinación. El realismo debe ser funcional al objetivo y compatible con la seguridad, los recursos y el nivel de preparación. Cada estímulo debe provocar decisiones o acciones que puedan observarse y evaluarse.",
            "Referencia: RFD 51-03, Capítulo III, Sección VI, arts. 3.028, incs. b a j, y 3.030, incs. a y b, págs. Cap. III-23 a III-25 (PDF págs. 67 a 69).",
          ]
        },
        {
          titulo: "Secciones VII y VIII Reservas aprendizaje autónomo educación a distancia y tecnologías",
          parrafos: [
            "PREGUNTA 41 — ¿Cuáles son las particularidades a prever durante la ejecución de la educación operacional de las Reservas de la Fuerza?",
            "RESPUESTA MODELO: Debe considerarse la heterogeneidad de edades, experiencias, especialidades, condición física y tiempo disponible. La ejecución requiere diagnosticar conocimientos previos, concentrarse en competencias esenciales, actualizar doctrina y procedimientos, graduar las cargas, reforzar seguridad y prever modalidades combinadas. También debe facilitar la rápida integración de los reservistas a las organizaciones y funciones para las que puedan ser convocados.",
            "Referencia: RFD 51-03, Capítulo III, Sección VII, art. 3.031, pág. Cap. III-25 (PDF pág. 69); Anexo 24, apart. I.1 a I.3 y apart. II.1 a II.2, págs. A 24-1 a A 24-3 (PDF págs. 205 a 207).",
            "PREGUNTA 42 — Explique cómo se vincula la fase de ejecución con el aprendizaje autónomo en el ámbito militar.",
            "RESPUESTA MODELO: Durante la ejecución, el aprendizaje autónomo se concreta mediante consignas, materiales, plazos, tutorías y productos verificables. El educando organiza parte de su estudio, consulta fuentes, practica y controla su avance, pero actúa dentro de una orientación institucional. El instructor define la finalidad y los estándares, acompaña, responde consultas y comprueba los resultados. La autonomía complementa la enseñanza presencial y favorece la actualización permanente.",
            "Referencia: RFD 51-03, Capítulo III, Sección VIII, art. 3.032, incs. a a d, pág. Cap. III-25 (PDF pág. 69); remisiones al RFD 51-01, Cap. III, y RFD 51-02, art. 1.002.",
            "PREGUNTA 43 — ¿De qué forma interactúa la Educación a Distancia dentro de la fase de ejecución de la instrucción?",
            "RESPUESTA MODELO: La EaD permite desarrollar contenidos y actividades sin coincidencia física permanente entre instructor y educando. Durante la ejecución utiliza plataformas, materiales digitales, foros, videoconferencias, evaluaciones y tutorías. Puede aplicarse de modo sincrónico, asincrónico o combinado. Su eficacia exige consignas precisas, comunicación regular, accesibilidad, seguimiento y actividades que produzcan evidencias; no debe reducirse al envío de archivos para lectura.",
            "Referencia: RFD 51-03, Capítulo III, Sección VIII, art. 3.033, pág. Cap. III-26 (PDF pág. 70); remisión expresa al RFD 51-02, Cap. XII.",
            "PREGUNTA 44 — Describa la integración de las Tecnologías de la Información y la Comunicación en la Educación Operacional durante la ejecución práctica.",
            "RESPUESTA MODELO: Las TIC apoyan la presentación de contenidos, simulación, comunicación, acceso a doctrina, trabajo colaborativo, registro del desempeño y retroalimentación. Pueden incluir plataformas educativas, simuladores, cartografía digital, sistemas de mando y control de entrenamiento y recursos multimedia. Deben seleccionarse por su aporte al objetivo, proteger la información, prever fallas y mantener alternativas. La tecnología es un medio; no sustituye la práctica ni la conducción del educador.",
            "Referencia: RFD 51-03, Capítulo III, Sección VI, art. 3.028, inc. c, pág. Cap. III-23 (PDF pág. 67); Sección VIII, art. 3.032, inc. c, pág. Cap. III-25 (PDF pág. 69); remisiones al Cap. I, Sección III, Anexo 3 y Cap. V.",
            "PREGUNTA 45 — Elabore una síntesis que explique de qué modo la fase de ejecución se conecta con la fase de Evaluación para cerrar el ciclo de gestión educativa.",
            "RESPUESTA MODELO: La ejecución produce las actuaciones y evidencias que la evaluación necesita para determinar el grado de logro. Durante la actividad, el instructor observa, registra, pregunta y retroalimenta; al finalizar, compara el desempeño con los estándares e indicadores. Los resultados permiten acreditar aprendizajes, disponer recuperaciones y revisar contenidos, métodos, medios y condiciones. Esa información vuelve al planeamiento y mejora la siguiente ejecución, cerrando un ciclo continuo de planear, ejecutar, evaluar y ajustar. Síntesis final La fase de ejecución integra tres pasos: Inicio, Desarrollo y Final. En ellos, el educador orienta, demuestra, organiza la práctica, observa y retroalimenta; el educando participa, aplica, decide y produce evidencias. Este proceso adopta modalidades diferentes según se trate de formación ética, materias técnicas, combate, tiro, educación de cuadros, tropa o adiestramiento de conjuntos, pero conserva principios comunes: finalidad, actividad, progresión, realismo, seguridad y comprobación del aprendizaje. La ejecución se enlaza con la evaluación porque toda actividad debe generar evidencias comparables con un estándar. Los resultados permiten acreditar capacidades, corregir deficiencias y ajustar el planeamiento posterior. De esta manera, la gestión educativa mantiene continuidad y orienta el esfuerzo hacia el desempeño profesional requerido por la Fuerza. Bibliografía orientativa Ejército Argentino. RFD 51-03 Didáctica Especial Militar. Edición vigente. Ejército Argentino. RFD 51-02 Acciones Educativas. Edición vigente. Ejército Argentino. RFD 51-01 Educación en el Ejército. Edición vigente.",
            "Referencia: RFD 51-03, Capítulo III, Sección I, art. 3.001, inc. d, pág. Cap. III-1 (PDF pág. 45); Sección V, art. 3.027, inc. c.1 y c.2, pág. Cap. III-23 (PDF pág. 67); remisión al Capítulo IV.",
          ]
        },
      ],
