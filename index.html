      {
      id: "log_tp2",
      nombre: "Logística · Guía de Estudio TP N.º 2",
      desc: "Guía de estudio del TP N.º 2 (ROD 19-01 y 19-02, RFD 20-01 y 21-01): Logística de Personal y de Material, Arsenales y Mantenimiento. Leé el desarrollo, repasá conceptos y cronología, y autoevaluate con opción múltiple y V/F.",
      secciones: [
        {
          titulo: "Los 13 puntos de la guía",
          parrafos: [
            "Logística — TP N.º 2: Logística de Personal · Logística de Material · Arsenales · Mantenimiento.",
            "Objetivo: comprender los conceptos y poder responderlos de manera breve, clara y doctrinaria.",
            "Consignas: 1) Servicios de Logística de Personal. 2) Sistemas de Logística de Personal. 3) Misión del servicio necrológico. 4) Funciones de Logística de Personal. 5) Funciones del Servicio de Construcciones. 6) Definición de Logística de Material. 7) Sistemas logísticos. 8) Sistema Logístico del Ejército. 9) Efectos Finales de Arsenales regulados. 10) Efectos Finales no regulados. 11) Tipos de efectos. 12) Mantenimiento preventivo. 13) Mantenimiento correctivo.",
          ]
        },
        {
          titulo: "Servicios de Logística de Personal",
          parrafos: [
            "La doctrina los define como el conjunto de estructuras y medios que, adecuadamente organizados, instruidos, adiestrados y operados, ejecutan funciones, actividades y tareas de logística de personal.",
            "Su accionar se relaciona en forma particular —aunque no exclusiva— con el mantenimiento de la moral. Son seis servicios: Religioso, Justicia Militar, Sanidad, Postal, Banda y Especiales.",
            "Referencia: ROD 19-01, Cap I, art. 1.006.",
          ]
        },
        {
          titulo: "Sistemas de Logística de Personal",
          parrafos: [
            "Un Sistema de Personal es el conjunto de organizaciones, procedimientos y medios que trabajan coordinadamente para permitir el desarrollo integral de las funciones de personal.",
            "Los sistemas son cinco: Reemplazos, Prisioneros de Guerra, Necrológico, Sanidad y Postal.",
            "Referencia: ROD 19-01, Cap I, art. 1.007.",
          ]
        },
        {
          titulo: "Función y Sistema Necrológico",
          parrafos: [
            "La función necrológica dirige las actividades relacionadas con el personal fallecido: búsqueda y recolección, identificación, registro, evacuación, sepultura o disposición temporal de los restos, y el cuidado y disposición de los efectos personales.",
            "El sistema necrológico reúne organizaciones, instalaciones y personal escalonados en profundidad para ejecutar esa función en operaciones.",
            "Finalidades principales: contribuir al mantenimiento de la moral; crear condiciones adecuadas de sanidad; y cumplir el derecho internacional de los conflictos armados y las normas aplicables.",
            "Actividades fundamentales: búsqueda, recolección y evacuación de restos; identificación y disposición temporal; recolección y disposición de efectos personales; establecimiento y funcionamiento de cementerios militares; preparación de registros e informes.",
          ]
        },
        {
          titulo: "Funciones de Logística de Personal",
          parrafos: [
            "Son agrupamientos convencionales de actividades de personal que persiguen un objetivo común y poseen características técnicas homogéneas, para hacer efectivo el apoyo a las fuerzas mediante servicios. Son once funciones.",
            "Referencia: ROD 19-01, Cap I, art. 1.003.",
          ]
        },
        {
          titulo: "Servicio de Construcciones",
          parrafos: [
            "Dentro del ROD 19-01, Construcciones aparece como una actividad concurrente al campo de Logística de Personal y como un servicio que contribuye al mantenimiento de la moral mediante sus funciones propias.",
            "En operaciones, la atención se centra en procurar el máximo confort posible en las posiciones o alojamientos, siempre compatible con la misión. Las actividades se canalizan por el personal de Construcciones y se coordinan entre el área de Material y el área de Personal.",
            "Referencia: ROD 19-01, Cap VIII, art. 8.020.",
          ]
        },
        {
          titulo: "Logística de Material",
          parrafos: [
            "Es el campo de interés de la conducción que comprende el planeamiento y la ejecución de las acciones necesarias para apoyar con bienes y servicios a la fuerza y garantizar, en forma permanente, su sostén material.",
            "Los recursos materiales son los bienes y servicios empleados para sostener las operaciones. Su obtención, administración, distribución, mantenimiento y empleo deben integrarse al planeamiento de la fuerza.",
            "Referencia: ROD 19-02, Cap I.",
          ]
        },
        {
          titulo: "Sistemas logísticos",
          parrafos: [
            "Un sistema logístico es el conjunto de estructuras orgánicas, medios, procedimientos y métodos que permiten desarrollar las funciones logísticas. Su misión es hacer interactuar ordenadamente los recursos humanos y materiales para alcanzar con efectividad los objetivos establecidos.",
            "El RFD 20-01 señala que las acciones del Sistema Logístico del Ejército se encuentran condicionadas por la existencia de un Sistema Logístico Militar y de un Sistema Logístico Nacional.",
          ]
        },
        {
          titulo: "Sistema Logístico del Ejército",
          parrafos: [
            "Es la combinación de medios y procedimientos que, a partir de un régimen funcional, permite asegurar el sostén logístico a la Fuerza mediante una estructura adaptada a una situación particular.",
            "En palabras simples: determina cómo se organizan y relacionan los medios logísticos del Ejército para que el apoyo llegue a quien lo necesita, en la cantidad, lugar y oportunidad requeridos.",
            "Referencia: RFD 20-01, Cap I, art. 1.003.",
          ]
        },
        {
          titulo: "Efectos Finales de Arsenales",
          parrafos: [
            "Regulados: son los efectos finales que influyen notoriamente en la capacidad operacional de los elementos por su costo, complejidad, dificultad de obtención, peligrosidad y/o escasez. Su administración es centralizada: el Estado Mayor General del Ejército, por el área de Material, establece su administración y la Dirección de Arsenales ejecuta las actividades que le corresponden.",
            "No regulados: son aquellos que no se encuentran incluidos en los índices de Efectos Finales de Arsenales regulados. Su obtención, distribución y baja se ejecutan según el régimen establecido y las necesidades de dotación o reposición, manteniendo el control patrimonial.",
            "Tipos administrativos principales: Efectos Finales Regulados, Efectos Finales No Regulados, Efectos Clase V y V(A), y Repuestos de Arsenales. Los repuestos pueden ser controlados (por su importancia, costo elevado y/o difícil obtención son administrados por el nivel superior) o no controlados.",
          ]
        },
        {
          titulo: "Mantenimiento preventivo",
          parrafos: [
            "Comprende las acciones y servicios planificados que se realizan para conservar el material en condiciones de funcionamiento, detectar oportunamente novedades y evitar o reducir la aparición de fallas.",
            "Características: se realiza antes de que una falla deje fuera de servicio al efecto; es periódico y programable; incluye controles, limpieza, verificación, lubricación y los servicios indicados por la documentación técnica; puede comprender servicios diarios, semanales, periódicos y en condiciones adversas; debe registrarse y programarse conforme a los formularios y publicaciones técnicas.",
          ]
        },
        {
          titulo: "Mantenimiento correctivo",
          parrafos: [

            "Se origina por una falla o desperfecto detectado; busca recuperar la aptitud de servicio; cuando la reparación supera la capacidad del escalón, el efecto pasa al nivel de mantenimiento que corresponda; las reparaciones quedan registradas conforme a la documentación reglamentaria.",
          ]
        },
        {
          titulo: "Preventivo vs. Correctivo",
          parrafos: [
            "La diferencia esencial es temporal y funcional: el preventivo actúa antes de que una falla importante deje el material fuera de servicio; el correctivo interviene para recuperar la aptitud cuando existe un defecto o avería que requiere reparación o reemplazo.",
            "Regla de estudio: preventivo = conservar evitando fallas; correctivo = reparar después de la falla.",
          ]
        },

      secciones: [
        {
          titulo: "¿Qué es la logística?",
          parrafos: [
            "La logística es el conjunto de actividades destinadas a brindar sostén a las fuerzas, proporcionando los recursos que éstas necesitan con la aptitud adecuada, en la cantidad y calidad requeridas y en el tiempo y lugar oportunos.",
            "Su finalidad esencial es contribuir a que la Fuerza disponga y mantenga la capacidad operacional necesaria para cumplir la misión.",
            "Doctrinariamente la logística no se limita al movimiento de abastecimientos: integra el apoyo logístico de personal, de material, de finanzas y de asuntos territoriales, con coordinación estrecha desde los escalones inferiores hasta los máximos niveles.",
          ]
        },
        {
          titulo: "¿Qué es un efecto?",
          parrafos: [
            "En el lenguaje logístico militar, un efecto o abastecimiento es todo elemento necesario para el equipamiento, mantenimiento y operaciones de las tropas. Abarca bienes consumibles y durables, repuestos y materiales de apoyo.",
            "El reglamento incluye subsistencias, vestuario, equipos, armamento, municiones, combustibles y lubricantes, materiales generales, maquinarias, partes, herramientas y repuestos.",
            "No debe confundirse con “efecto final”, expresión utilizada por Arsenales para bienes completos con regímenes específicos de administración y control.",
          ]
        },
        {
          titulo: "El ciclo logístico",
          parrafos: [
            "Es el proceso obligado mediante el cual se resuelve un problema logístico, cualquiera sea su magnitud. Comprende actividades escalonadas en secuencia lógica destinadas a crear, sostener y mantener las fuerzas.",
            "Fases: a) Determinación de requerimientos: identificar, definir, valorar y traducir la necesidad en un requerimiento concreto (fase crítica). b) Obtención: conseguir los recursos reales capaces de satisfacerla. c) Distribución: hacer llegar los recursos obtenidos a la fuerza, en el lugar y oportunidad requeridos.",
            "Las fases son correlativas e interdependientes; el ciclo se repite en los diferentes escalones de comando.",
          ]
        },
        {
          titulo: "Especialidades y servicios de la logística del material",
          parrafos: [
            "Son la parte de la estructura del Instrumento Militar Terrestre organizada, equipada e instruida para planear y ejecutar las actividades de material.",
            "1) Especialidad de Arsenales: potencia de fuego, movilidad, medios electrónicos, materiales de ingenieros, equipos especiales, máquinas y herramientas; abastecimiento y mantenimiento.",
            "2) Especialidad de Intendencia: alimentación, vestuario y equipo, alojamiento, materiales de oficina y escritura, muebles, combustibles y lubricantes.",
            "3) Servicio de Transporte: desplazamiento de personal y abastecimientos mediante medios no orgánicos del usuario.",
            "4) Servicio de Construcciones y Bienes Raíces: construcción, reparación y mantenimiento de instalaciones e infraestructura, y gestión de bienes raíces.",
            "5) Servicio de Veterinaria: aptitud de los animales, abastecimientos veterinarios, prevención de zoonosis e inspección de productos alimenticios.",
          ]
        },
        {
          titulo: "Funciones de abastecimiento",
          parrafos: [
            "Abastecimiento es la función logística mediante la cual se determinan, obtienen, administran, almacenan, distribuyen y, cuando corresponde, evacúan o dan de baja los efectos necesarios para el sostenimiento de la Fuerza.",
            "Actividades principales (RFD 20-01): determinación de necesidades, catalogación, obtención, control de existencias, almacenamiento, distribución, evacuación o recolección, disposición final y baja.",
          ]
        },
        {
          titulo: "Efectos Clase I, II, III, IV y V",
          parrafos: [
            "Clase I: Alimentos y artículos de consumo relativamente uniforme para personal y ganado (víveres, raciones especiales, agua, artículos de cantina).",
            "Clase II: Efectos de uso terrestre con asignaciones prescriptas en los Cuadros de Organización (vehículos, repuestos de dotación, herramientas, vestuario, equipos y armamento).",
            "Clase III: Combustibles y lubricantes para vehículos, equipos y maquinarias de empleo terrestre.",
            "Clase IV: Efectos no previstos en los Cuadros de Organización y efectos de refuerzo a los de Clase II.",
            "Clase V: Municiones de uso terrestre; también explosivos, minas, espoletas, detonadores, efectos pirotécnicos y otros explosivos.",
            "Para el parcial basta dominar las cinco clases principales y un ejemplo representativo de cada una.",
          ]
        },
        {
          titulo: "Mantenimiento preventivo y correctivo",
          parrafos: [
            "Preventivo: cuidado proporcionado al equipo para conservarlo en condiciones de funcionamiento; incluye inspecciones, lubricación, limpieza, detección y corrección de fallas incipientes. Actúa antes de que una falla lo deje fuera de servicio.",
            "Correctivo: se ejecuta para restituir un equipo a sus condiciones normales de funcionamiento; comprende cambio de partes, reparaciones, ajustes, calibraciones, modificaciones y asistencia técnica.",
            "Diferencia esencial: temporal y funcional. El preventivo evita la falla; el correctivo recupera el material cuando el defecto ya existe.",
          ]
        },
        {
          titulo: "Efectos regulados / no regulados y repuestos controlados / no controlados",
          parrafos: [
            "Efectos finales regulados de Arsenales: influyen notoriamente en la capacidad operacional por costo, complejidad, dificultad de obtención, peligrosidad y/o escasez; administración centralizada y controlada.",
            "Efectos finales no regulados: no se encuentran incluidos en los índices de regulados; régimen administrativo menos restrictivo, con control patrimonial.",
            "Repuestos controlados: por importancia, elevado costo y/o difícil obtención se administran por el nivel superior; se vinculan con conjuntos y subconjuntos.",
            "Repuestos no controlados: los que no figuran en la lista de controlados; mayor descentralización.",
            "Regla de estudio: “regulado” refiere a la administración de efectos finales y “controlado” a la administración de repuestos.",
          ]
        },
        {
          titulo: "Tipos de inspección: formales e informales",
          parrafos: [
            "Inspección formal: organizada y preparada con antelación, ejecutada según una orden, guía o plan de control; requiere coordinación previa, determinación de los aspectos a verificar, formularios o planillas y registro de resultados.",
            "Inspección informal: control más flexible y frecuente, ejecutado personalmente por el jefe o personal calificado; puede usar total o parcialmente los procedimientos y formularios de las formales. Aun informal, el jefe debe contar con una guía o planilla de control y dejar asentado el resultado.",

          ]
        },
        {
          titulo: "Funciones de la logística del material",

            "Deben entenderse como partes interrelacionadas de un mismo sistema: la eficacia del apoyo depende de su coordinación.",

  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

function estUid(){ return LS.get('est_uid', ''); }
function estUsuario(){ var u = estUid(); if (!u) return null; var r = estUsuarios().filter(function(x){ return x.id === u; }); return r.length ? r[0] : null; }
function estGuardarUsuarios(list){ LS.set('est_usuarios', list); }

var KEYEX = function(id){ return 'est_' + KEYU() + 'exmateria_' + id; };
function fallosTema(id){ return LS.get(KEYF(id), {}); }
function hashP(p){ var s = String(p).toLowerCase(); var h = 0; for (var i = 0; i < s.length; i++){ h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; } return (h >>> 0).toString(36); }
function sumarFallo(id, p){ var f = fallosTema(id); var k = hashP(p); f[k] = (f[k] || 0) + 1; LS.set(KEYF(id), f); }
function restarFallo(id, p){ var f = fallosTema(id); var k = hashP(p); if (f[k] > 0){ f[k]--; } LS.set(KEYF(id), f); }
function ESTRELLAS(id){ return 'est_' + KEYU() + 'estr_' + id; }
function estrellasTema(id){ return LS.get(ESTRELLAS(id), []); }
function esEstrella(id, p){ return estrellasTema(id).indexOf(hashP(p)) !== -1; }
function toggleEstrella(id, p, btn){
  var list = estrellasTema(id);
  var k = hashP(p);
  var i = list.indexOf(k);
  if (i === -1) list.push(k); else list.splice(i, 1);
  LS.set(ESTRELLAS(id), list);
  if (btn){
    var on = i === -1;
    btn.classList.toggle('on', on);
    btn.innerHTML = on ? '⭐ Guardada' : '☆ Guardar para repasar';
  }
}

function evTipo(t){ return t === 'examen' ? '📝' : t === 'tp' ? '📄' : t === 'parcial' ? '🗂' : t === 'entrega' ? '📩' : '📍'; }
function evTipoNombre(t){ return t === 'examen' ? 'Examen' : t === 'tp' ? 'Trabajo práctico' : t === 'parcial' ? 'Parcial' : t === 'entrega' ? 'Entrega' : 'Evento'; }
function evFaltan(iso){
  if (!iso) return null;
  var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  var p = iso.split('-');
  var f = new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1); f.setHours(0, 0, 0, 0);
  return Math.round((f - hoy) / 86400000);
}
function evFechaTxt(iso){
  if (!iso) return '';
  var p = iso.split('-');
  var meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  return (+p[2]) + ' ' + meses[(+p[1]) - 1];
}
function evRestante(iso){
  var d = evFaltan(iso);
  if (d === null) return '';
  if (d < 0) return 'hace ' + (-d) + (Math.abs(d) === 1 ? ' día' : ' días');
  if (d === 0) return '¡hoy!';
  if (d === 1) return 'mañana';
  return 'faltan ' + d + ' días';
}

function pintarCalendario(body){

  var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  function futuro(e){ var d = evFaltan(e.fecha); return d !== null ? d >= 0 && !e.hecho : false; }
  var futuros = list.filter(futuro);
  var pasados = list.filter(function(e){ return !futuro(e); });
  var h = '<div class="row" style="margin-bottom:10px"><button class="bigbtn ghost" onclick="home()">← Inicio</button></div>' +
    '<button class="bigbtn" style="width:100%;margin-bottom:12px" onclick="formEvento()">＋ Agregar fecha</button>';
  if (!list.length){
    h += '<div class="card"><h3>Tu calendario 📅</h3><p class="sub">Cargá exámenes, entregas de trabajos prácticos, parciales o cualquier fecha importante. La app te avisa cuánto falta y te sugiere qué estudiar: "Te quedan 6 días para rendir Técnica, ¿hacemos un cuestionario rápido?"</p>' +
      '<button class="bigbtn okbtn" onclick="formEvento()">Cargar mi primer fecha</button></div>';
  }
  function card(e, atrasado){
    var dias = evFaltan(e.fecha);
    var urg = dias !== null && !e.hecho && dias <= 3;
    return '<div class="card" style="' + (urg ? 'border-left:4px solid var(--bad)' : e.hecho ? 'opacity:.55' : 'border-left:4px solid var(--accent)') + '">' +
      '<div class="mini"><div><span class="sec-badge">' + evTipo(e.tipo) + ' ' + evTipoNombre(e.tipo) + '</span><b style="display:block;margin-top:6px">' + esc(e.titulo) + '</b>' +
      '<div class="note" style="margin-top:4px">📅 ' + evFechaTxt(e.fecha) + ' · <b style="color:' + (e.hecho ? 'var(--muted)' : urg ? 'var(--bad)' : 'var(--accent)') + '">' + (e.hecho ? 'hecho ✓' : evRestante(e.fecha)) + '</b></div>' +
      (e.nota ? '<div class="note" style="margin-top:4px">' + esc(e.nota) + '</div>' : '') +
      sugerenciaEvento(e, dias) +
      '</div><div class="der">' +
      '<button class="x" style="background:var(--ok)" onclick="toggleHecho(\'' + e.id + '\')" title="Marcar hecho">✓</button>' +
      '<button class="x" style="background:var(--accent)" onclick="formEvento(\'' + e.id + '\')">✏</button>' +
      '<button class="x" onclick="borrarEvento(\'' + e.id + '\')">🗑</button></div></div></div>';
  }
  h += '<div class="hdiv"><h3>Próximos</h3><div class="line"></div></div>' + (futuros.length ? futuros.map(function(e){ return card(e, false); }).join('') : '<div class="msg">No hay fechas próximas. ¡Agregá una arriba!</div>');
  if (pasados.length){
    h += '<div class="hdiv"><h3>Anteriores</h3><div class="line"></div></div>' + pasados.map(function(e){ return card(e, true); }).join('');
  }
  body.innerHTML = h;
}

function guardarEvento(id){

    nota: ((document.getElementById('evNota') || {}).value || '').trim(),
    hecho: id ? (list.filter(function(x){ return x.id === id; })[0] || {}).hecho : false
  };
  if (id){ list = list.map(function(x){ return x.id === id ? obj : x; }); }
  else { list.push(obj); }
  evSet(list);
  tg('🗓 ' + nombreUsuario() + ' (' + devTag() + ') cargó "' + obj.titulo + '" (' + obj.fecha + ')', 'ev');

function sugerenciaEvento(e, dias){

  if (dias === 0) msg = '¡Hoy es el evento! Respirá, repasá los conceptos y a dar todo. 💪';
  else if (dias === 1) msg = '¡Mañana es! Hacé un repaso exprés de conceptos antes de dormir. 🌙';
  else if (dias <= 3) msg = 'Te quedan ' + dias + ' días. Ideal para un <b>cuestionario rápido</b> y ver qué te falta.';
  else if (dias <= 7) msg = 'Tenés ' + dias + ' días: mejor momento para un cuestionario y repaso con tarjetas.';
  else msg = 'Quedan ' + dias + ' días. Empezá con calma: leé, repasá conceptos y hacé un cuestionario corto.';

  var duros = LS.get('est_duros_' + t.id, []);
  function pintar(){

        '</div></div>';

    }

    var pct = Math.round((i / cards.length) * 100);
    body.innerHTML = '<div class="card"><div class="prog"><i style="width:' + pct + '%"></i></div>' +
      '<div class="note" id="repasoInfo">' + (i + 1) + ' de ' + cards.length + '</div>' +
      '<div class="flip" id="flash" onclick="this.classList.toggle(\'flipped\')"><div class="inner">' +
      '<div class="face">' + c.t + '</div><div class="face back"><small>tocá para ver</small>' + c.d + '</div>' +
      '</div></div>' +
      '<div class="rates">' +
      '<button class="badbtn" onclick="rate(0)">Otra vez</button>' +
      '<button style="background:#e58e00" onclick="rate(1)">Difícil</button>' +

      '<button class="ghost bigbtn" onclick="atras()">← Atrás</button>' +
      '<button class="bigbtn" onclick="sig()">Siguiente →</button></div></div>';

  window.sig = function(){ i++; pintar(); };
  window.rate = function(k){

    i++;

  };
  function paintInner(){ pintar(); }
  pintar();
}

function ayPantalla(){

  if (p === 'ficha') return 'una ficha de concepto';
  return 'una unidad';
}

function aySugiere(q){

function ayResponde(q){
  var n = norm(q);
  if (!n) return '¿Me contás qué querés saber? Tocá alguna sugerencia o escribí tu pregunta 👇';
  var mejor = null, mejorN = 0;
  AY.forEach(function(r){
    var s = 0;
    r.k.forEach(function(pal){
      if (n.indexOf(norm(pal)) !== -1) s += pal.replace(/\s+/g, '_').length + 2;
    });
    if (s > mejorN){ mejorN = s; mejor = r; }
  });
  if (mejor) return mejor.r();
  return '😅 No estoy segura de entender esa pregunta todavía.<br>Probá escribiendo cosas como:<br>• "¿Cómo arranco a estudiar?"<br>• "¿Qué es el repaso inteligente?"<br>• "¿Qué son las medallas?"<br>• "¿Cómo agrego una fecha al calendario?"';
}
